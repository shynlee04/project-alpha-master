# _bmad-ext/MANIFEST.yaml
# BMAD Extension Layer Registry - DO NOT DELETE
# This layer wraps BMAD core without modifying it

schema_version: "1.0.0"
created: "2026-01-10"
updated: "2026-01-10"
status: "ACTIVE"

# ═══════════════════════════════════════════════════════════════════════════
# PURPOSE
# ═══════════════════════════════════════════════════════════════════════════

purpose: |
  Extension layer that wraps BMAD core without modifying it.
  BMAD core (_bmad/) can be updated independently.
  All customizations live here and are preserved across BMAD updates.
  
  Key capabilities added:
  - Enhanced agents with orchestration hooks
  - Handoff protocol between agents
  - Unified loop state with anti-hallucination anchoring
  - Parent/child artifact linking
  - Dynamic sub-agent delegation

# ═══════════════════════════════════════════════════════════════════════════
# COMPATIBILITY
# ═══════════════════════════════════════════════════════════════════════════

compatibility:
  bmad_core_version: ">=6.0.0"
  tested_with: "6.0.0"
  bmad_master_version: "3.2.0"

# ═══════════════════════════════════════════════════════════════════════════
# ENTRY POINTS
# ═══════════════════════════════════════════════════════════════════════════

entry_points:
  primary: "orchestrator/master-orchestrator.md"
  fallback: "agents/dev-ext.md"
  
  platform_commands:
    augment: ".augment/commands/bmad-ext/"
    cursor: ".cursor/commands/bmad-ext/"
    claude: ".claude/commands/bmad-ext/"

# ═══════════════════════════════════════════════════════════════════════════
# MODULES
# ═══════════════════════════════════════════════════════════════════════════

modules:
  orchestrator:
    path: "orchestrator/"
    status: "PENDING"  # Will be ACTIVE after Phase 3
    files:
      - "master-orchestrator.md"
      - "delegation-protocol.md"
      - "routing-rules.yaml"
      - "escalation-protocol.md"
      - "governance-auto-update.md"
    
  agents:
    path: "agents/"
    count: 9
    status: "PENDING"  # Will be ACTIVE after Phase 2
    wrapped_from: "_bmad/bmm/agents/"
    files:
      - "_template-enhanced-agent.md"
      - "dev-ext.md"
      - "architect-ext.md"
      - "analyst-ext.md"
      - "pm-ext.md"
      - "sm-ext.md"
      - "tea-ext.md"
      - "tech-writer-ext.md"
      - "ux-designer-ext.md"
      - "quality-scanner-ext.md"
    
  workflows:
    path: "workflows/"
    count: 3
    status: "PENDING"  # Will be ACTIVE after Phase 2
    files:
      - "story-cycle/workflow.md"
      - "remediation-cycle/workflow.md"
      - "governance-cycle/workflow.md"
    
  state:
    path: "state/"
    status: "PENDING"  # Will be ACTIVE after Phase 1
    files:
      - "LOOP_STATE.yaml"
      - "ARTIFACT_REGISTRY.yaml"
      - "DELEGATION_LOG.yaml"

  schemas:
    path: "schemas/"
    status: "PENDING"
    files:
      - "handoff-artifact.schema.yaml"
      - "loop-state.schema.yaml"
      - "delegation.schema.yaml"

  hooks:
    path: "hooks/"
    status: "PENDING"
    files:
      - "pre-execution.md"
      - "post-execution.md"
      - "on-error.md"
      - "on-stale.md"

# ═══════════════════════════════════════════════════════════════════════════
# INTEGRATION POINTS
# ═══════════════════════════════════════════════════════════════════════════

integration_points:
  # What we READ from BMAD core (never modify)
  reads_from:
    - path: "_bmad/bmm/agents/*.md"
      purpose: "Inherit agent personas and principles"
    - path: "_bmad/core/agents/bmad-master.md"
      purpose: "Reference routing tables"
    - path: "_bmad/modules/governance/checklists/*.yaml"
      purpose: "Use existing validation gates"
    - path: "_bmad/modules/quality/scanners/*.md"
      purpose: "Invoke scanners"
      
  # What we WRITE to (extension owns these)
  writes_to:
    - path: "_bmad-ext/state/LOOP_STATE.yaml"
      purpose: "Unified loop state"
    - path: "_bmad-ext/state/ARTIFACT_REGISTRY.yaml"
      purpose: "Artifact tracking"
    - path: "_bmad-output/handoffs/"
      purpose: "Handoff artifacts"
      
  # What we UPDATE (shared files)
  updates:
    - path: "bmm-workflow-status.yaml"
      purpose: "Story completion status"
    - path: "AGENTS.md"
      purpose: "Governance updates every 3 stories"
    - path: "_bmad-output/sprint-artifacts/sprint-status.yaml"
      purpose: "Sprint progress"

# ═══════════════════════════════════════════════════════════════════════════
# GOVERNANCE
# ═══════════════════════════════════════════════════════════════════════════

governance:
  update_agents_md_every: 3  # stories
  stale_threshold_hours: 4
  max_delegation_depth: 3
  max_iterations_per_session: 100
  
  anti_hallucination:
    require_human_intent_anchor: true
    staleness_threshold_hours: 4
    auto_invalidate_stale: true


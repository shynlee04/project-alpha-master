## Event Queue Management

### Queue Structure

```yaml
event_queue:
  schema_version: "1.0.0"
  
  # Priority levels
  priority_levels:
    critical: 100
    high: 75
    medium: 50
    low: 25
    
  # Queue entries
  entries: []
  
  # Statistics
  stats:
    total_events: 0
    pending_events: 0
    processed_events: 0
    failed_events: 0
    avg_processing_time_ms: 0
```

### Queue Entry Format

```yaml
queue_entry:
  - event_id: "evt-{uuid}"
    event_type: "validation_required"
    priority: "high"
    priority_score: 75
    status: "pending" | "processing" | "handled" | "failed"
    created_at: "2026-01-11T10:00:00Z"
    triggered_by: "workflow-id step-03"
    
    payload:
      validation_type: "typescript"
      target: "src/domain/services/file-lock.ts"
      
    handlers:
      - type: "bmad-master"
        status: "pending"
        
    result: null
    handled_at: null
    processing_time_ms: null
    
    retry_count: 0
    max_retries: 2
    last_error: null
```


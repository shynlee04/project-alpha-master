## State Persistence

### Event State in LOOP_STATE

```yaml
loop_state:
  event_bus:
    queue_id: "{queue-id}"
    
    current_event: null
    
    pending_events: []
    
    processed_events: []
    
    failed_events: []
    
    handlers:
      validation: "active"
      context: "active"
      investigation: "active"
      research: "active"
      error: "active"
      
  workflow_chain:
    active_chain: null
    pending_workflows: []
    active_workflow: null
    
  sub_agents:
    delegations:
      active: []
      completed: []
      failed: []
```


## Handler Implementations

### Handler: validation_handler

```yaml
handler:
  id: "validation_handler"
  type: "coordinator"
  for_events: ["validation_required"]
  
  steps:
    - name: "Create coordination request"
      action: "create_coordination_request"
      
    - name: "Send to bmad-master"
      action: "delegate_to_bmad_master"
      
    - name: "Await validation result"
      action: "await_callback"
      
    - name: "Process validation result"
      action: "update_event_with_result"
      
    - name: "Resume or route"
      action: "route_based_on_result"
```

### Handler: context_handler

```yaml
handler:
  id: "context_handler"
  type: "delegator"
  for_events: ["context_needed"]
  
  steps:
    - name: "Select appropriate sub-agent"
      action: "select_agent"
      rules:
        - when: "context_type == 'domain_scan'"
          agent: "domain-scanner"
        - when: "context_type == 'file_scan'"
          agent: "context-validator"
          
    - name: "Create delegation request"
      action: "create_delegation_request"
      
    - name: "Delegate to sub-agent"
      action: "delegate"
      
    - name: "Await context bundle"
      action: "await_callback"
      
    - name: "Update workflow context"
      action: "update_workflow_context"
```

### Handler: investigation_handler

```yaml
handler:
  id: "investigation_handler"
  type: "delegator"
  for_events: ["investigation_triggered"]
  
  steps:
    - name: "Select investigator"
      action: "select_agent"
      rules:
        - when: "investigation_type in ['state_boundary', 'sync_fragmentation']"
          agent: "architect-ext"
        - else:
          agent: "analyst-ext"
          
    - name: "Create investigation brief"
      action: "create_delegation_request"
      
    - name: "Delegate investigation"
      action: "delegate"
      
    - name: "Await investigation report"
      action: "await_callback"
      
    - name: "Process findings"
      action: "process_investigation_report"
```

### Handler: research_handler

```yaml
handler:
  id: "research_handler"
  type: "delegator"
  for_events: ["research_required"]
  
  steps:
    - name: "Create research brief"
      action: "create_delegation_request"
      
    - name: "Delegate to researcher"
      action: "delegate"
      
    - name: "Await research findings"
      action: "await_callback"
      
    - name: "Integrate findings"
      action: "integrate_research_findings"
```

### Handler: error_handler

```yaml
handler:
  id: "error_handler"
  type: "coordinator"
  for_events: ["workflow_error"]
  
  steps:
    - name: "Assess error"
      action: "analyze_error"
      
    - name: "Determine recovery"
      action: "determine_recovery_strategy"
      
    - when: "recoverable == true"
      steps:
        - name: "Attempt recovery"
          action: "recover"
          
        - name: "If recovery failed, escalate"
          action: "escalate_to_bmad_master"
          
    - when: "recoverable == false"
      steps:
        - name: "Escalate to bmad-master"
          action: "escalate_to_bmad_master"
```


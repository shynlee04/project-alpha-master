## Event-Driven Workflow Triggers

### Example: Workflow with Event Triggers

```yaml
workflow:
  id: "story-cycle"
  name: "Story Development Cycle"
  
  steps:
    - id: "step-01"
      name: "Initialize"
      
    - id: "step-02"
      name: "User Journey Validation"
      
    - id: "step-03"
      name: "Agent Tool Specification"
      events:
        on_complete:
          - event: "agent_tool_spec_generated"
            
    - id: "step-04"
      name: "Implementation"
      
    - id: "step-05"
      name: "Testing"
      
    - id: "step-06"
      name: "Reality Check"
      
    - id: "step-07"
      name: "Review"
      
  # Event triggers that can switch workflows
  event_triggers:
    - event: "context_needed"
      condition: "step in ['step-04', 'step-05']"
      action: "switch_to_workflow"
      target_workflow: "context-gathering"
      
    - event: "validation_required"
      condition: "step in ['step-04', 'step-06']"
      action: "pause_and_coordinate"
      coordinator: "bmad-master"
      
    - event: "research_required"
      condition: "step == 'step-03'"
      action: "switch_to_workflow"
      target_workflow: "research"
      
    - event: "workflow_error"
      condition: "any step"
      action: "handle_error"
```


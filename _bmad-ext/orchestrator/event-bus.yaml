# Event Bus System for BMAD Extension

**Version**: 1.0.0  
**Created**: 2026-01-11  
**Purpose**: Define event types, handlers, and routing for event-driven workflow system

---

## Event Bus Architecture

```
┌─────────────────────────────────────────────────────────────────────────┐
│                           EVENT BUS                                     │
├─────────────────────────────────────────────────────────────────────────┤
│                                                                          │
│  ┌─────────────┐   ┌─────────────┐   ┌─────────────┐   ┌─────────────┐ │
│  │  EMITTER    │   │   QUEUE     │   │  ROUTER     │   │  HANDLERS   │ │
│  │             │   │             │   │             │   │             │ │
│  │ • Workflows │──▶│ • Priority  │──▶│ • Type      │──▶│ • Sub-agent │ │
│  │ • Agents    │   │   Queue     │   │   Routing   │   │ • Coord     │ │
│  │ • Hooks     │   │ • FIFO      │   │ • Priority  │   │ • Handoff   │ │
│  │ • User      │   │   ordered   │   │   routing   │   │ • Prompt    │ │
│  └─────────────┘   └─────────────┘   └─────────────┘   └─────────────┘ │
│                                    │                                     │
│                                    ▼                                     │
│  ┌─────────────────────────────────────────────────────────────────┐   │
│  │                    EVENT DISPATCHER                             │   │
│  │                                                                  │   │
│  │  ┌─────────────────┐   ┌─────────────────┐   ┌────────────────┐ │   │
│  │  │ Sub-Agent       │   │ BMAD-Master     │   │ Handoff        │ │   │
│  │  │ Delegation      │   │ Coordination    │   │ Manager        │ │   │
│  │  │                 │   │                 │   │                │ │   │
│  │  │ • validator     │   │ • validation    │   │ • Create       │ │   │
│  │  │ • context       │   │ • critical      │   │ • Transfer     │ │   │
│  │  │ • investigator  │   │   decisions     │   │ • Resume       │ │   │
│  │  │ • researcher    │   │ • approval      │   │ • Switch       │ │   │
│  │  └─────────────────┘   └─────────────────┘   └────────────────┘ │   │
│  └─────────────────────────────────────────────────────────────────┘   │
│                                                                          │
└─────────────────────────────────────────────────────────────────────────┘

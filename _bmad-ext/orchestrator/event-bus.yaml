## Event Router

### Routing Rules

```yaml
event_router:
  rules:
    # Route by type
    - when: "event_type == 'validation_required'"
      route_to: "handlers.validation_handler"
      
    - when: "event_type == 'context_needed'"
      route_to: "handlers.context_handler"
      
    - when: "event_type == 'investigation_triggered'"
      route_to: "handlers.investigation_handler"
      
    - when: "event_type == 'research_required'"
      route_to: "handlers.research_handler"
      
    - when: "event_type == 'workflow_error'"
      route_to: "handlers.error_handler"
      
    # Route by priority
    - when: "priority >= 100"
      route_to: "handlers.critical_handler"
      
    # Route by category
    - when: "category == 'coordination'"
      route_to: "handlers.bmad_master_coordinator"
      
    - when: "category == 'delegation'"
      route_to: "handlers.sub_agent_delegator"
      
    - when: "category == 'user'"
      route_to: "handlers.user_prompter"
```


## Event Type Definitions

### Core Events

```yaml
events:
  validation_required:
    id: "E-VAL-001"
    priority: "high"
    category: "coordination"
    description: "Validation needed before proceeding with workflow"
    payload_schema:
      type: "object"
      required: ["validation_type", "target"]
      properties:
        validation_type:
          enum: ["typescript", "architecture", "security", "governance", "business_logic"]
        target:
          type: "string"
        criteria: []
        timeout_minutes:
          type: "number"
          default: 5
    handlers:
      - type: "bmad-master"
        action: "validate"
      - type: "sub-agent"
        agent: "quality-scanner"
        when: "validation_type in ['typescript', 'security']"
        
  context_needed:
    id: "E-CTX-001"
    priority: "medium"
    category: "delegation"
    description: "Additional context required for workflow execution"
    payload_schema:
      type: "object"
      required: ["context_type", "domains"]
      properties:
        context_type:
          enum: ["domain_scan", "file_scan", "dependency_map", "state_analysis"]
        domains: []
        depth:
          type: "string"
          enum: ["shallow", "medium", "deep"]
          default: "medium"
        freshness_hours:
          type: "number"
          default: 4
    handlers:
      - type: "sub-agent"
        agent: "domain-scanner"
      - type: "sub-agent"
        agent: "context-validator"
        
  investigation_triggered:
    id: "E-INV-001"
    priority: "high"
    category: "delegation"
    description: "Deep investigation of issues, patterns, or anomalies"
    payload_schema:
      type: "object"
      required: ["investigation_type", "target"]
      properties:
        investigation_type:
          enum: ["state_boundary", "sync_fragmentation", "context_poisoning", "performance"]
        target: "description of what to investigate"
        hypothesis: "initial hypothesis to test"
        evidence_required: []
    handlers:
      - type: "sub-agent"
        agent: "analyst-ext"
      - type: "sub-agent"
        agent: "architect-ext"
        when: "investigation_type in ['state_boundary', 'sync_fragmentation']"
        
  research_required:
    id: "E-RES-001"
    priority: "medium"
    category: "delegation"
    description: "Internet-based research for technology decisions"
    payload_schema:
      type: "object"
      required: ["research_type", "query"]
      properties:
        research_type:
          enum: ["tech_comparison", "best_practices", "performance", "security", "compatibility"]
        query: "search query or topic"
        sources_required:
          type: "number"
          default: 5
        include_raw_content:
          type: "boolean"
          default: false
    handlers:
      - type: "sub-agent"
        agent: "analyst-ext"
        
  workflow_complete:
    id: "E-WFC-001"
    priority: "low"
    category: "system"
    description: "Workflow step or chain completed"
    payload_schema:
      type: "object"
      required: ["workflow_id", "status"]
      properties:
        workflow_id: "identifier"
        status: "SUCCESS" | "PARTIAL" | "FAILED"
        artifacts_created: []
        next_workflow: "id of next workflow in chain"
    handlers:
      - type: "handoff"
        action: "create_and_transfer"
        when: "next_workflow defined"
      - type: "continue"
        action: "next_workflow"
        when: "next_workflow defined and no delegation needed"
        
  workflow_error:
    id: "E-WFE-001"
    priority: "critical"
    category: "error"
    description: "Error occurred during workflow execution"
    payload_schema:
      type: "object"
      required: ["workflow_id", "error_type", "error_message"]
      properties:
        workflow_id: "identifier"
        error_type:
          enum: ["validation_failure", "context_stale", "dependency_missing", "permission_denied", "timeout"]
        error_message: "description"
        recoverable: "boolean"
        recovery_strategy: "retry | handoff | abort"
    handlers:
      - type: "bmad-master"
        action: "handle_error"
      - type: "sub-agent"
        agent: "typescript-fixer"
        when: "error_type == 'validation_failure' and 'typescript' in error_message"
        
  user_intervention_required:
    id: "E-INT-001"
    priority: "high"
    category: "user"
    description: "Human input needed to proceed"
    payload_schema:
      type: "object"
      required: ["intervention_type", "prompt"]
      properties:
        intervention_type:
          enum: ["decision", "clarification", "approval", "confirmation"]
        prompt: "question for user"
        options: []
        context: {}
    handlers:
      - type: "prompt"
        action: "display_and_wait"
```


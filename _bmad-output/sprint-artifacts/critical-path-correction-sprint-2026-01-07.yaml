epic_1_api_key_crisis:
  id: "EPIC-1"
  title: "API Key Flow Crisis - Fix All User Journey Blockers"
  priority: "P0-BLOCKER"
  status: "READY"
  estimated_hours: 12

  stories:

    - id: "P0-LLM-001"
      title: "Fix Embedding Service API Key Injection"
      priority: "P0"
      estimated_hours: "3-4"
      status: "READY"

      description: |
        4 locations call createEmbeddingService() WITHOUT API key:
        - KnowledgePage.tsx:351
        - incremental-indexing-service.ts:247
        - incremental-indexing-service.ts:368
        - hybrid-retriever.ts:473

        Impact: Even with saved API key, embeddings fall back to 'none' and RAG fails

      acceptance_criteria:
        - "All 4 embedding service calls retrieve API key from credentialVault"
        - "selectEmbeddingProvider() sees hasApiKey=true when key exists"
        - "RAG search returns results for newly indexed documents"
        - "User journey J1 (Add key → Use RAG) passes"

      files_to_modify:
        - "src/presentation/components/knowledge/KnowledgePage.tsx"
        - "src/lib/rag/incremental-indexing-service.ts"
        - "src/lib/rag/hybrid-retriever.ts"

      implementation_plan:
        - step: 1
          action: "Create useAPIKeyRetrieval hook pattern"
          effort: "1 hour"
        - step: 2
          action: "Update KnowledgePage.tsx to use hook"
          effort: "30 min"
        - step: 3
          action: "Update incremental-indexing-service.ts (2 locations)"
          effort: "1 hour"
        - step: 4
          action: "Update hybrid-retriever.ts"
          effort: "30 min"
        - step: 5
          action: "Test: Verify cloud embeddings work with saved key"
          effort: "1 hour"

    - id: "P0-LLM-002"
      title: "Fix Notes Workspace Agent Chat"
      priority: "P0"
      estimated_hours: "0.5"
      status: "READY"

      description: |
        NoteSidebarChat.tsx:83 passes apiKey: undefined with FALSE comment:
        "Credential-vault handles API key lookup"

        Reality: useAgentChatWithTools does NO internal vault lookup
        Impact: All agent chat in Notes fails with 401 Unauthorized

      acceptance_criteria:
        - "NoteSidebarChat uses useAgentChatAPIKeyManager pattern"
        - "API key retrieved from credentialVault before chat"
        - "Agent chat in Notes workspace works with saved key"
        - "User journey J3 (Agent chat Notes) passes"

      files_to_modify:
        - "src/presentation/components/notes/NoteSidebarChat.tsx"

      implementation_plan:
        - step: 1
          action: "Import useAgentChatAPIKeyManager from AgentChatPanel"
          effort: "10 min"
        - step: 2
          action: "Wrap useAgentChatWithTools with API key manager"
          effort: "10 min"
        - step: 3
          action: "Remove FALSE comment, verify apiKey is passed"
          effort: "10 min"

    - id: "P0-LLM-003"
      title: "Add API Key Validation Endpoint"
      priority: "P0"
      estimated_hours: "2-3"
      status: "READY"

      description: |
        User adds key but never gets confirmation it works until RAG fails silently
        Need: /api/provider/test endpoint that validates key and returns feedback

      acceptance_criteria:
        - "POST /api/provider/test endpoint created"
        - "Endpoint calls provider with test prompt"
        - "Returns { valid: boolean, error?: string, model?: string }"
        - "UI shows 'Connected' or specific error message"
        - "User journey J1 validation step passes"

      files_to_create:
        - "src/routes/api/provider/test/+server.ts"

      implementation_plan:
        - step: 1
          action: "Create TanStack Route API endpoint"
          effort: "30 min"
        - step: 2
          action: "Implement provider testConnection() call"
          effort: "1 hour"
        - step: 3
          action: "Add error handling and response formatting"
          effort: "30 min"
        - step: 4
          action: "Update ProviderConfigDialog to call test endpoint"
          effort: "30 min"
        - step: 5
          action: "Test with valid and invalid keys"
          effort: "30 min"

    - id: "P0-LLM-004"
      title: "Implement RAG Chat Real Responses"
      priority: "P0"
      estimated_hours: "2-3"
      status: "READY"

      description: |
        rag-chat.ts:129-132 returns placeholder instead of actual API call
        Impact: User gets fake "placeholder" response instead of real AI response

      acceptance_criteria:
        - "rag-chat.ts calls /api/chat endpoint with context"
        - "Response includes AI-generated content (not placeholder)"
        - "Citations array is non-empty for grounded responses"
        - "Error handling shows clear messages when LLM fails"

      files_to_modify:
        - "src/lib/rag/rag-chat.ts"

      implementation_plan:
        - step: 1
          action: "Import chat API client from @/routes/api/chat"
          effort: "30 min"
        - step: 2
          action: "Replace placeholder with actual /api/chat call"
          effort: "1-2 hours"
        - step: 3
          action: "Add error handling with user-friendly messages"
          effort: "30 min"
        - step: 4
          action: "Test: Verify real responses with citations"
          effort: "30 min"

    - id: "P0-LLM-005"
      title: "Add Indexing Progress Tracking"
      priority: "P0"
      estimated_hours: "2-3"
      status: "READY"

      description: |
        No progress indication during RAG indexing
        User doesn't know if indexing works or failed

      acceptance_criteria:
        - "Add indexingProgress state to rag-types.ts"
        - "KnowledgePage shows progress bar during indexing"
        - "Progress persists when navigating workspaces"
        - "User journey J1 indexing step passes"

      files_to_modify:
        - "src/infrastructure/persistence/stores/rag/rag-types.ts"
        - "src/presentation/components/knowledge/KnowledgePage.tsx"
        - "src/lib/rag/index.ts"

      implementation_plan:
        - step: 1
          action: "Define IndexingProgress state in rag-types.ts"
          effort: "30 min"
        - step: 2
          action: "Emit progress events from indexing services"
          effort: "1 hour"
        - step: 3
          action: "Wire progress state to KnowledgePage UI"
          effort: "1 hour"
        - step: 4
          action: "Test progress with 5+ large documents"
          effort: "30 min"


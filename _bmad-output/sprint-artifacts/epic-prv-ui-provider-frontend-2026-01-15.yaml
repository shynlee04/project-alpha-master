# ═══════════════════════════════════════════════════════════════════════════
# PROBLEM STATEMENT
# ═══════════════════════════════════════════════════════════════════════════

problem_statement: |
  Provider adapters (Groq, Mistral, chutes.ai) were successfully created with
  TanStack AI SDK, but FRONTEND INTEGRATION is INCOMPLETE:

  CRITICAL GAPS:
  1. Providers NOT visible in Settings UI (not in INITIAL_PROVIDERS)
  2. No bilingual support (Vietnamese + English) for errors
  3. No fallback mechanism when provider lacks API key
  4. No workspace-scoped provider preferences
  5. 8-bit design not applied to provider UI
  6. No multimodal input UI (video/audio for Gemini 3.0)
  7. Type fragmentation (ChutesModality not in domain layer)
  8. ZERO test coverage for provider adapters

  User Impact: Users CANNOT select Groq, Mistral, or chutes.ai despite adapters existing.

# ═══════════════════════════════════════════════════════════════════════════
# SUCCESS CRITERIA
# ═══════════════════════════════════════════════════════════════════════════

success_criteria:
  must_have:
    - "All 7 providers visible in Settings → Providers (OpenRouter, Anthropic, OpenAI, Google, Groq, Mistral, Chutes)"
    - "Bilingual error messages (Vietnamese + English)"
    - "Provider fallback mechanism when primary lacks key"
    - "8-bit design applied to all provider UI components"
    - "Type consolidation (ModalityType in domain layer)"
    - "Test coverage >= 70% for provider adapters"
    - "TypeScript compilation succeeds with 0 errors"

  should_have:
    - "Workspace-scoped provider preferences"
    - "Multimodal input UI (video/audio/upload for Gemini 3.0)"

  nice_to_have:
    - "Provider usage analytics"
    - "Provider comparison tool"


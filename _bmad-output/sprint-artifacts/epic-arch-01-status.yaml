stories:
  - id: ARCH-01-01
    name: Remove window.location.href (11 instances)
    effort_hours: 2
    team: A
    priority: P0
    status: pending
    dependencies: []
    description: |
      Remove all 11 instances of window.location.href that cause hydration issues
      and replace with proper TanStack Router navigation.
    acceptance_criteria:
      - All 11 instances identified and removed
      - TanStack Router useNavigate() or Link component used instead
      - No hydration mismatches
      - TypeScript compiles without errors
    tasks:
      - Identify all 11 instances via grep
      - Replace with router-based navigation
      - Validate no regressions
    handoff_artifact: null

  - id: ARCH-01-02
    name: Consolidate Project Creation Paths (7→2)
    effort_hours: 4
    team: B
    priority: P0
    status: pending
    dependencies: []
    description: |
      Consolidate 7 different project creation entry points into 2 unified paths:
      - FSA-based creation (desktop)
      - IndexedDB-based creation (mobile)
    acceptance_criteria:
      - 7 entry points reduced to 2
      - Platform detection integrated
      - No duplicate creation logic
      - Consistent user experience
    tasks:
      - Audit existing 7 creation paths
      - Identify common patterns
      - Create unified creation service
      - Implement platform routing
    handoff_artifact: null

  - id: ARCH-01-03
    name: Archive Knowledge/Study UI
    effort_hours: 2
    team: A
    priority: P1
    status: pending
    dependencies: []
    description: |
      Archive Knowledge and Study workspace UI components that are marked as DEFER.
      These features are not currently implemented and should be removed from navigation.
    acceptance_criteria:
      - Knowledge workspace removed from navigation
      - Study workspace removed from navigation
      - Route definitions archived (not deleted)
      - No broken imports
    tasks:
      - Identify Knowledge/Study routes
      - Archive route definitions
      - Remove from main navigation
      - Update route index
    handoff_artifact: null

  - id: ARCH-01-04
    name: Simplify Project Wizard (23→10 options)
    effort_hours: 3
    team: B
    priority: P1
    status: pending
    dependencies:
      - ARCH-01-02
    description: |
      Simplify the Project Wizard from 23 configuration options to 10 essential options.
      Remove advanced options that are rarely used or can be set later.
    acceptance_criteria:
      - 23 options reduced to 10
      - Essential options retained
      - Advanced options accessible via settings
      - UI remains functional
    tasks:
      - Audit all 23 wizard options
      - Identify essential vs advanced options
      - Redesign wizard flow
      - Update state management
    handoff_artifact: null

  - id: ARCH-01-05
    name: Sync Project Pointers (atomic)
    effort_hours: 3
    team: A
    priority: P0
    status: pending
    dependencies:
      - ARCH-01-02
    description: |
      Implement atomic synchronization for project pointers.
      Ensure consistent state between UI and storage layer.
    acceptance_criteria:
      - Atomic operations for pointer updates
      - No race conditions
      - Consistent state across workspaces
      - Rollback on failure
    tasks:
      - Analyze current pointer sync logic
      - Implement atomic operations
      - Add error handling
      - Test concurrent access
    handoff_artifact: null

  - id: ARCH-01-06
    name: Fix TypeScript Errors
    effort_hours: 1
    team: B
    priority: P0
    status: pending
    dependencies: []
    description: |
      Fix remaining TypeScript errors blocking successful build.
      Address type mismatches, missing imports, and any casting issues.
    acceptance_criteria:
      - pnpm tsc --noEmit passes with 0 errors
      - All types properly defined
      - No any types without justification
      - Strict mode compliance
    tasks:
      - Run TypeScript compiler to identify errors
      - Categorize errors by type
      - Fix in batches of 10-20
      - Validate fix doesn't break other code
    handoff_artifact: null


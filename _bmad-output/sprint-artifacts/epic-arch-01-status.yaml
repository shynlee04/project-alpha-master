epic:
  id: EPIC-ARCH-01
  name: Foundation Cleanup
  description: |
    Comprehensive foundation cleanup required for ADR-034 architecture adoption.
    Addresses technical debt and architectural inconsistencies.
  status: PROPOSED
  priority: P0
  start_date: 2026-01-21
  target_end_date: 2026-01-23

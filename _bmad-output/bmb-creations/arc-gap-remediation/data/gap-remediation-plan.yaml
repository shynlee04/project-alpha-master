# Gap Analysis
gaps:
  - id: ARC-P0-1
    priority: P0
    name: Missing workspacePermissions field
    impact: Blocks per-workspace tool security
    story_id: ARC-P0-1
    estimated_duration: 1 day
    dependencies: []
    description: |
      The AgentConfig schema is missing the workspacePermissions field, which is 
      required to implement per-workspace tool security. Without this field, agents 
      cannot be restricted to specific workspaces, creating a security vulnerability.
    
    acceptance_criteria:
      - workspacePermissions field added to AgentConfig schema
      - Tool permission checks respect workspacePermissions
      - Tests pass for all permission scenarios
      - Documentation updated
    
    technical_approach:
      - Define workspacePermissions schema with Zod
      - Add field to AgentConfig interface
      - Implement permission validation in tool execution
      - Update AgentConfigDialog UI for permission management
    
    files_to_modify:
      - src/lib/agent/config/agent-config.ts
      - src/lib/agent/tools/index.ts
      - src/components/agent/AgentConfigDialog.tsx
      - src/lib/agent/hooks/useAgentChat.ts

  - id: ARC-P0-2
    priority: P0
    name: Missing workspaceBindings field
    impact: Prevents workspace-specific agent availability
    story_id: ARC-P0-2
    estimated_duration: 1 day
    dependencies: []
    description: |
      The AgentConfig schema is missing the workspaceBindings field, which is 
      required to implement workspace-specific agent availability. Without this field, 
      agents cannot be configured to work only with specific workspaces.
    
    acceptance_criteria:
      - workspaceBindings field added to AgentConfig schema
      - Agent availability respects workspaceBindings
      - Tests pass for all binding scenarios
      - Documentation updated
    
    technical_approach:
      - Define workspaceBindings schema with Zod
      - Add field to AgentConfig interface
      - Implement availability checks in agent selection
      - Update AgentConfigDialog UI for binding management
    
    files_to_modify:
      - src/lib/agent/config/agent-config.ts
      - src/lib/agent/hooks/useAgents.ts
      - src/components/agent/AgentConfigDialog.tsx

  - id: ARC-P0-3
    priority: P0
    name: Workspace-aware tool permissions
    impact: Critical security feature
    story_id: ARC-P0-3
    estimated_duration: 1 day
    dependencies:
      - ARC-P0-1
      - ARC-P0-2
    description: |
      The current tool permission system does not consider workspace context. 
      This implementation will add workspace-aware permission checks to ensure 
      tools can only access resources in authorized workspaces.
    
    acceptance_criteria:
      - Workspace-aware permission model implemented
      - Tool execution flow updated with permission checks
      - Tests pass for all permission scenarios
      - Documentation updated
    
    technical_approach:
      - Design workspace-aware permission model
      - Implement permission checks in tool execution
      - Add workspace context to tool calls
      - Update tool facades with permission validation
    
    files_to_modify:
      - src/lib/agent/tools/index.ts
      - src/lib/agent/facades/AgentFileTools.ts
      - src/lib/agent/facades/AgentTerminalTools.ts
      - src/lib/agent/hooks/useAgentChatWithTools.ts

  - id: ARC-P1-1
    priority: P1
    name: Context summarization
    impact: Affects conversation management
    story_id: ARC-P1-1
    estimated_duration: 2 days
    dependencies: []
    description: |
      Long conversations can exceed context limits and become inefficient. 
      Context summarization will compress older messages while preserving 
      important information, improving conversation management.
    
    acceptance_criteria:
      - Context summarization logic implemented
      - Conversation store updated with summarization
      - Context size reduced by at least 50%
      - Tests pass for all summarization scenarios
      - Documentation updated
    
    technical_approach:
      - Design summarization strategy (extractive vs abstractive)
      - Implement summarization logic
      - Update conversation store with summarization triggers
      - Add UI indicators for summarized context
    
    files_to_modify:
      - src/lib/state/conversation-threads-store.ts
      - src/lib/agent/hooks/useAgentChat.ts
      - src/components/chat/ChatConversation.tsx

  - id: ARC-P1-2
    priority: P1
    name: AgentConfigDialog refactor
    impact: Code quality violation (1089 LOC)
    story_id: ARC-P1-2
    estimated_duration: 3 days
    dependencies: []
    description: |
      AgentConfigDialog.tsx is 1089 lines long, violating code quality standards. 
      This refactoring will break down the component into smaller, focused 
      components for better maintainability.
    
    acceptance_criteria:
      - AgentConfigDialog reduced to < 300 LOC
      - Component extraction completed
      - All tests passing
      - Backward compatibility maintained
      - Documentation updated
    
    technical_approach:
      - Analyze component structure and identify extraction opportunities
      - Extract provider configuration component
      - Extract model selection component
      - Extract tool configuration component
      - Refactor main dialog component
    
    files_to_modify:
      - src/components/agent/AgentConfigDialog.tsx
      - src/components/agent/ProviderConfigPanel.tsx (new)
      - src/components/agent/ModelSelector.tsx (new)
      - src/components/agent/ToolConfigPanel.tsx (new)


# LIVE DEMO CHECKLIST
# ═══════════════════════════════════════════════════════════════════════════
live_demo_checklist:
  pre_demo:
    - "Development server running (pnpm dev)"
    - "Browser console open (Cmd+Opt+J) for monitoring errors"
    - "Gemini API key configured and tested"
    - "Demo assets prepared and accessible"
    - "Screen recording software ready (optional)"
    - "Backup plan documented in case of failures"

  during_demo:
    - "Speak clearly and at moderate pace"

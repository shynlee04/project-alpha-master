# ═══════════════════════════════════════════════════════════════════════════
# TROUBLESHOOTING GUIDE
# ═══════════════════════════════════════════════════════════════════════════
troubleshooting:
  common_issues:
    - issue: "Gemini API returns 401 Unauthorized"
      solution: "Check API key in AgentConfigDialog → Providers → Gemini, regenerate key if needed"
      demo_impact: "Use mock synthesis mode with note 'Using fallback data for demo'"

    - issue: "File import fails with CORS error"
      solution: "Ensure files are local (not from web server), use drag-drop instead of file picker"
      demo_impact: "Switch to text/markdown import which doesn't have CORS restrictions"

    - issue: "RAG search returns no results"
      solution: "Ensure sources are imported and indexed, try broader search terms"
      demo_impact: "Use prepared search queries known to work: 'derivatives', 'algorithms'"

    - issue: "Linkage analysis not triggering"
      solution: "Ensure 3+ nodes on canvas, manually trigger 'Generate Proposals'"
      demo_impact: "Manually trigger and explain auto-trigger requirements"

    - issue: "Canvas performance slow with many nodes"
      solution: "Reduce to 5-7 nodes for demo, note 'Performance optimization in progress'"
      demo_impact: "Proceed with smaller graph, emphasize functionality over scale"

  emergency_fallbacks:
    - scenario: "Complete system failure"
      action: "Switch to pre-recorded video demo, note 'Live demo experiencing technical issues'"

    - scenario: "Network timeout during synthesis"
      action: "Use mock data mode, explain 'AI processing requires stable network'"

    - scenario: "Browser not supported (Safari issues)"
      action: "Switch to Chrome/Edge, note 'Optimized for Chromium browsers'"


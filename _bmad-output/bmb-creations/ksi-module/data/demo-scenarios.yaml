# KSI Module Demo Scenarios
# Step-by-step demonstration scripts for 4 core use cases
# Generated: 2025-12-31T21:00:00+07:00
# Version: 1.0

---
overview:
  module: "Knowledge Synthesis Integration (KSI)"
  purpose: "Demonstrate end-to-end functionality of KSI module"
  target_audience: ["Stakeholders", "Testers", "Documentation team", "Training team"]
  prerequisites:
    - "Gemini API key configured in credential vault"
    - "Browser with File System Access API support (Chrome/Edge recommended)"
    - "Local development server running: pnpm dev"
    - "Sample learning materials prepared (test data included)"

# ═══════════════════════════════════════════════════════════════════════════
# DEMO SCENARIO 1: Initial Vault Population
# ═══════════════════════════════════════════════════════════════════════════
demo_scenario_1:
  id: "DS-001"
  name: "Initial Vault Population and Baseline Synthesis"
  use_case: "UC-001"
  duration_minutes: 8
  difficulty: "Beginner"

  pre_demo_setup:
    - task: "Prepare sample files"
      files:
        - path: "demo-assets/sample-calculus.pdf"
          description: "Short calculus textbook chapter (5 pages)"
        - path: "demo-assets/algorithms-notes.pdf"
          description: "Computer science algorithms lecture notes"
        - path: "demo-assets/handwritten-math.jpg"
          description: "Handwritten calculus notes with diagrams"
        - path: "demo-assets/data-structures-diagram.png"
          description: "Binary tree data structure diagram"
        - path: "demo-assets/lecture-recording.mp3"
          description: "15-minute lecture on recursion"
    - task: "Start development server"
      command: "pnpm dev"
      verify: "Server running on http://localhost:3000"
    - task: "Configure Gemini API"
      action: "Open AgentConfigDialog → Providers → Gemini → Enter API key"

  script_steps:
    - step: 1
      title: "Create Knowledge Vault"
      narrator_lines:
        - "Welcome to the Knowledge Synthesis Station demo"
        - "I'll start by creating a new knowledge vault for organizing learning materials"
      user_actions:
        - action: "Navigate to Knowledge workspace"
          hotkey: "Cmd+K then type 'Knowledge'"
        - action: "Click 'Create New Vault' button"
          ui_element: "KnowledgePage → Vault creation CTA"
        - action: "Enter vault name: 'Demo Semester 2025'"
          input: "Demo Semester 2025"
        - action: "Click 'Create Vault'"
      expected_results:
        - "Vault appears in sidebar"
        - "Empty state with 'Import Sources' CTA visible"
      timing_seconds: 30

    - step: 2
      title: "Open Source Import Dialog"
      narrator_lines:
        - "Now I'll import diverse learning materials into the vault"
        - "The system supports PDFs, images, audio, URLs, markdown, and plain text"
      user_actions:
        - action: "Click 'Import Sources' button"
          ui_element: "KnowledgePage → Import Sources CTA"
      expected_results:
        - "SourceImportDialog modal opens"
        - "Upload zone with drag-drop visible"
        - "Format icons shown: PDF, Image, Audio, URL, Text"
      timing_seconds: 15

    - step: 3
      title: "Import Files (Batch Upload)"
      narrator_lines:
        - "I'll upload multiple files at once to demonstrate batch processing"
        - "The system automatically detects file types and routes them appropriately"
      user_actions:
        - action: "Select 5 files from demo-assets/"
          files: ["sample-calculus.pdf", "algorithms-notes.pdf", "handwritten-math.jpg", "data-structures-diagram.png", "lecture-recording.mp3"]
        - action: "Click 'Import All'"
          ui_element: "SourceImportDialog → Import All button"
      expected_results:
        - "Progress indicators appear for each file"
        - "Files show processing status: Extracting → Chunking → Embedding → Indexing"
        - "Source cards appear in vault with status badges"
      timing_seconds: 60

    - step: 4
      title: "Synthesize Sources (AI Analysis)"
      narrator_lines:
        - "Each imported source can be analyzed by Gemini to extract structured metadata"
        - "This includes summaries, key concepts, tags, and subject classification"
      user_actions:
        - action: "Click 'Synthesize All' button in vault toolbar"
          ui_element: "KnowledgePage → Synthesize All button"
      expected_results:
        - "Synthesis progress animation shows"
        - "Sources update with 'Synthesized' badges (🧠 icon)"
        - "Synthesis metadata visible: summary, tags, key concepts, reading time"
      timing_seconds: 90
      note: "Demo note: If Gemini API not configured, system falls back to mock data"

    - step: 5
      title: "Explore Synthesized Results"
      narrator_lines:
        - "Let's examine the AI-generated synthesis for one of the sources"
        - "The system has extracted comprehensive structured metadata"
      user_actions:
        - action: "Click on 'sample-calculus.pdf' source card"
          ui_element: "SourceCard → Open source detail"
      expected_results:
        - "Source detail view opens"
        - "Synthesis frontmatter displayed:"
          - "Summary (150-300 words)"
          - "Document type (e.g., 'Textbook Chapter')"
          - "Key concepts (5-10 terms with definitions)"
          - "Tags (3-10 semantic tags)"
          - "Reading time estimate"
          - "Related sources (if any)"
      timing_seconds: 45

    - step: 6
      title: "Auto-Organization (Subject Classification)"
      narrator_lines:
        - "The system automatically organizes sources by subject using AI classification"
        - "This creates a navigable knowledge structure without manual effort"
      user_actions:
        - action: "Navigate back to vault view"
          ui_element: "Back button or breadcrumb"
        - action: "Observe subject groupings in sidebar"
      expected_results:
        - "Subject folders visible (e.g., 'Mathematics', 'Computer Science')"
        - "Source counts shown per subject"
        - "Sources organized under appropriate subjects"
      timing_seconds: 20

    - step: 7
      title: "RAG Search (Knowledge Retrieval)"
      narrator_lines:
        - "All imported sources are now indexed and searchable via RAG"
        - "Let me search for specific concepts across the entire vault"
      user_actions:
        - action: "Click 'Search Knowledge' button"
          ui_element: "KnowledgePage → Search CTA"
        - action: "Enter search query: 'derivatives and integrals'"
          input: "derivatives and integrals"
        - action: "Press Enter"
      expected_results:
        - "Search results show matching sources"
        - "Relevance scores displayed"
        - "Highlighted snippets from source content"
        - "Citations to source documents"
      timing_seconds: 30

  success_metrics:
    - "All 5 files imported successfully"
    - "All sources synthesized with valid frontmatter"
    - "Subject groups auto-created"
    - "RAG search returns relevant results"
    - "Total demo time: ~8 minutes"

  fallback_plans:
    - scenario: "Gemini API fails or not configured"
      action: "System uses mock synthesis data, demo continues with note 'Using fallback mode'"
    - scenario: "File import times out"
      action: "Reduce batch size to 2-3 files, note 'Processing in smaller batches for stability'"
    - scenario: "Subject classification fails"
      action: "Manual subject creation demo, note 'Auto-classification unavailable in this configuration'"

  post_demo_cleanup:
    - "Delete demo vault (optional)"
    - "Clear IndexedDB for fresh start (optional)"
    - "Close demo files"

# ═══════════════════════════════════════════════════════════════════════════
# DEMO SCENARIO 2: Canvas Linkage Discovery
# ═══════════════════════════════════════════════════════════════════════════
demo_scenario_2:
  id: "DS-002"
  name: "Interactive Canvas Knowledge Linkage Discovery"
  use_case: "UC-002"
  duration_minutes: 6
  difficulty: "Intermediate"

  pre_demo_setup:
    - task: "Ensure vault has 5+ synthesized sources"
      action: "Complete Demo Scenario 1 or use pre-populated vault"
    - task: "Verify canvas workspace accessible"
      action: "Navigate to Knowledge workspace → Canvas tab"

  script_steps:
    - step: 1
      title: "Open Knowledge Canvas"
      narrator_lines:
        - "Now I'll demonstrate the knowledge canvas for visual exploration"
        - "The canvas helps discover hidden connections between sources"
      user_actions:
        - action: "Navigate to Knowledge workspace"
        - action: "Click 'Canvas' tab"
          ui_element: "KnowledgePage → Canvas tab"
      expected_results:
        - "Canvas workspace loads with React Flow"
        - "Sidebar shows available sources"
        - "Empty canvas with instructions"
      timing_seconds: 20

    - step: 2
      title: "Add Sources to Canvas"
      narrator_lines:
        - "I'll drag sources onto the canvas to visualize their relationships"
        - "Each source becomes a node with synthesis metadata"
      user_actions:
        - action: "Drag 'sample-calculus.pdf' from sidebar to canvas"
        - action: "Drag 'algorithms-notes.pdf' to canvas"
        - action: "Drag 'handwritten-math.jpg' to canvas"
        - action: "Drag 'data-structures-diagram.png' to canvas"
      expected_results:
        - "Source nodes appear at drop locations"
        - "Nodes show title and synthesis summary preview"
        - "Nodes are draggable and resizable"
      timing_seconds: 45

    - step: 3
      title: "Trigger Linkage Analysis"
      narrator_lines:
        - "When 3+ nodes are present, the system automatically analyzes relationships"
        - "It uses embedding similarity and content analysis to propose connections"
      user_actions:
        - action: "Wait for auto-trigger (3+ nodes detected)"
          timing: "3-5 seconds after last node added"
      expected_results:
        - "LinkageProposalsPanel appears floating on canvas"
        - "Shows 3-5 proposed connections"
        - "Each proposal has type badge, confidence score, rationale"
      timing_seconds: 10

    - step: 4
      title: "Review Linkage Proposals"
      narrator_lines:
        - "The system has identified several semantic relationships"
        - "Each proposal includes confidence score and explanatory rationale"
      user_actions:
        - action: "Review proposals in LinkageProposalsPanel"
      expected_results:
        - "Proposals categorized: Conceptual, Sequential, Contrastive"
        - "Confidence scores shown (e.g., 'Confidence: 87%')"
        - "Rationale explains: 'Both sources discuss derivatives in calculus'"
        - "Evidence keywords highlighted"
      timing_seconds: 30

    - step: 5
      title: "Accept Connection Proposal"
      narrator_lines:
        - "I'll accept a conceptual connection between two related sources"
        - "This creates a persistent edge in the knowledge graph"
      user_actions:
        - action: "Click 'Accept' button on first proposal"
          ui_element: "LinkageProposalsPanel → Accept button"
      expected_results:
        - "Solid edge appears between nodes"
        - "Edge label shows relationship type (e.g., 'CONCEPTUAL')"
        - "Proposal removed from panel"
        - "Edge persists on canvas navigation"
      timing_seconds: 15

    - step: 6
      title: "Dismiss Irrelevant Proposal"
      narrator_lines:
        - "Not all proposals are relevant. I can dismiss weak connections"
      user_actions:
        - action: "Click 'Dismiss' button on low-confidence proposal"
          ui_element: "LinkageProposalsPanel → Dismiss button"
      expected_results:
        - "Proposal removed from panel"
        - "No edge created"
        - "Dismissed proposal not shown again in session"
      timing_seconds: 10

    - step: 7
      title: "Bulk Accept/Dismiss"
      narrator_lines:
        - "For efficiency, I can accept or dismiss all proposals at once"
      user_actions:
        - action: "Click 'Accept All' button"
          ui_element: "LinkageProposalsPanel → Accept All"
      expected_results:
        - "All remaining proposals accepted"
        - "Multiple edges appear on canvas"
        - "Canvas shows interconnected knowledge graph"
      timing_seconds: 10

    - step: 8
      title: "Explore Knowledge Graph"
      narrator_lines:
        - "The canvas now shows a knowledge graph with semantic connections"
        - "I can drag nodes to rearrange the layout and explore relationships"
      user_actions:
        - action: "Drag nodes to organize graph layout"
        - action: "Hover over edges to see connection details"
      expected_results:
        - "Nodes smoothly draggable"
        - "Edge hover shows full rationale and confidence"
        - "Layout updates in real-time"
      timing_seconds: 30

  success_metrics:
    - "5+ sources added to canvas"
    - "Linkage analysis triggered successfully"
    - "3-5 proposals generated with confidence scores"
    - "Accept/dismiss actions work correctly"
    - "Knowledge graph visually organized"

  fallback_plans:
    - scenario: "Linkage analysis fails to trigger"
      action: "Manually trigger via 'Generate Proposals' button, note 'Auto-trigger requires 3+ nodes'"
    - scenario: "No proposals generated"
      action: "Use sources with stronger semantic overlap, note 'Proposals depend on content similarity'"
    - scenario: "Canvas performance issues"
      action: "Reduce to 3 nodes, note 'Performance optimization for larger graphs in progress'"

# ═══════════════════════════════════════════════════════════════════════════
# DEMO SCENARIO 3: Conversational Knowledge Exploration (RAG Chat)
# ═══════════════════════════════════════════════════════════════════════════
demo_scenario_3:
  id: "DS-003"
  name: "Conversational Knowledge Exploration with RAG"
  use_case: "UC-003"
  duration_minutes: 5
  difficulty: "Intermediate"

  pre_demo_setup:
    - task: "Ensure vault has 5+ synthesized sources"
      action: "Complete Demo Scenario 1 or use pre-populated vault"
    - task: "Verify RAG chat accessible"
      action: "Navigate to Knowledge workspace → Chat tab"

  script_steps:
    - step: 1
      title: "Open RAG Chat Interface"
      narrator_lines:
        - "I'll now demonstrate conversational knowledge exploration using RAG"
        - "This allows natural language queries against the entire knowledge vault"
      user_actions:
        - action: "Navigate to Knowledge workspace"
        - action: "Click 'Chat' tab"
          ui_element: "KnowledgePage → Chat tab"
      expected_results:
        - "UnifiedChatPanel opens in RAG mode"
        - "Chat history visible (empty initially)"
        - "Input field with placeholder visible"
      timing_seconds: 15

    - step: 2
      title: "Ask Factual Query (RAG Retrieval)"
      narrator_lines:
        - "I'll ask a specific question that requires information from the sources"
        - "The system retrieves relevant passages and generates a cited response"
      user_actions:
        - action: "Enter query: 'What are the key differences between derivatives and integrals?'"
          input: "What are the key differences between derivatives and integrals?"
        - action: "Press Enter or click Send"
          ui_element: "Chat input → Send button"
      expected_results:
        - "Query appears in chat history"
        - "RAG retrieval runs (brief loading state)"
        - "Assistant response appears with:"
          - "Answer text synthesizing retrieved passages"
          - "Citation links to source documents"
          - "Highlighted snippets from sources"
      timing_seconds: 15

    - step: 3
      title: "Explore Citations"
      narrator_lines:
        - "Each response includes citations to the original sources"
        - "I can click on citations to view the source material"
      user_actions:
        - action: "Click on first citation link"
          ui_element: "Chat response → Citation link"
      expected_results:
        - "Source detail view opens"
        - "Relevant passage highlighted in source"
        - "Context around citation visible"
      timing_seconds: 20

    - step: 4
      title: "Follow-up Question (Context Retention)"
      narrator_lines:
        - "The chat maintains context across the conversation"
        - "I can ask follow-up questions that reference previous responses"
      user_actions:
        - action: "Enter follow-up: 'How do these concepts apply to real-world problems?'"
          input: "How do these concepts apply to real-world problems?"
        - action: "Press Enter"
      expected_results:
        - "Response builds on previous context"
        - "References both derivatives and integrals"
        - "Additional citations from different sources"
      timing_seconds: 15

    - step: 5
      title: "Cross-Source Synthesis"
      narrator_lines:
        - "The system can synthesize information across multiple sources"
        - "Let me ask a question that requires connecting different documents"
      user_actions:
        - action: "Enter query: 'Compare the recursion explanations in my lecture notes and algorithms PDF'"
          input: "Compare the recursion explanations in my lecture notes and algorithms PDF"
        - action: "Press Enter"
      expected_results:
        - "Response compares both sources"
        - "Citations from both 'lecture-recording.mp3' and 'algorithms-notes.pdf'"
        - "Synthesis highlights similarities and differences"
      timing_seconds: 20

    - step: 6
      title: "Export Chat History"
      narrator_lines:
        - "After exploration, I can export the conversation for reference"
      user_actions:
        - action: "Click 'Export Chat' button"
          ui_element: "ChatPanel → Export button"
      expected_results:
        - "Chat history exported as markdown"
        - "Includes all queries and responses"
        - "Citations preserved in export"
      timing_seconds: 10

  success_metrics:
    - "Queries return relevant, cited responses"
    - "Citations link to correct sources"
    - "Context maintained across conversation"
    - "Cross-source synthesis working"
    - "Export functionality works"

  fallback_plans:
    - scenario: "RAG retrieval returns no results"
      action: "Rephrase query to be more specific, note 'Retrieval depends on indexed content'"
    - scenario: "Response generation slow"
      action: "Explain 'RAG retrieval + LLM generation takes 5-10 seconds', show loading state"
    - scenario: "Citations not linked correctly"
      action: "Manual source lookup, note 'Citation linking requires synthesis frontmatter'"

# ═══════════════════════════════════════════════════════════════════════════
# DEMO SCENARIO 4: Dynamic Knowledge Matrix Auto-Organization
# ═══════════════════════════════════════════════════════════════════════════
demo_scenario_4:
  id: "DS-004"
  name: "Dynamic Knowledge Matrix Auto-Organization"
  use_case: "UC-004"
  duration_minutes: 7
  difficulty: "Advanced"

  pre_demo_setup:
    - task: "Ensure vault has 15+ sources for meaningful organization"
      action: "Pre-populate vault or use large demo dataset"
    - task: "Verify organization features accessible"
      action: "Navigate to Knowledge workspace → Organize view"

  script_steps:
    - step: 1
      title: "Open Organization View"
      narrator_lines:
        - "For large vaults, manual organization becomes impractical"
        - "The system provides AI-powered auto-organization with multiple strategies"
      user_actions:
        - action: "Navigate to Knowledge workspace"
        - action: "Click 'Organize' tab"
          ui_element: "KnowledgePage → Organize tab"
      expected_results:
        - "Organization view loads"
        - "Vault analysis shown: source count, subjects, temporal span"
        - "Organization strategies visible: Chronological, Conceptual, Hybrid"
      timing_seconds: 15

    - step: 2
      title: "Vault Analysis Overview"
      narrator_lines:
        - "Before organization, let me review the vault analysis"
        - "This shows the current state and identifies organization opportunities"
      user_actions:
        - action: "Review vault statistics panel"
      expected_results:
        - "Total sources: 15+"
        - "Subject diversity: 5-10 subjects detected"
        - "Temporal span: e.g., '3 months of materials'"
        - "Cluster detection: e.g., '3 distinct topic clusters found'"
      timing_seconds: 20

    - step: 3
      title: "Preview Chronological Organization"
      narrator_lines:
        - "The first strategy organizes sources by time"
        - "This is useful for tracking learning progress over time"
      user_actions:
        - action: "Click 'Chronological' strategy card"
          ui_element: "OrganizationPanel → Chronological preview"
      expected_results:
        - "Preview shows sources grouped by week/month"
        - "Group labels: 'Week 1', 'Week 2', etc."
        - "Source counts per group"
        - "Confidence score displayed"
      timing_seconds: 15

    - step: 4
      title: "Preview Conceptual Organization"
      narrator_lines:
        - "The conceptual strategy organizes by subject and topic"
        - "This groups related materials regardless of when they were added"
      user_actions:
        - action: "Click 'Conceptual' strategy card"
          ui_element: "OrganizationPanel → Conceptual preview"
      expected_results:
        - "Preview shows subject-based groups"
        - "Group labels: 'Mathematics', 'Computer Science', etc."
        - "Hierarchical subjects visible: 'Mathematics > Calculus'"
        - "Confidence score displayed"
      timing_seconds: 15

    - step: 5
      title: "Preview Hybrid Organization"
      narrator_lines:
        - "The hybrid strategy combines chronological and conceptual approaches"
        - "This provides flexible navigation with temporal structure"
      user_actions:
        - action: "Click 'Hybrid' strategy card"
          ui_element: "OrganizationPanel → Hybrid preview"
      expected_results:
        - "Preview shows chronological groups, each subdivided by subject"
        - "Structure: 'Week 1 > Mathematics', 'Week 1 > Computer Science'"
        - "Highest confidence score (typically)"
      timing_seconds: 15

    - step: 6
      title: "Apply Hybrid Organization"
      narrator_lines:
        - "I'll apply the hybrid organization as it offers the best balance"
      user_actions:
        - action: "Click 'Apply Hybrid Organization' button"
          ui_element: "OrganizationPanel → Apply button"
      expected_results:
        - "Sources reorganized in vault view"
        - "Subject folders and chronological groups visible"
        - "Breadcrumbs show hierarchy"
        - "Confirmation toast: 'Organization applied successfully'"
      timing_seconds: 10

    - step: 7
      title: "Navigate Organized Vault"
      narrator_lines:
        - "The vault is now organized with multiple navigation paths"
        - "I can browse by subject or by time"
      user_actions:
        - action: "Navigate to main vault view"
        - action: "Click through subject folders"
        - action: "Use breadcrumbs to navigate hierarchy"
      expected_results:
        - "Smooth navigation between groups"
        - "Source counts accurate"
        - "Multiple views accessible simultaneously"
      timing_seconds: 30

    - step: 8
      title: "Relevancy Scoring (Related Sources)"
      narrator_lines:
        - "The system also identifies related sources based on multiple factors"
        - "This helps discover connections I might have missed"
      user_actions:
        - action: "Click on a source card"
        - action: "Scroll to 'Related Sources' section"
      expected_results:
        - "Related sources listed with relevancy scores"
        - "Factors shown: embedding similarity, citation overlap, subject proximity"
        - "Scores between 0-100%"
      timing_seconds: 20

  success_metrics:
    - "Vault analysis shows accurate statistics"
    - "3 organization strategies previewed correctly"
    - "Hybrid organization applied successfully"
    - "Navigation works in organized vault"
    - "Relevancy scores displayed"

  fallback_plans:
    - scenario: "Vault too small for meaningful organization (<10 sources)"
      action: "Note 'Organization works best with 15+ sources', show manual organization"
    - scenario: "Organization strategies show low confidence"
      action: "Explain 'Low confidence indicates diverse content without clear patterns', proceed anyway"
    - scenario: "Apply organization fails"
      action: "Refresh page and retry, note 'Organization uses cached analysis, retry if stale'"


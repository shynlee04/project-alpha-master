# DEMO DATA PACKAGE
# ═══════════════════════════════════════════════════════════════════════════
demo_data_package:
  id: "DP-001"
  name: "KSI Module Demo Dataset"
  version: "1.0"
  description: "Complete set of sample materials for KSI module demonstrations"

  directory_structure:
    demo-assets/
      pdfs/
        - "sample-calculus.pdf"
          description: "5-page calculus textbook chapter (derivatives and integrals)"
          pages: 5
          subject: "Mathematics > Calculus"
        - "algorithms-lecture-notes.pdf"
          description: "10-page computer science lecture notes (sorting and searching)"
          pages: 10
          subject: "Computer Science > Algorithms"
        - "literature-analysis.pdf"
          description: "8-page literary analysis essay"
          pages: 8
          subject: "Humanities > Literature"

      images/
        - "handwritten-math-notes.jpg"
          description: "Handwritten calculus notes with diagrams"
          format: "JPEG"
          dimensions: "1200x800"
          subject: "Mathematics > Calculus"
        - "data-structures-diagram.png"
          description: "Binary tree and linked list diagrams"
          format: "PNG"
          dimensions: "1920x1080"
          subject: "Computer Science > Data Structures"
        - "mindmap-philosophy.png"
          description: "Philosophy concept mind map"
          format: "PNG"
          dimensions: "1400x1000"
          subject: "Humanities > Philosophy"

      audio/
        - "lecture-recording-calculus.mp3"
          description: "15-minute lecture on differentiation techniques"
          duration: "15:00"
          format: "MP3"
          subject: "Mathematics > Calculus"
        - "podcast-algorithms.mp3"
          description: "20-minute podcast on algorithm design"
          duration: "20:00"
          format: "MP3"
          subject: "Computer Science > Algorithms"

      markdown/
        - "study-guide-recursion.md"
          description: "Study guide on recursion with examples"
          word_count: 1200
          subject: "Computer Science > Algorithms"
        - "essay-history-vietnam.md"
          description: "Short essay on Vietnamese history"
          word_count: 800
          subject: "Humanities > History"

      text/
        - "vocab-list-calculus.txt"
          description: "Calculus vocabulary list with definitions"
          word_count: 500
          subject: "Mathematics > Calculus"

  download_instructions:
    - "All demo files should be < 5MB each for fast upload"
    - "Total demo dataset size: ~25MB"
    - "Files can be generated using AI tools (ChatGPT, etc.) for realistic content"
    - "Ensure PDFs have selectable text (not scanned images) for proper extraction"

  preparation_guide:
    - step: 1
      task: "Generate PDF content"
      tools: ["ChatGPT", "Markdown to PDF converter"]
      time_estimate: "30 minutes"
    - step: 2
      task: "Create sample diagrams"
      tools: ["Draw.io", "Lucidchart", "Excalidraw"]
      time_estimate: "20 minutes"
    - step: 3
      task: "Record audio samples"
      tools: ["Text-to-speech AI", "Voice recording software"]
      time_estimate: "15 minutes"
    - step: 4
      task: "Package into demo-assets/ directory"
      tools: ["File system"]
      time_estimate: "5 minutes"


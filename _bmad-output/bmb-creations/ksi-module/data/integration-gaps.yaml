# Integration Gaps Analysis
# Generated: 2025-12-31T19:22:10+07:00
# Purpose: Document broken connections and wiring requirements for Knowledge Synthesis Platform

---
# Summary
summary:
  total_gaps: 6
  critical_gaps: 3
  high_gaps: 2
  medium_gaps: 1
  estimated_effort_hours: 48
  estimated_effort_days: 6

# ═══════════════════════════════════════════════════════════════════════════
# CRITICAL GAPS (P0) - Block All 4 Use Cases
# ═══════════════════════════════════════════════════════════════════════════

gaps:
  # GAP 1: Source Import → RAG Index
  - id: "GAP-001"
    name: "Source Import → RAG Index Disconnection"
    priority: "P0-CRITICAL"
    status: "OPEN"
    
    description: |
      Sources ingested via SourceImportDialog are stored but NOT automatically 
      indexed in Orama. The import pipeline completes but embeddings are never 
      generated and documents are not searchable via RAG.
    
    source_component: "src/presentation/components/knowledge/SourceImportDialog.tsx"
    target_component: "src/lib/rag/orama-index.ts"
    
    broken_connection:
      expected: "SourceImportDialog.handleImport() → OramaIndex.addDocument()"
      actual: "SourceImportDialog.handleImport() → (ends) - no connection to RAG"
      
    evidence:
      - "grep -r 'orama-index' src/presentation/components/knowledge/ returns 0 results"
      - "SourceImportDialog has no import of orama-index or embedding-service"
      - "Use Case 1 cannot complete: sources exist but are not searchable"
    
    root_cause: |
      Source import was built before RAG infrastructure. After RAG was 
      implemented, the integration was never wired up. The SourceImportPipeline
      processes files but does not trigger embedding generation.
    
    fix_strategy:
      approach: "Bridge pattern - create source-rag-bridge.ts"
      steps:
        - "Create src/lib/knowledge/source-rag-bridge.ts"
        - "Subscribe to STORE_EVENTS.SOURCE_IMPORTED event"
        - "On event, call EmbeddingService.embed()"
        - "Then call OramaIndex.addDocument()"
        - "Update SourceCard to show 'Indexed' status"
      effort_hours: 6
      
    affected_use_cases: [1, 3]
    blocking: true

  # GAP 2: Chat Panel → RAG Retrieval
  - id: "GAP-002"
    name: "Chat Panel → RAG Retrieval Disconnection"
    priority: "P0-CRITICAL"
    status: "OPEN"
    
    description: |
      The ChatPanel and useAgentChat hook are not wired to the RAG retrieval
      system. User queries go directly to AI provider without context from
      the knowledge base. RAGChatPanel exists but is isolated.
    
    source_component: "src/presentation/components/chat/ChatPanel.tsx"
    target_component: "src/lib/rag/hybrid-retriever.ts"
    
    broken_connection:
      expected: "ChatPanel → useAgentChat → hybrid-retriever → response with citations"
      actual: "ChatPanel → useAgentChat → AI API (no RAG) → response without knowledge"
      
    evidence:
      - "useAgentChat.ts has no import of hybrid-retriever"
      - "ChatPanel has no mode toggle for RAG vs pure agent"
      - "RAGChatPanel exists but is not integrated into main chat flow"
      - "Use Case 3 cannot complete: queries don't access knowledge base"
    
    root_cause: |
      RAGChatPanel was built as a separate component during Epic 7. It was
      never integrated into the main ChatPanel. Two parallel chat implementations
      exist without connection.
    
    fix_strategy:
      approach: "Unified ChatPanel with mode toggle"
      steps:
        - "Add mode state to ChatPanel: 'agent' | 'rag' | 'hybrid'"
        - "Create ChatModeToggle component"
        - "In 'rag' mode, route queries through hybrid-retriever first"
        - "In 'hybrid' mode, inject RAG context into system prompt"
        - "Wire CitationSidebar to display source references"
      effort_hours: 8
      
    affected_use_cases: [3]
    blocking: true

  # GAP 3: Synthesis Trigger Missing
  - id: "GAP-003"
    name: "Synthesis Trigger UI Missing"
    priority: "P0-CRITICAL"
    status: "OPEN"
    
    description: |
      No UI control exists to trigger synthesis on imported sources.
      Users cannot invoke Gemini API to generate frontmatter, tags,
      and metadata summaries. The synthesis service doesn't exist.
    
    source_component: "src/presentation/components/knowledge/SourceCard.tsx"
    target_component: "N/A - service doesn't exist"
    
    broken_connection:
      expected: "SourceCard.Synthesize button → SynthesisService → Frontmatter generated"
      actual: "SourceCard has no synthesize button, no synthesis service exists"
      
    evidence:
      - "grep -r 'synthesize' src/presentation/components/knowledge/ returns 0 results"
      - "No src/lib/knowledge/synthesis-service.ts exists"
      - "Use Case 1 cannot complete: no synthesis activation"
    
    root_cause: |
      Synthesis was conceptualized but never implemented. The focus during
      implementation was on ingestion and RAG infrastructure, not on the
      AI-powered synthesis step that transforms raw materials.
    
    fix_strategy:
      approach: "Create complete synthesis pipeline"
      steps:
        - "Create SynthesisService with Gemini API integration"
        - "Define frontmatter schema (summary, tags, concepts, etc.)"
        - "Add 'Synthesize' button to SourceCard"
        - "Show progress during synthesis"
        - "Store frontmatter in Dexie with source linkage"
        - "Update source status to 'synthesized'"
      effort_hours: 10
      
    affected_use_cases: [1, 2]
    blocking: true

# ═══════════════════════════════════════════════════════════════════════════
# HIGH PRIORITY GAPS (P1) - Block Specific Use Cases
# ═══════════════════════════════════════════════════════════════════════════

  # GAP 4: Canvas → AI Linkage Discovery
  - id: "GAP-004"
    name: "Canvas → AI Linkage Discovery Missing"
    priority: "P1-HIGH"
    status: "OPEN"
    
    description: |
      The canvas exists with manual node/edge creation but has no AI-powered
      linkage discovery. When multiple synthesized documents are added,
      no automatic analysis suggests connections between them.
    
    source_component: "src/presentation/components/canvas/Canvas.tsx"
    target_component: "N/A - service doesn't exist"
    
    broken_connection:
      expected: "3+ nodes on canvas → LinkageAnalyzer → Connection recommendations"
      actual: "Canvas only supports manual edge creation, no AI analysis"
      
    evidence:
      - "grep -r 'linkage' src/lib/canvas/ returns 0 results"
      - "No LinkageAnalyzer or similar service exists"
      - "Use Case 2 cannot complete: no AI-powered discovery"
    
    root_cause: |
      Epic 8 focused on React Flow integration and basic canvas functionality.
      AI-powered linkage discovery was planned for a later phase but never
      implemented.
    
    fix_strategy:
      approach: "Create LinkageAnalyzer service + UI overlay"
      steps:
        - "Create LinkageAnalyzer using embedding similarity"
        - "Define linkage types (conceptual, sequential, contrastive)"
        - "Add analysis trigger when 3+ nodes present"
        - "Create LinkageProposalOverlay component"
        - "Add accept/dismiss actions for proposals"
        - "Convert accepted proposals to edges"
      effort_hours: 12
      
    affected_use_cases: [2]
    blocking: true

  # GAP 5: Citation Sidebar → Chat Response
  - id: "GAP-005"
    name: "Citation Sidebar → Chat Response Disconnection"
    priority: "P1-HIGH"
    status: "OPEN"
    
    description: |
      CitationSidebar.tsx exists but is not wired to chat responses.
      When hybrid-retriever returns citations, they are not displayed
      to the user. The sidebar is isolated from the chat flow.
    
    source_component: "src/presentation/components/chat/ChatConversation.tsx"
    target_component: "src/presentation/components/rag/CitationSidebar.tsx"
    
    broken_connection:
      expected: "Chat response with citations → CitationSidebar displays sources"
      actual: "CitationSidebar exists but receives no data from chat"
      
    evidence:
      - "ChatConversation has no import of CitationSidebar"
      - "ChatPanel has no citation display area"
      - "Use Case 3 partially blocked: no source verification"
    
    root_cause: |
      CitationSidebar was created during Epic 7 as part of RAG panel container.
      It was designed for the isolated RAG UI, not for the main chat panel.
    
    fix_strategy:
      approach: "Wire citation data flow + add sidebar to ChatPanel"
      steps:
        - "Extend chat message type to include citations"
        - "Add CitationSidebar to ChatPanel (collapsible)"
        - "Subscribe sidebar to citation updates"
        - "Add click-to-source navigation"
      effort_hours: 6
      
    affected_use_cases: [3]
    blocking: false

# ═══════════════════════════════════════════════════════════════════════════
# MEDIUM PRIORITY GAPS (P2) - Enhance User Experience
# ═══════════════════════════════════════════════════════════════════════════

  # GAP 6: Knowledge Matrix Auto-Organization
  - id: "GAP-006"
    name: "Knowledge Matrix Auto-Organization Missing"
    priority: "P2-MEDIUM"
    status: "OPEN"
    
    description: |
      No auto-organization feature exists for the knowledge vault.
      Users must manually organize sources. No relevancy scoring,
      no subject classification, no organization recommendations.
    
    source_component: "src/presentation/components/knowledge/KnowledgePage.tsx"
    target_component: "N/A - service doesn't exist"
    
    broken_connection:
      expected: "Large vault → Matrix analysis → Organization recommendations"
      actual: "Only manual folder organization exists"
      
    evidence:
      - "No knowledge-graph.ts or similar service exists"
      - "No relevancy-scorer.ts exists"
      - "No organization-engine.ts exists"
      - "Use Case 4 cannot complete: no auto-organization"
    
    root_cause: |
      Use Case 4 was the most advanced feature planned. Foundation work
      was prioritized, leaving this enhancement for later phases.
    
    fix_strategy:
      approach: "Build complete knowledge organization system"
      steps:
        - "Create KnowledgeGraph service (nodes, edges, clusters)"
        - "Create RelevancyScorer (embedding similarity + metadata)"
        - "Create SubjectClassifier (topic modeling)"
        - "Create OrganizationEngine (recommendation generator)"
        - "Create OrganizationRecommendations UI component"
        - "Add to KnowledgePage with trigger"
      effort_hours: 16
      
    affected_use_cases: [4]
    blocking: true


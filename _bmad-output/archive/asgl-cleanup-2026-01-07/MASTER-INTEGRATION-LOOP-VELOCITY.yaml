# ═══════════════════════════════════════════════════════════════════════════
# GOVERNANCE & CHECKPOINTS
# ═══════════════════════════════════════════════════════════════════════════

governance_enforcement:
  frequency: "every 30 seconds"
  automated_checks: 10

  checkpoints:
    - name: "typescript_check"
      tool: "pnpm typecheck"
      pass_criteria: "0 errors in production code"
      run_frequency: "every_cycle"

    - name: "test_coverage"
      tool: "npm run test:coverage"
      pass_criteria: "≥80% coverage"
      run_frequency: "every_10_cycles"

    - name: "god_store_detection"
      tool: "find src -name '*-store.ts' -exec wc -l {} \;"
      pass_criteria: "0 files >300 lines"
      run_frequency: "every_5_cycles"

    - name: "god_component_detection"
      tool: "find src -name '*.tsx' -exec wc -l {} \;"
      pass_criteria: "0 files >300 lines"
      run_frequency: "every_5_cycles"

    - name: "design_system_check"
      tool: "grep -r 'backdrop-blur' src --include='*.tsx'"
      pass_criteria: "0 matches"
      run_frequency: "every_cycle"

    - name: "i18n_check"
      tool: "grep -r '>[A-Z][a-z]' src --include='*.tsx' | grep -v 't(' | head -20"
      pass_criteria: "0 hardcoded strings"
      run_frequency: "every_10_cycles"

    - name: "performance_check"
      tool: "npm run lighthouse"
      pass_criteria: "L1 targets met"
      run_frequency: "every_30_cycles"

    - name: "security_check"
      tool: "npm run audit"
      pass_criteria: "0 critical vulnerabilities"
      run_frequency: "every_30_cycles"

    - name: "build_check"
      tool: "pnpm build"
      pass_criteria: "build succeeds"
      run_frequency: "every_20_cycles"

    - name: "e2e_check"
      tool: "npm run test:e2e"
      pass_criteria: "100% passing"
      run_frequency: "every_50_cycles"


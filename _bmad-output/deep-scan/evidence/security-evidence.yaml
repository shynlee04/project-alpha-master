### SEC-001: XSS via Unescaped Directory Names in Error Messages
file: "src/infrastructure/filesystem/handle-persistence.ts"
lines: [446, 447, 448, 449, 450, 451, 452, 453, 454, 455, 456, 484, 485, 491, 492, 493, 494, 495, 496, 503]
description: |
  Directory names from user-selected folders are included in error messages
  without HTML/script escaping. While these are displayed in console logs and
  error objects (not directly in DOM), the pattern could lead to XSS if error
  messages are ever rendered in UI.
vulnerable_code: |
  // Line 446-456
  const expectedPath = record?.directoryPath;
  if (expectedPath && handle.name !== expectedPath) {
    console.warn(
      `[HandlePersistence] User selected different directory: "${handle.name}" != "${expectedPath}"`
    );
    return {
      success: false,
      handle: null,
      error: `Selected directory "${handle.name}" does not match expected "${expectedPath}".`,
      requiresUserInteraction: true,
    };
  }
risk_assessment:
  exploitability: Medium
  impact: Low
  likelihood: Low
remediation: |
  // Use escapeHtml utility for any UI-rendered error messages
  function escapeHtml(str: string): string {
    const div = globalThis.document?.createElement('div');
    if (!div) return str; // SSR fallback
    div.textContent = str;
    return div.innerHTML;
  }
  // When building error messages for UI:
  error: `Selected directory "${escapeHtml(handle.name)}" does not match expected "${escapeHtml(expectedPath)}".`,
evidence: |
  - Console logging only (not DOM) - Current Impact: LOW
  - Pattern established for future DOM rendering - Risk: MEDIUM
severity: MEDIUM

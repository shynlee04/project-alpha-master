### SEC-007: Hydration URL Parsing Without Input Sanitization
file: "src/infrastructure/persistence/stores/hydration-manager.ts"
lines: [56, 57, 58, 59, 60, 61]
description: |
  Project ID is extracted from URL pathname without sanitization. While URL routing
  is typically handled by TanStack Router, this direct parsing could be a concern
  if routes are bypassed.
risk: LOW
remediation: |
  private getProjectIdFromURL(): string | null {
    const pathname = window.location.pathname;
    const sanitized = pathname.replace(/[\x00-\x1f\x7f]/g, '');
    const match = sanitized.match(/\/(ide|study|notes|knowledge)\/([^/]+)/i);
    return match ? match[2] : null;
  }
severity: LOW

### SEC-002: Input Validation Missing on projectId Parameters
file: "src/infrastructure/filesystem/handle-persistence.ts"
lines: [182, 183, 184, 185, 186, 187, 188, 189, 190, 191, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 512, 513, 514, 515, 520, 521, 522, 523, 524, 525, 530, 531, 532, 533, 534, 535, 555, 556, 557, 558, 559, 560]
description: |
  Multiple functions accept projectId as a string parameter without validation.
  Project IDs are expected to follow a specific format, but this format is not
  enforced at the API boundaries.
affected_functions:
  - persistHandle(projectId: string, ...)
  - restoreHandle(projectId: string)
  - deleteHandle(projectId: string)
  - updatePermissionStatus(projectId: string, ...)
  - getPermissionStatus(projectId: string)
  - canSilentRestore(projectId: string)
vulnerable_code: |
  async persistHandle(
    projectId: string,  // No validation
    handle: FileSystemDirectoryHandle,
    workspaceId: 'ide' | 'knowledge' | 'study' | 'notes' = 'ide'
  ): Promise<void> {
    const metadata = serializeHandle(handle, workspaceId);
    // ... proceeds without projectId validation
  }
risk_assessment:
  exploitability: Low
  impact: Medium
  likelihood: Low
remediation: |
  // Add validation function
  function validateProjectId(projectId: string): projectId is string {
    if (typeof projectId !== 'string' || projectId.length === 0) {
      return false;
    }
    return true;
  }
  // Apply to all public methods
  async persistHandle(
    projectId: string,
    handle: FileSystemDirectoryHandle,
    workspaceId: WorkspaceType = 'ide'
  ): Promise<void> {
    if (!validateProjectId(projectId)) {
      throw new Error(`Invalid projectId: ${projectId}`);
    }
  }
evidence: |
  - generateProjectId() in project-crud-slice.ts enforces format
  - But external callers could pass invalid projectIds
  - Dexie operations use projectId as primary key
severity: MEDIUM

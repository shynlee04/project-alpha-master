## LOW Severity Issues (4)
### SEC-004: Predictable Handle ID Generation
file: "src/infrastructure/filesystem/handle-persistence.ts"
lines: [120, 121]
description: |
  Handle ID generation uses Math.random() which is not cryptographically secure.
code: |
  export function generateHandleId(handle: FileSystemDirectoryHandle): string {
    return `${handle.name}-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
  }
risk: LOW
remediation: |
  export function generateHandleId(handle: FileSystemDirectoryHandle): string {
    const array = new Uint8Array(8);
    crypto.getRandomValues(array);
    const randomPart = Array.from(array, b => b.toString(36)).join('').slice(0, 8);
    return `${handle.name}-${Date.now()}-${randomPart}`;
  }
severity: LOW

---
# ══════════════════════════════════════════════════════
# UX FLOW EVIDENCE: Project/Notes Lifecycle
# ════════════════════════════════════════════════════════

scan_metadata:
  scan_date: "2026-01-20"
  scanner: "deep-scan-ux-scanner"
  target: "project-notes-lifecycle-ux"
  level: "1-smelling"

# ============================================================================
# ROUTE INVENTORY
# ============================================================================
route_inventory:
  entry_routes:
    - path: "/"
      file: "src/routes/index.tsx"
      lazy_loaded: false
      loaders: []
      guards: []
      component: HubHomePage
      description: "Hub entry point with project selection and creation"

    - path: "/hub"
      file: "src/routes/hub.tsx"
      lazy_loaded: false
      loaders: []
      guards: []
      component: HubHomePage (shared)
      description: "Hub entry for navigation and project management"

  notes_routes:
    - path: "/notes"
      file: "src/routes/notes.lazy.tsx"
      lazy_loaded: true
      loaders: []
      guards:
        - redirect_to_most_recent_project
        - redirect_to_hub_if_no_projects
      loading_state: "spinner_with_text"
      component: NotesRedirect
      description: "Lazy-loaded redirect route to most recent project"

    - path: "/notes/:projectId"
      file: "src/routes/notes.$projectId.tsx"
      lazy_loaded: false
      loaders:
        - loader_with_waitForHydration
        - dexie_project_query
      guards:
        - redirect_to_hub_if_project_not_found
      loading_state: "client_side_hydration"
      component: NotesWorkspace
      description: "Notes workspace with project context"

  ide_routes:
    - path: "/ide/:projectId"
      file: "src/routes/ide.$projectId.tsx"
      lazy_loaded: false
      loaders:
        - loader_with_waitForHydration
        - dexie_project_query
      guards:
        - requireIDEAccess (desktop_only)
        - redirect_to_hub_if_project_not_found
        - mobile_redirect_with_reason_param
      loading_state: "client_side_hydration + lazy_layout"
      component: IDEWorkspace
      description: "IDE workspace with platform validation"

  knowledge_routes:
    - path: "/knowledge/:projectId"
      file: "src/routes/knowledge.$projectId.lazy.tsx"
      lazy_loaded: true
      loaders: []
      guards: []
      loading_state: "unknown"
      component: unknown
      description: "DEFERRED - Knowledge workspace route"

  workspace_routes:
    - path: "/workspace/:projectId"
      file: "src/routes/workspace/$projectId.tsx"
      lazy_loaded: false
      loaders: []
      guards: []
      loading_state: "unknown"
      component: unknown
      description: "Legacy workspace route"

# ============================================================================
# PATH A: PROJECT CREATION → NOTES → NOTE
# ============================================================================
path_a_route_flow:
  stage_initial_load:
    route: "/"
    component: "HubHomePage"
    loaders: []
    guards: []
    loading_state: "exists (BootSequence animation)"
    hydration: "client_side"
    description: "8-bit BIOS boot animation on initial load"

  stage_project_creation:
    route: "/hub (with ?action=create-project)"
    component: "ProjectCreationWizard"
    navigation_trigger: "button_click (CREATE_PROJECT card)"
    lazy_boundary: "yes (dialog)"
    loading_state: "spinner_during_file_picker"
    description: "FSA directory picker or IndexedDB creation"

  stage_notes_entry:
    route: "/notes/:projectId"
    component: "NotesWorkspace"
    loaders:
      - waitForHydration()
      - db.projects.get(projectId)
    hydration: "client_side"
    loading_state: "spinner (NotesPage project context)"
    description: "Project loaded in loader, NotesPage shows loading if context unavailable"

  stage_note_open:
    route: "/notes/:projectId (noteId in URL state)"
    component: "NoteEditor"
    lazy_loaded: "no (NotesPage directly imports)"
    loading_state: "none (instant render)"
    description: "Note selected from sidebar, editor opens instantly"

  stage_mobile_notes:
    route: "/notes/:projectId (mobile)"
    component: "NotesMobileLayout"
    mobile_layout: "tab_based_navigation"
    loading_state: "import_progress_overlay"
    description: "Mobile uses bottom nav, import shows full-screen overlay"

# ============================================================================
# PATH B: REVISIT FROM PROJECT ID (URL REHYDRATION)
# ============================================================================
path_b_route_flow:
  stage_revisit:
    route: "/notes/:projectId"
    restored_from: "url_param (projectId)"
    loader: "project_loader with waitForHydration()"
    hydration: "client_side"
    loading_state: "spinner (NotesPage project context check)"
    description: "URL param triggers loader, project loaded from Dexie"

  stage_notes_load:
    component: "NotesPage"
    loaders:
      - loadNotes(projectId) (useLiveQuery)
    hydration: "dexie_live_query"
    loading_state: "import_progress_overlay (FSA projects)"
    description: "Notes loaded from IndexedDB or FSA directory"

  stage_fsa_auto_import:
    component: "NotesPage"
    auto_init: "true (FSA projects only)"
    loading_state: "import_progress_overlay_with_percentage"
    timeout: "30 seconds max"
    description: "Auto-import FSA files with progress bar"

  stage_note_render:
    component: "NoteEditor"
    hydration: "instant (notes already loaded)"
    loading_state: "none"
    description: "Active note renders immediately from notesArray"

# ============================================================================
# LAZY LOADING STRATEGY
# ============================================================================
lazy_loading_strategy:
  lazy_routes:
    - path: "/about"
      file: "src/routes/about.lazy.tsx"
      estimated_size: "unknown"
    - path: "/notes"
      file: "src/routes/notes.lazy.tsx"
      estimated_size: "unknown"
    - path: "/knowledge/:projectId"
      file: "src/routes/knowledge.$projectId.lazy.tsx"
      estimated_size: "unknown (DEFERRED)"

  lazy_components:
    - component: "IDELayout"
      location: "src/routes/ide.$projectId.tsx"
      loaded_via: "React.lazy()"
      reason: "IDE components are heavy (Monaco, XTerminal)"
    - component: "FileTree"
      location: "src/presentation/components/ide/IDEMobileLayout.tsx"
      loaded_via: "React.lazy()"
      reason: "Mobile panel optimization"
    - component: "XTerminal"
      location: "src/presentation/components/ide/IDEMobileLayout.tsx"
      loaded_via: "React.lazy()"
      reason: "Mobile panel optimization"
    - component: "AgentChatPanel"
      location: "src/presentation/components/ide/IDEMobileLayout.tsx"
      loaded_via: "React.lazy()"
      reason: "Mobile panel optimization"
    - component: "SettingsPanel"
      location: "src/presentation/components/ide/IDEMobileLayout.tsx"
      loaded_via: "React.lazy()"
      reason: "Mobile panel optimization"

  code_splitting: "both (route-based + component-based)"
  bundle_estimates:
    - route: "/"
      estimated_size: "small (HubHomePage, BentoGrid, RecentProjects)"
    - route: "/notes/:projectId"
      estimated_size: "medium (NotesPage 975 lines, NoteEditor, BlockNote)"
    - route: "/ide/:projectId"
      estimated_size: "large (IDELayout, MonacoEditor, XTerminal)"

# ============================================================================
# LOADING STATES
# ============================================================================
loading_states:
  skeletons:
    - component: "HubHomePage (SummaryCardsGrid, RecentProjectsSection)"
      loading_target: "metrics_and_projects"
      visibility: "always (while projects loading)"
      description: "Skeleton cards for metrics and project list"

    - component: "IDEMobileLayout (PanelLoadingSkeleton)"
      loading_target: "mobile_panels"
      visibility: "always (during panel lazy load)"
      description: "Spinner with label 'Loading {panel}...'"

  spinners:
    - component: "notes.lazy.tsx (NotesRedirect)"
      loading_target: "project_redirection"
      visibility: "always (while querying projects)"
      description: "8px spinner with 'Loading Notes...' text"

    - component: "ide.$projectId.tsx (IDEWorkspace)"
      loading_target: "IDELayout (lazy)"
      visibility: "always (while IDELayout loading)"
      description: "8px spinner in full-screen center"

    - component: "NotesPage"
      loading_target: "project_context"
      visibility: "conditional (if !projectId)"
      description: "8px spinner with 'Loading notes...' text"

    - component: "NotesPage (import progress)"
      loading_target: "FSA_file_import"
      visibility: "overlay (full-screen)"
      description: "Spinner with progress bar and file count"

    - component: "NotesPage (auto-import)"
      loading_target: "FSA_directory_import"
      visibility: "overlay (full-screen with card)"
      description: "Spinner with current file, progress percentage, file count"

  missing_loading_states: []
  all_components_have_loading: true

# ============================================================================
# HYDRATION & STATE MANAGEMENT
# ============================================================================
hydration:
  client_side_hydration:
    - route: "/notes/:projectId"
      method: "loader with waitForHydration()"
      issue: "none (fixed INF-03 race condition)"
    - route: "/ide/:projectId"
      method: "loader with waitForHydration()"
      issue: "none (fixed INF-03 race condition)"

  server_side_rendering: []
  ssr_disabled: "All workspaces disable SSR (ssr: false)"
  reason: "FSA, Dexie, WebContainer require browser environment"

  hydration_issues:
    - route: "none (all race conditions fixed)"
      issue: "none"
      severity: "none"
      status: "RESOLVED (INF-03 fix applied)"

# ============================================================================
# RESPONSIVE DESIGN
# ============================================================================
responsive_design:
  breakpoints_used:
    - name: "sm"
      value: "640px"
      usage: "hidden_sm, text_xs_sm"
    - name: "md"
      value: "768px"
      usage: "hidden_md, text_xs_md, panel_min_sizes"
    - name: "lg"
      value: "1024px"
      usage: "grid_cols_lg, sidebar_lg"
    - name: "xl"
      value: "1280px"
      usage: "grid_cols_xl, sidebar_xl"

  mobile_support: "full (optimized for < 768px)"
  tablet_support: "full (768px - 1023px)"
  desktop_support: "full (>= 1024px)"

  touch_targets:
    - component: "MobileTabBar"
      size_px: 44
      compliant: "yes (WCAG 2.5.5)"
      css_class: "min-w-[44px] min-h-[44px]"
    - component: "IDEMobileLayout buttons"
      size_px: 44
      compliant: "yes"
      css_class: "touch-target-min"
    - component: "NotesMobileLayout buttons"
      size_px: 44
      compliant: "yes"
      css_class: "touch-target-min"
    - component: "NotesPage note items"
      size_px: 64
      compliant: "yes"
      css_class: "p-4 (16px * 4 = 64px)"

  portrait_phone:
    - route: "/"
      support: "full"
      layout: "boot_sequence → hero → bento_grid → recent_projects"
      issues: []

    - route: "/notes/:projectId"
      support: "full"
      layout: "NotesMobileLayout (tab-based: notes | search | ai | threads)"
      issues: []

    - route: "/ide/:projectId"
      support: "full"
      layout: "IDEMobileLayout (tab-based: files | terminal | chat | settings)"
      issues: []

    - route: "/knowledge/:projectId"
      support: "unknown"
      layout: "unknown"
      issues: ["DEFERRED - no mobile layout found"]

    - route: "/study/:projectId"
      support: "unknown"
      layout: "unknown"
      issues: ["DEFERRED - no mobile layout found"]

  mobile_breakpoint_enforcement:
    - breakpoint: "768px"
    usage: "Mobile layouts use md:hidden for bottom nav"
    safe_areas: "pb-[env(safe-area-inset-bottom)] for notched devices"
    description: "Bottom nav visible on mobile, hidden on tablet+"

# ============================================================================
# USER JOURNEY ISSUES
# ============================================================================
user_journey_issues:
  - stage: "project_creation"
    issue: "FSA file picker can be cancelled but no explicit feedback"
    severity: "low"
    current_behavior: "AbortError is silently caught"
    recommendation: "Show toast 'Folder selection cancelled'"

  - stage: "notes_entry"
    issue: "No loading state for project context hydration on fast networks"
    severity: "low"
    current_behavior: "Instant render, but spinner may briefly appear"
    recommendation: "Add skeleton for NotesSidebar if context loading"

  - stage: "FSA_auto_import"
    issue: "30-second timeout is fixed, but large projects may still timeout"
    severity: "medium"
    current_behavior: "Shows 'Import timeout' toast, user must manually retry"
    recommendation: "Add 'Retry' button in error state, implement chunked import"

  - stage: "mobile_nav_transition"
    issue: "Mobile tab bar shows 'hamburger' but menu not implemented"
    severity: "medium"
    current_behavior: "Menu button exists in IDEMobileLayout header"
    recommendation: "Implement sidebar drawer or remove button"

  - stage: "knowledge_workspace"
    issue: "Knowledge route deferred, no mobile layout found"
    severity: "high"
    current_behavior: "Route exists but component unknown"
    recommendation: "Implement KnowledgeMobileLayout or redirect to Notes"

  - stage: "study_workspace"
    issue: "Study route deferred, no mobile layout found"
    severity: "high"
    current_behavior: "Route exists but component unknown"
    recommendation: "Implement StudyMobileLayout or redirect to Notes"

# ============================================================================
# I18N VIOLATIONS (Hardcoded Strings)
# ============================================================================
i18n_violations:
  - file: "src/routes/notes.lazy.tsx"
    violations:
      - line: 148
        string: "Redirecting to most recent project"
        recommendation: 't("notes.redirecting_to_project", "...")'
      - line: 168
        string: "Loading Notes..."
        recommendation: 't("notes.loading_notes", "...")'

  - file: "src/routes/ide.$projectId.tsx"
    violations:
      - line: 48
        string: "Route guard passed (platform validated)"
        recommendation: "Remove or use console.t log"

  - file: "src/presentation/components/ide/IDEMobileLayout.tsx"
    violations:
      - line: 79
        string: "Loading {label}..."
        recommendation: 't("ide.loading_panel", "Loading {{label}}...")'

  - file: "src/presentation/components/notes/NotesPage.tsx"
    violations:
      - line: 560
        string: "No notes yet"
        recommendation: 't("notes.no_notes", "...")'
      - line: 562
        string: "Tap + to create your first note"
        recommendation: 't("notes.create_first_note", "...")'
      - line: 617
        string: "Loading project files..."
        recommendation: 't("notes.loading_files", "...")'
      - line: 880
        string: "Select or create a note to start writing"
        recommendation: 't("notes.select_or_create", "...")'

# ============================================================================
# ACCESSIBILITY ISSUES
# ============================================================================
accessibility_issues:
  - component: "MobileTabBar"
    issue: "Missing aria-controls on tab buttons"
    severity: "low"
    current_behavior: "aria-controls={`panel-${tab.id}`} present"
    status: "COMPLIANT ✅"

  - component: "NotesMobileLayout"
    issue: "Touch targets are compliant but keyboard navigation unknown"
    severity: "medium"
    current_behavior: "No visible keyboard shortcuts in mobile"
    recommendation: "Add keyboard navigation hints or remove if touch-only"

  - component: "IDEMobileLayout"
    issue: "Bottom nav bar uses button role but no keyboard navigation documented"
    severity: "medium"
    current_behavior: "role='tab' but no tab key handling visible"
    recommendation: "Implement arrow key navigation or change to button-only"

  - component: "HubHomePage"
    issue: "Bento cards have hover effects but keyboard focus unclear"
    severity: "low"
    current_behavior: "retro-hover class exists"
    recommendation: "Add focus-visible:outline-none focus-visible:ring-2 styles"

# ============================================================================
# RESPONSIVE DESIGN VIOLATIONS
# ============================================================================
responsive_violations:
  - component: "HubHomePage (BentoGrid)"
    issue: "Grid columns vary by screen but min-width not enforced"
    severity: "low"
    current_behavior: "grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    recommendation: "Add min-width to prevent squished cards on ultra-wide screens"

  - component: "NotesPage (ResizablePanelGroup)"
    issue: "Desktop panels have minPixelSize but mobile uses different layout"
    severity: "none"
    current_behavior: "Mobile uses NotesMobileLayout, desktop uses ResizablePanelGroup"
    status: "INTENDED ✅ (mobile-first approach)"

  - component: "IDEWorkspace (ResizablePanelGroup)"
    issue: "Desktop panels have minPixelSize but mobile uses different layout"
    severity: "none"
    current_behavior: "Mobile uses IDEMobileLayout, desktop uses ResizablePanelGroup"
    status: "INTENDED ✅ (mobile-first approach)"

# ============================================================================
# UNCLEAR FILES & CODE SMELLS
# ============================================================================
unclean_files:
  - file: "src/routes/notes.lazy.tsx"
    lines: 173
    issues:
      - "Console.log statements for debugging (lines 80, 95, 107, 116)"
      - "Commented-out console.log (line 159)"
      - "Redirect logic is complex and platform-specific"
    complexity: "medium"

  - file: "src/routes/ide.$projectId.tsx"
    lines: 111
    issues:
      - "Console.log statements for debugging (lines 44, 49, 55, 59, 71, 92)"
      - "Lazy-loaded IDELayout with Suspense fallback"
    complexity: "low"

  - file: "src/routes/notes.$projectId.tsx"
    lines: 101
    issues:
      - "Console.log statements for debugging (lines 46, 50, 56, 62, 73, 80, 93)"
      - "Multiple comments referencing story IDs and fixes"
    complexity: "low"

  - file: "src/presentation/components/hub/HubHomePage.tsx"
    lines: 521
    issues:
      - "Large component (>500 lines, god component risk)"
      - "Console.log statements scattered throughout"
      - "Complex navigation logic (BUG-017 fix, workspace bindings)"
      - "Multiple useEffect hooks with unrelated logic"
    complexity: "high"

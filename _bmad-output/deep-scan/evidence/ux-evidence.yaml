      - "Very large component (god component, >500 lines)"
      - "Multiple useEffect hooks with complex dependencies"
      - "Console.log statements throughout (lines 82, 236, 246, 251, 265, 296, 316, 341, 373, 420, 446, 455)"
      - "Auto-init logic with refs to prevent infinite loops (BUG-016 fix)"
      - "Cross-workspace event subscriptions (R3 FIX re-enabled after infinite loop)"

# ============================================================================
# RECOMMENDATIONS (Prioritized)
# ============================================================================
recommendations:
  priority_p0:
    - "Split HubHomePage.tsx (521 lines) into smaller components"
      effort: "4 hours"
      impact: "Reduces component complexity, improves maintainability"
    - "Split NotesPage.tsx (975 lines) into smaller components"
      effort: "8 hours"
      impact: "Critical - god component elimination, improves rendering performance"

  priority_p1:
    - "Implement KnowledgeMobileLayout or redirect to Notes"
      effort: "4 hours"
      impact: "Fixes broken mobile UX for Knowledge workspace"
    - "Implement StudyMobileLayout or redirect to Notes"
      effort: "4 hours"
      impact: "Fixes broken mobile UX for Study workspace"
    - "Add i18n to all hardcoded strings in routes and components"
      effort: "6 hours"
      impact: "Enables Vietnamese translation support"

  priority_p2:
    - "Remove debug console.log statements from production code"
      effort: "2 hours"
      impact: "Cleans up code, reduces bundle size"
    - "Add retry button to FSA import timeout error state"
      effort: "3 hours"
      impact: "Improves UX for large project imports"
    - "Implement keyboard navigation for mobile tab bars"
      effort: "4 hours"

    **PRIMARY ROOT CAUSE**: FSA handle race condition between ProjectContext and NotesPage

    The execution timeline on desktop (FSA projects):
    1. Route loader runs, queries Dexie, returns project data ✅
    2. ProjectProvider mounts with project prop ✅
    3. ProjectProvider starts async FSA handle restore (useEffect, not awaited) ⏳
    4. NotesPage renders while handle restoration is in progress 🏁
    5. NotesPage calls loadNotes() immediately (lines 221-229) 🏁
    6. loadNotes() tries to create storage gateway with mountedHandle ❌
    7. mountedHandle is undefined (handle restoration still pending) ❌
    8. gateway.list('/notes') fails, caught in try-catch (line 128-130) ❌
    9. Error set in note store state but no UI displays this error 🚨
    10. User sees black screen because:

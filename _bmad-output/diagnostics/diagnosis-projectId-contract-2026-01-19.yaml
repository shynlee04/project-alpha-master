## Fix Design

### Option 1: Add Loader to Notes Route (RECOMMENDED)

**Rationale**:
- Minimal change - mirrors working IDE route pattern
- No migration required - IDs already stored in namespaced format
- Fixes immediate bug without data changes

**Changes**:
1. Add `loader` to `/notes/$projectId` route (mirrors IDE route)
2. Query Dexie with `projectId` as-is (already works for IDE)

**Files**:
- `src/routes/notes.$projectId.lazy.tsx`

### Option 2: Strip Workspace Prefix in Loader (NOT RECOMMENDED)

**Rationale**:
- Breaks consistency - would need to strip prefix in IDE route too
- Doesn't address root cause (missing loader)
- Creates debt: why have prefix if we strip it everywhere?

**Why not**: Premature optimization without evidence that prefix causes issues.

### Option 3: Migrate to Bare IDs (NOT RECOMMENDED)

**Rationale**:
- Requires migration of all existing Dexie records
- High risk - data loss if migration fails
- No clear benefit over Option 1

**Why not**: High-risk, low-benefit data migration.


    storageType: record.storageType || 'fsa',  // Default to 'fsa' for legacy records
    ```

    If the actual Dexie record has no storageType field, fromRecord() assumes 'fsa'.
    This causes the code to attempt FSA operations even for IndexedDB projects,
    leading to silent failures.


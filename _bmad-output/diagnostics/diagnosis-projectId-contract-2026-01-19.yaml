## Root Cause Statement (UPDATED 2026-01-19 15:00 UTC)

**ORIGINAL BUG** (FIXED): Notes route had no loader to query Dexie with projectId, causing `useLoaderData()` to return `undefined`.

**BLACK SCREEN ROOT CAUSE IDENTIFIED**:

**PRIMARY**: FSA handle race condition in ProjectContext.tsx:280-308
- ProjectProvider starts async FSA handle restoration in useEffect (not awaited)
- NotesPage mounts and calls loadNotes() immediately
- loadNotes() tries to create storage gateway with mountedHandle from notesSyncService
- mountedHandle is undefined because handle restoration is still pending
- gateway.list('/notes') fails silently, error is caught but not displayed
- Result: Empty state that renders as "black screen" if layout also fails

**SECONDARY**: fromRecord() in project-crud-slice.ts:89-103
- Defaults storageType to 'fsa' if not present in Dexie record
- Causes code to attempt FSA operations for IndexedDB projects
- Silent failures when FSA handle doesn't exist

**EXACT FAILURE POINT**: note-crud-slice.ts:52-131, specifically lines 64-71
```typescript
const notesSyncService = get().notesSyncService;
const mountedHandle = (notesSyncService as any)?.getDirectoryHandle?.();
// mountedHandle is undefined here -> createStorageGateway fails
```

**WHY BLACK SCREEN**: The error is set in noteStore.error but NotesPage doesn't display this error state. Combined with:
- Empty notesArray (no notes loaded)
- Null activeNote (no note selected)
- Possible CSS/layout rendering issues
- Result: User sees black screen instead of error message


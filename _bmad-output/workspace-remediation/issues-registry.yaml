# Issues Registry - Storage Type Architecture & User Journey Crisis
# Generated: 2026-01-07
# Scope: Comprehensive workspace scan

issues:
  # ============================================================================
  # P0 - Critical User Journey Blockers
  # ============================================================================

  - id: "WIZ-001"
    category: "Wizard Confusion"
    location: "src/presentation/components/project/ProjectCreationWizard.tsx:262-265"
    severity: "P0"
    status: "identified"
    description: |
      IDE binding shown for IndexedDB but forced to false on creation.
      User selects IDE checkbox but it gets silently overridden.
    impact: |
      Creates false expectation - users think they can use IDE workspace
      with IndexedDB storage, but it's silently disabled.
    suggested_fix: |
      Disable IDE checkbox when IndexedDB selected, show explanatory message.
    estimated_effort: "1h"
    depends_on: []
    validation_criteria:
      - "IDE checkbox disabled when storageType === 'indexeddb'"
      - "Clear message shown: 'IDE requires File System Access (desktop only)'"
      - "No silent overrides of user selection"

  - id: "WKS-001"
    category: "No Project List"
    location: "src/presentation/components/notes/NotesPage.tsx"
    severity: "P0"
    status: "identified"
    description: |
      Users cannot switch projects from within the Notes workspace.
      Once entered, users are stuck with the current project.
    impact: |
      Workspace becomes a dead-end. Users must return to Hub to switch projects.
    suggested_fix: |
      Add ProjectSelector component using useWorkspaceProjects hook.
    estimated_effort: "1h"
    depends_on: ["WKS-002", "WKS-003", "WKS-004"]
    validation_criteria:
      - "Project dropdown visible in Notes workspace header"
      - "All available projects shown (filtered by workspace binding)"
      - "Switching projects updates context and navigates correctly"

  - id: "WKS-002"
    category: "No Project List"
    location: "src/presentation/components/study/StudyPage.tsx"
    severity: "P0"
    status: "identified"
    description: |
      Users cannot switch projects from within the Study workspace.
      Once entered, users are stuck with the current project.
    impact: |
      Workspace becomes a dead-end. Users must return to Hub to switch projects.
    suggested_fix: |
      Add ProjectSelector component using useWorkspaceProjects hook.
    estimated_effort: "1h"
    depends_on: ["WKS-001", "WKS-003", "WKS-004"]
    validation_criteria:
      - "Project dropdown visible in Study workspace header"
      - "All available projects shown (filtered by workspace binding)"
      - "Switching projects updates context and navigates correctly"

  - id: "WKS-003"
    category: "No Project List"
    location: "src/presentation/components/knowledge/KnowledgePage.tsx"
    severity: "P0"
    status: "identified"
    description: |
      Users cannot switch projects from within the Knowledge workspace.
      Additionally, storage type is completely ignored.
    impact: |
      Workspace becomes a dead-end. FSA projects may fail on mobile.
    suggested_fix: |
      Add ProjectSelector component + implement storage type awareness.
    estimated_effort: "2h"
    depends_on: ["WKS-001", "WKS-002", "WKS-004", "STG-001"]
    validation_criteria:
      - "Project dropdown visible in Knowledge workspace header"
      - "Storage type awareness implemented"
      - "Mobile users see FSA projects as disabled"

  - id: "WKS-004"
    category: "No Project List"
    location: "src/presentation/components/ide/IDELayout.tsx"
    severity: "P0"
    status: "identified"
    description: |
      Users cannot switch projects from within the IDE workspace.
      IDE only supports FSA storage, but no validation exists.
    impact: |
      Workspace becomes a dead-end. IndexedDB users may enter with broken state.
    suggested_fix: |
      Add ProjectSelector showing only FSA projects with clear messaging.
    estimated_effort: "1h"
    depends_on: ["WKS-001", "WKS-002", "WKS-003"]
    validation_criteria:
      - "Project dropdown visible in IDE workspace header"
      - "Only FSA projects shown (IndexedDB filtered out)"
      - "Clear message about IDE requiring desktop browser"

  - id: "MOB-001"
    category: "Mobile Issues"
    location: "src/presentation/components/common/WorkspaceSwitcher.tsx:65"
    severity: "P0"
    status: "identified"
    description: |
      WorkspaceSwitcher component has className="hidden md:flex"
      This hides workspace switching entirely on mobile devices.
    impact: |
      Mobile users cannot switch between workspaces at all.
    suggested_fix: |
      Implement mobile-optimized workspace switcher (bottom sheet or drawer).
    estimated_effort: "1h"
    depends_on: []
    validation_criteria:
      - "Workspace switcher visible on mobile"
      - "Touch-optimized UI (minimum 44x44px touch targets)"
      - "Project switching also available on mobile"

  # ============================================================================
  # P1 - High Priority Issues
  # ============================================================================

  - id: "STG-001"
    category: "Storage Type Ignorance"
    location: "src/presentation/components/knowledge/KnowledgePage.tsx"
    severity: "P1"
    status: "identified"
    description: |
      KnowledgePage completely ignores storage type.
      No check for FSA-only features on mobile.
    impact: |
      FSA projects may fail silently on mobile devices.
      No user warnings about compatibility issues.
    suggested_fix: |
      Implement storage type checking similar to NotesPage pattern.
    estimated_effort: "2h"
    depends_on: []
    validation_criteria:
      - "project.storageType accessed and validated"
      - "Mobile users see FSA warning"
      - "File sync service initialized with correct storage type"

  - id: "PAT-001"
    category: "Pattern Inconsistency"
    location: "Multiple files"
    severity: "P1"
    status: "identified"
    description: |
      Mixed project access patterns across workspaces:
      - NotesPage: useProjectContext() (Modern)
      - StudyPage: useIDEStore() (Legacy)
      - KnowledgePage: useIDEStore() (Legacy)
      - IDE: useIDEStore() (Legacy)
    impact: |
      Maintenance complexity, potential state synchronization issues.
    suggested_fix: |
      Migrate all workspaces to useWorkspaceProjects hook.
    estimated_effort: "3h"
    depends_on: ["WKS-001", "WKS-002", "WKS-003", "WKS-004"]
    validation_criteria:
      - "All workspaces use useWorkspaceProjects hook"
      - "No direct useIDEStore for project access"
      - "Consistent behavior across all workspaces"

  - id: "SYNC-001"
    category: "File Sync Missing"
    location: "src/presentation/components/knowledge/KnowledgePage.tsx"
    severity: "P1"
    status: "identified"
    description: |
      KnowledgePage has no file sync service integration.
      Unlike NotesPage and StudyPage, no useFileSyncService hook.
    impact: |
      Knowledge workspace cannot sync files with local filesystem.
      Core functionality missing from workspace.
    suggested_fix: |
      Add useFileSyncService hook call with storage type awareness.
    estimated_effort: "2h"
    depends_on: ["STG-001"]
    validation_criteria:
      - "useFileSyncService hook called in KnowledgePage"
      - "Storage type passed correctly"
      - "Sync status indicator visible"

  # ============================================================================
  # P2 - Medium Priority Issues
  # ============================================================================

  - id: "WIZ-002"
    category: "Wizard UX"
    location: "src/presentation/components/project/steps/ProjectDetailsStep.tsx"
    severity: "P2"
    status: "identified"
    description: |
      No storage type compatibility information shown during project creation.
      Users don't know which storage type to choose.
    impact: |
      Users make uninformed choices about storage type.
    suggested_fix: |
      Add info badges: "[indexeddb] ✅ Mobile + Desktop" / "[fsa] 💻 Desktop only"
    estimated_effort: "0.5h"
    depends_on: []
    validation_criteria:
      - "Storage type info badges visible in wizard"
      - "Clear messaging about compatibility"

  - id: "PAT-002"
    category: "Store Pattern"
    location: "src/infrastructure/persistence/stores/"
    severity: "P2"
    status: "identified"
    description: |
      No unified useWorkspaceProjects hook exists.
      Each workspace implements its own project filtering logic.
    impact: |
      Code duplication, inconsistent behavior.
    suggested_fix: |
      Create useWorkspaceProjects hook in project store directory.
    estimated_effort: "1.5h"
    depends_on: []
    validation_criteria:
      - "useWorkspaceProjects hook created"
      - "Used by all workspaces"
      - "Mobile filtering and storage type validation included"


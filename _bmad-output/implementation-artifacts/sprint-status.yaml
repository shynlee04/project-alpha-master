# ============================================================================
# ROOT CAUSE ANALYSIS (From Routing Analysis Workflow)
# ============================================================================

root_causes:
  rc1_project_concept:
    name: "Project Concept Ambiguity"
    description: |
      The "Project" is intended to be the central hub for pro/serious users 
      to store, manage, and regulate assets/resources across workspaces.
      However, its boundaries are undefined.
    sub_issues:
      - storage_duality: "FSA vs IndexedDB unclear UX"
      - workspace_binding: "Complexity in bindings management"
      - temp_project_confusion: "Multiple creation pathways"
      - lifecycle_unclear: "Missing project lifecycle management"
    status: "NEEDS_ANALYSIS"
    
  rc2_byok_vault:
    name: "BYOK & Vault Persistence"
    description: |
      BYOK (MVP support for OpenRouter and Gemini) integration within
      the client-side vault must be reliable with keys persistent and
      seamlessly accessible across all workspaces.
    sub_issues:
      - vault_created: "provider-credentials-slice.ts created"
      - cross_workspace_sync: "Keys not synced on mount"
      - key_validation: "✅ Server-side validation endpoint created (B-3 DONE)"
      - fallback_missing: "No graceful degradation"
    status: "MOSTLY_ADDRESSED"

# ============================================================================
# USER JOURNEY SPECIFICATIONS - NOTES WORKSPACE
# ============================================================================

notes_workspace_journeys:
  case_1_desktop_no_sync:
    name: "Case 1: Desktop - No Sync"
    description: "User accesses Note space without local file system synchronization"
    entry_points:
      - "/notes (direct)"
      - "/hub → Notes bento card"
      - "/hub → Recent project → Notes"
    expected_behavior: |
      1. Check for existing projects with notes binding
      2. If exists → Show project picker or redirect to most recent
      3. If none → Offer to create temp project (IndexedDB)
      4. Load NotesPage with BlockNote editor
    status: "NEEDS_TRACE"
    blockers: []
    
  case_2_desktop_sync:
    name: "Case 2: Desktop - With Sync"
    description: "User syncs a local folder to Note space"
    entry_points:
      - "/hub → Mount Folder → Enable Notes"
      - "/ide/$projectId → Switch to Notes"
    expected_behavior: |
      1. FSA project already has folder handle
      2. User enables notes binding
      3. Navigate to /notes/$projectId
      4. Load files from FSA for display in BlockNote
      5. Support md, doc, docx, png, jpg, pdf, etc.
    status: "NEEDS_TRACE"
    blockers:
      - "File type rendering not verified"
      - "FSA → Notes bridge unclear"
    
  case_3_mobile:
    name: "Case 3: Mobile IndexedDB"
    description: "User accesses Note space via mobile device"
    entry_points:
      - "/notes (direct on mobile)"
    expected_behavior: |
      1. Detect mobile (no FSA support)
      2. Use IndexedDB storage only
      3. Behave like Case 1
      4. Graceful messaging if user expects FSA
    status: "NEEDS_TRACE"
    blockers:
      - "Mobile detection not verified"
      - "FSA fallback messaging"
    
  case_4_ai_integration:
    name: "Case 4: AI Integration - All Cases"
    description: "When user initiates AI-centric features"
    entry_points:
      - "Slash command in BlockNote"
      - "AI toolbar trigger"
      - "Agentic coding request"
    expected_behavior: |
      1. Project persisted and hotload reactive
      2. App functions as Notion-like block-style tool
      3. On AI trigger → Verify Key Vault settings
      4. If keys missing → Direct to Key Vault settings
      5. MUST NOT block, throw errors, or loop infinitely
    status: "NEEDS_TRACE"
    blockers:
      - "AI trigger → vault check not wired"
      - "Fallback UX for missing keys"
      - "Settings navigation from error state"

# ============================================================================
# USER JOURNEY SPECIFICATIONS - IDE WORKSPACE
# ============================================================================

ide_workspace_journeys:
  case_ide_new_project:
    name: "IDE: New FSA Project"
    description: "User mounts folder from hub and opens in IDE"
    entry_points:
      - "/hub → Mount Folder"
    expected_behavior: |
      1. Directory picker opens
      2. Project created with FSA handle
      3. Navigate to /ide/$projectId
      4. File tree loads from FSA
      5. Editor functional
    status: "NEEDS_TRACE"
    
  case_ide_existing_project:
    name: "IDE: Existing Project"
    description: "User opens existing project in IDE"
    entry_points:
      - "/hub → Recent Projects → IDE"
      - "/ide/$projectId (direct)"
    expected_behavior: |
      1. Project loaded from store
      2. If FSA → Reconnect handle (may prompt)
      3. File tree renders
      4. Last open file restored
    status: "NEEDS_TRACE"
    
  case_ide_cross_workspace:
    name: "IDE: Cross-Workspace Switch"
    description: "User switches from IDE to Notes/Knowledge"
    entry_points:
      - "Workspace switcher in IDE header"
    expected_behavior: |
      1. Same project context maintained
      2. Navigate to /notes/$projectId
      3. Project binding must include target workspace
      4. If not bound → Prompt to enable
    status: "NEEDS_TRACE"

# ============================================================================
# BYOK VAULT JOURNEY
# ============================================================================

byok_journeys:
  case_set_key:
    name: "BYOK: Set API Key"
    description: "User configures API key in settings"
    entry_points:
      - "/settings → Providers"
    expected_behavior: |
      1. User enters API key
      2. Key encrypted and stored in vault
      3. hasApiKey flag synced
      4. Key available in all workspaces
    status: "DONE"
    notes: "provider-credentials-slice.ts created + Test Connection endpoint (B-3)"
    
  case_use_key:
    name: "BYOK: Use API Key"
    description: "AI feature attempts to use stored key"
    entry_points:
      - "ChatPanel (/api/chat)"
      - "Notes AI (note-ai-service)"
      - "Voice Recording (Gemini)"
    expected_behavior: |
      1. Check vault for provider key
      2. If exists → Use for API call
      3. If missing → Fallback guidance
      4. If invalid → Clear error + guide to settings
    status: "done"
    notes: "B-1: ChatPanel wired, N-3: Notes AI verified wired"

  case_workspace_sync:
    name: "BYOK: Cross-Workspace Access"
    description: "Key set in settings used in Notes workspace"
    entry_points:
      - "Notes AI feature after setting key"
    expected_behavior: |
      1. Key stored once in vault
      2. Accessible from any workspace
      3. No re-entry required
    status: "verified"
    notes: "N-3: All Notes AI features use credentialVault.getCredentials()"


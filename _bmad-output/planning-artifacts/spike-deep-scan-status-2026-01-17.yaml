## Key Insights

1. **Spike = Main Codebase Mirror**
   - All flaws replicate from main app
   - `@spike-copy-source` comments prove mirror pattern
   - Fixing spike reveals what to fix in main

2. **Systemic Issues Identified**
   - Missing domain interfaces (presentation ↔ infrastructure)
   - God stores >300 lines (3 found)
   - Direct Dexie access in presentation layer (3 files)
   - Duplicate store directories (10 duplicate files)

3. **Architecture Erosion**
   - `src/lib/` acts as shadow infrastructure
   - No clear layer boundaries
   - State duplication between stores


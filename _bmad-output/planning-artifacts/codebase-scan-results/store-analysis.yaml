    implementation: "Each slice handles single responsibility (CRUD, UI state, validation, etc.)"
    compliance: "70% of stores follow slice pattern (god stores are exceptions)"

  persist_middleware:
    description: "Zustand persist with Dexie IndexedDB storage"
    implementation: "Applied to combined stores, not individual slices"

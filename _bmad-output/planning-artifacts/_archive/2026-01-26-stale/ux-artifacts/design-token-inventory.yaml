## Token Usage Patterns

### Colors
- **Primary:** Call-to-action buttons, links, active states
- **Background:** Main page background, dark mode
- **Card:** Panel backgrounds, modals, dropdowns
- **Muted:** Disabled states, placeholders
- **Destructive:** Error messages, delete actions
- **Success:** Success toasts, completion states
- **Warning:** Warning alerts, caution messages
- **Info:** Info toasts, help text

### Typography
- **Font Sans:** Body text, UI elements
- **Font Mono:** Code blocks, terminal, file paths
- **Font Pixel:** 8-bit headings, retro elements
- **Text Base:** Standard body text (16px desktop, 14px mobile)
- **Text Sm:** Captions, labels (14px)
- **Text Lg:** Subheadings (18px)
- **Text Xl:** Headings (20px)
- **Text 2xl:** Section titles (24px)
- **Text 3xl:** Page titles (30px)
- **Text 4xl:** Hero text (36px)

### Spacing
- **Spacing 2-4:** Compact layouts (cards, buttons)
- **Spacing 4-6:** Standard spacing (sections, padding)
- **Spacing 8-12:** Large spacing (page margins)
- **Spacing 16+:** Extra large spacing (hero sections)

### Borders
- **Radius:** Squared corners (default, 8-bit aesthetic)
- **Radius Sm:** Subtle rounding (2px, minimal)
- **Radius Md:** Small rounding (4px, cards)
- **Radius Lg:** Medium rounding (6px, buttons)

### Shadows
- **Shadow Pixel:** Standard depth (buttons, cards)
- **Shadow Pixel Sm:** Subtle depth (small elements)
- **Shadow Pixel Primary:** Brand depth (primary actions)
- **Shadow Pixel Inset:** Inset depth (inputs, pressed states)

---

## Token Compliance Rules

### DO
✅ Use CSS custom properties for ALL values
✅ Reference tokens via `var(--token-name)`
✅ Follow 8-bit aesthetic (squared corners, pixel shadows)
✅ Use solid backgrounds (NO glassmorphism)
✅ Maintain color contrast (4.5:1 minimum)

### DON'T
❌ Hardcode values (e.g., `color: #f97316`)
❌ Use backdrop-blur or backdrop-filter
❌ Use soft/blur shadows
❌ Introduce new tokens without review
❌ Override tokens in component styles


workspace_integration:
  agent_workspace_bindings:
    definition: "Agents have workspace-specific availability and tool permissions"
    implementation:
      - "WorkspaceBinding[] on Agent entity"
      - "isAvailable flag per workspace type"
      - "uiVariant per workspace (full/compact/minimal)"
      - "isDefault flag for default agents"

    workspaces_supported:
      - ide (Agent available in IDE)
      - knowledge (Agent available in Knowledge)
      - study (Agent available in Study)
      - notes (Agent available in Notes)

  tool_workspace_permissions:
    definition: "Tools have workspace-scoped permissions"
    implementation:
      - "workspacePermissions object on AgentToolBinding"
      - "Boolean flags per workspace (ide, knowledge, study, notes)"
      - "isChecked by workspace permission manager"

  domain_services:
    location: src/domain/services/agent-workspace-utils.ts
    purpose: "Pure functions for agent workspace operations"
    functions:
      - isAgentAvailableIn (Check if agent available in workspace)
      - isAgentDefaultFor (Check if agent is default)
      - getAgentsForWorkspace (Filter agents by workspace)
      - getDefaultAgentForWorkspace (Find default agent)

    benefits:
      - "No circular dependencies (pure functions)"
      - "Easier to test (no store mocking)"
      - "Reusable across contexts"

store_integration:
  agent_store:
    location: src/infrastructure/persistence/stores/agents/
    pattern: "Slice-based Zustand store"
    slices:
      - agent-crud-slice.ts (CRUD operations)
      - agent-selection-actions.ts (Selection actions)
      - agent-selection-events.ts (Event emission)
      - agent-selection-queries.ts (Query utilities)
      - agent-selection-state.ts (Selection state)
      - agent-selection-utils.ts (Utility functions)
      - agent-validation-slice.ts (Validation logic)
      - agent-workspace-bindings-slice.ts (Workspace bindings)

    methods:
      - "getAgentsForWorkspace(workspaceType)"
      - "updateWorkspaceBinding(agentId, workspaceType, binding)"
      - "isAgentAvailableInWorkspace(agentId, workspaceType)"

  provider_store:
    location: src/infrastructure/persistence/stores/providers/
    pattern: "Slice-based Zustand store with encryption"
    slices:
      - provider-crud-slice.ts (Provider CRUD)
      - provider-credentials-slice.ts (Encrypted API keys)
      - provider-models-slice.ts (Model registry)
      - provider-utils-slice.ts (Provider utilities)

    methods:
      - "addProvider(providerConfig)"
      - "removeProvider(providerId)"
      - "setCredential(providerId, apiKey)"
      - "getCredential(providerId)"
      - "fetchModels(providerId)"

  permission_store:
    location: src/infrastructure/persistence/stores/permissions/
    pattern: "Zustand store with Dexie persistence"
    store: tool-permission-store.ts

    methods:
      - "setTrustLevel(toolId, level)"
      - "getTrustLevel(toolId)"
      - "checkPermission(toolId)"

    persistence:
      - "Trust levels persist across browser sessions"
      - "Session trust cleared on reload"
      - "IndexedDB storage"


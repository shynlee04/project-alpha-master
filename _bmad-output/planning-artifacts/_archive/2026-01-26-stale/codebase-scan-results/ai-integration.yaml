agent_execution_flow:
  1. User selects agent (UnifiedAgentSelector)
  2. Agent config loaded (agent-selection-store)
  3. Provider adapter created (factory.ts)
  4. API key retrieved (credential-vault)
  5. Tools registered (tool registry)
  6. Permission checks (workspace + trust level)
  7. User sends message (ChatPanel)
  8. Agent processes message (use-agent-chat-with-tools)
  9. Tools executed if needed (tool facades)
  10. User approves tools (ApprovalOverlay)
  11. Tool results returned to agent
  12. Agent generates response
  13. Response streamed to UI (StreamdownRenderer)


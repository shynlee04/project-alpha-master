# BMAD Skills Taxonomy Manifest
# Version: 3.1.0
# Updated: 2026-01-11 - Added Product Reality Gates
# Purpose: Hierarchical skill organization for agent/sub-agent traversal
#
# This manifest defines the skill hierarchy that agents can traverse to find
# relevant skills based on context, task type, and agent capabilities.
#
# Hierarchy Rules:
# - category: Top-level grouping (global, backend, frontend, testing, bmad, architecture, product-reality)
# - parent: Parent skill name (child skills reference their parent)
# - children: Array of child skill names (parent skills list their children)
# - priority: 0-100 (higher = more specific/specialized, lower = more general)
# - agents: Array of compatible agent types that can use this skill
# - triggers: Keywords that trigger skill activation

taxonomy:
  # =============================================================================
  # PRODUCT REALITY GATES (Priority 5-9 - Highest Priority - v3.1.0)
  # =============================================================================
  # NEW: Product Reality validation - catches issues that TDD/linting miss
  # =============================================================================


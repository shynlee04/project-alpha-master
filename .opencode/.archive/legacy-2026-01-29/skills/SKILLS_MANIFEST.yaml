# =============================================================================
# CATEGORY INDEX (For quick traversal)
# =============================================================================
categories:
  global: [global-coding-style, global-commenting, global-conventions, global-error-handling, global-validation, global-tech-stack]
  backend: [backend-api, backend-migrations, backend-models, backend-queries]
  frontend: [frontend-components, frontend-css, frontend-accessibility, frontend-responsive]
  testing: [testing-test-writing]
  bmad: [bmad-orchestrator, asgl]
  architecture: [architecture-remediation, store-refactorer, component-splitter, typescript-fixer, test-writer, workspace-architect, file-sync-specialist]
  workflow: [eliminate-god-stores, normalize-components, workspace-file-system-e2e, notes-sync-strategy, knowledge-sync-strategy]

# =============================================================================
# AGENT COMPATIBILITY MATRIX (Which agents can use which skills)
# =============================================================================
agent_compatibility:
  all: [global-*]
  bmad-master: [bmad-orchestrator, asgl, architecture-remediation]
  bmad-dev: [backend-*, frontend-*, testing-*]
  bmad-architect: [backend-*]
  bmad-tea: [testing-*]
  ux-designer: [frontend-*]
  store-refactorer: [store-refactorer, eliminate-god-stores]
  component-splitter: [component-splitter, normalize-components]
  typescript-fixer: [typescript-fixer]
  test-writer: [test-writer]
  workspace-architect: [workspace-architect, workspace-file-system-e2e]
  file-sync-specialist: [file-sync-specialist, notes-sync-strategy, knowledge-sync-strategy]
  arc-coordinator: [architecture-remediation, eliminate-god-stores, normalize-components, workspace-file-system-e2e, notes-sync-strategy, knowledge-sync-strategy]

# =============================================================================
# SKILL TRAVERSAL ALGORITHM
# =============================================================================
#
# When an agent needs to find relevant skills:
#
# 1. Start with category matching (based on task type)
# 2. Filter by agent compatibility (agent_compatibility matrix)
# 3. Sort by priority (higher = more specific)
# 4. Traverse children if parent skill selected
# 5. Load SKILL.md frontmatter first (for efficiency)
# 6. Load full SKILL.md content when activated
#
# Example traversal for "split god store" task:
# - Category: architecture
# - Agent: store-refactorer
# - Match: architecture-remediation (parent) → store-refactorer (child)
# - Result: Load store-refactorer/SKILL.md
#

    name: Product Reality Gates
    category: product-reality
    priority: 5
    parent: null
    children:
      - ux-gate
      - brain-gate
      - visual-gate
    agents: [story-cycle, sprint-planning-wrapper, bmad-dev]
    description: Product Reality validation - UX, Agent tools, Visual checks
    path: null

  - id: ux-gate

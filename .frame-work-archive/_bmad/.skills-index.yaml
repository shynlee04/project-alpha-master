# AGENT LOADER REFERENCE
# ═══════════════════════════════════════════════════════════════════════════

# To load any skill dynamically:
load_skill: |
  function loadSkill(skillName) {
    const index = readYaml('_bmad/.skills-index.yaml');
    const skill = index.skills[skillName];

    return {
      name: skillName,
      module: skill.module,
      workflowPath: `_bmad/modules/${skill.module}/${skill.workflow}`,
      agentPath: `_bmad/modules/${skill.module}/agents/${skill.agent}.md`,
      base_path: skill.base_path,
      triggers: skill.triggers,
      // Load only when invoked
    };
  }


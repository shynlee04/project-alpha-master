# ============================================================================
# SECURITY PROTOCOLS
# ============================================================================

security:
  key_validation:
    - "Validate key format before API calls"
    - "Check key is not empty or placeholder"
    - "Verify key length meets requirements"

  logging_protection:
    - "NEVER log full key in output"
    - "Log only: '***{last_4_chars}***'"
    - "Sanitize all logs and reports"

  artifact_protection:
    - "NEVER include keys in handoff artifacts"
    - "Reference via: 'configured in api-keys-prod.yaml'"
    - "Block artifact creation if keys detected in content"

  access_control:
    - "Only real-world-validator agent can access"
    - "Requires explicit approval for use"
    - "Track all API key usage in AGENT-STATE.yaml"

# ============================================================================
# QUOTA MANAGEMENT
# ============================================================================

quota_management:
  daily_reset:
    schedule: "0 0 * * *"  # Midnight daily
    actions:
      - "Reset current_usage to 0"
      - "Update last_reset timestamp"
      - "Generate daily usage report"
      - "Alert if budget exceeded previous day"

  budget_alerts:
    warning_at: 80  # Percentage
    critical_at: 95  # Percentage
    exhausted_at: 100  # Percentage

    on_warning:
      action: "LOG warning, continue testing"
      notification: "Include in daily report"

    on_critical:
      action: "PAUSE new tests, complete current"
      notification: "IMMEDIATE alert to human"

    on_exhausted:
      action: "SUSPEND all testing, BLOCK new requests"
      notification: "CRITICAL alert, budget exhausted"
      recovery: "Wait for manual reset or budget increase"

  usage_tracking:
    tracked_metrics:
      - "total_requests_today: count"
      - "successful_requests: count"
      - "failed_requests: count"
      - "average_response_time_ms: milliseconds"
      - "total_cost_today: USD"
      - "cost_per_request: USD"

    output: "_bmad-output/usage-reports/api-usage-{date}.md"

# ============================================================================
# TESTING PROTOCOLS
# ============================================================================

testing_protocols:
  pre_test_validation:
    - "Check key status is ACTIVE"
    - "Verify budget not exhausted"
    - "Confirm quota available"
    - "Validate key format"

  during_test:
    - "Track each API call"
    - "Monitor response times"
    - "Log errors without exposing keys"
    - "Increment usage counters"

  post_test:
    - "Update usage statistics"
    - "Check budget thresholds"
    - "Generate test summary"
    - "Alert if approaching limits"

# ============================================================================
# FAILURE HANDLING
# ============================================================================

failure_handling:
  key_invalid:
    action: "BLOCK all testing, ALERT human immediately"
    recovery: "Wait for new valid key"

  quota_exceeded:
    action: "SUSPEND testing until reset"
    recovery: "Wait for daily reset or budget increase"

  rate_limit_hit:
    action: "THROTTLE requests, implement exponential backoff"
    recovery: "Wait for rate limit window to clear"

  budget_exhausted:
    action: "SUSPEND all testing, CRITICAL alert"
    recovery: "Wait for manual budget increase"

# ============================================================================
# COST OPTIMIZATION
# ============================================================================

cost_optimization:
  strategies:
    - "Cache responses when appropriate"
    - "Batch requests when possible"
    - "Use cheaper models for testing"
    - "Implement request deduplication"
    - "Optimize prompt sizes to reduce token usage"

  cost_alerts:
    daily_budget_warning: 8.0  # USD
    daily_budget_critical: 9.5  # USD
    daily_budget_exhausted: 10.0  # USD

# ============================================================================
# VERSION CONTROL
# ============================================================================

version:

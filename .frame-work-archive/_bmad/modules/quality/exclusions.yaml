# Deep Scan Exclusions Configuration
# Paths and patterns to ignore during scans

exclusions:
  # Global exclusions
  global:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - ".git/**"
    - "**/*.min.js"
    - "**/*.map"

  # Domain-specific exclusions
  types:
    - "src/__tests__/**" # Tests often have loose typing by design
    - "**/*.test.ts"
    - "**/*.spec.ts"

  architecture:
    - "src/lib/legacy/**" # Known legacy code, don't flag every time
    - "src/generated/**"

  state:
    - "src/lib/state/legacy-facades/**" # Allowed legacy facades

  ux:
    - "src/stories/**" # Storybook files

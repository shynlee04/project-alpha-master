# ASGL Governance Configuration
# Rules for maintaining documentation integrity and preventing fragmentation

version: "1.0.0"
last_updated: "2026-01-05T15:30:00+07:00"

# ═══════════════════════════════════════════════════════════════════════════
# ROOT GOVERNANCE DOCUMENTS
# ═══════════════════════════════════════════════════════════════════════════

root_documents:
  # ═══════════════════════════════════════════════════════════════════════════
  # SINGLE SOURCE OF TRUTH: AGENTS.md
  # All platforms point to AGENTS.md for governance
  # ═══════════════════════════════════════════════════════════════════════════
  
  authoritative:
    path: "AGENTS.md"
    purpose: "SINGLE SOURCE OF TRUTH for all agent/architecture/governance"
    max_size_lines: 4000
    update_frequency: "Every 3 stories"
    update_trigger: "architectural_change"
    all_platforms_point_here: true
    
  claude_md:
    path: "CLAUDE.md"
    purpose: "Claude-specific pointer to AGENTS.md"
    role: "POINTER_ONLY"
    max_size_lines: 200
    contents:
      - "1. Reference link to AGENTS.md sections"
      - "2. Claude-specific command syntax"
      - "3. NO duplicate content from AGENTS.md"
      
  platform_unification:
    all_point_to: "AGENTS.md"
    platforms:
      - name: "Claude Code"
        config_dir: ".claude/"
        pointer_file: "CLAUDE.md → AGENTS.md"
      - name: "OpenCode"
        config_dir: ".opencode/"
        pointer_file: "opencode.json → references AGENTS.md"
      - name: "Gemini"
        config_dir: ".gemini/"
        pointer_file: "context.md → references AGENTS.md"
      - name: "BMAD"
        config_dir: "_bmad/"
        pointer_file: "Uses AGENTS.md directly"
      
  secondary:
    - path: "bmm-workflow-status.yaml"
      purpose: "Overall workflow state"
      update_frequency: "Every story"
      
    - path: "_bmad-output/sprint-artifacts/sprint-status.yaml"
      purpose: "Sprint-level tracking"
      update_frequency: "Every story"

# ═══════════════════════════════════════════════════════════════════════════
# CHILD AGENTS.MD STRATEGY
# ═══════════════════════════════════════════════════════════════════════════

child_agents_md:
  creation_triggers:
    - condition: "layer_file_count > 20"
      action: "prompt_create_child_agents_md"
      
    - condition: "layer_has_distinct_patterns"
      action: "prompt_create_child_agents_md"
      
    - condition: "manual_request"
      action: "create_child_agents_md"
      
  target_locations:
    - path: "src/infrastructure/"
      purpose: "Infrastructure layer patterns (persistence, events, sync)"
      
    - path: "src/presentation/"
      purpose: "Component/UI patterns"
      
    - path: "src/lib/"
      purpose: "Library-specific patterns (agent, rag, knowledge)"
      
    - path: "src/domain/"
      purpose: "Domain-specific patterns"
      
    - path: "_bmad-output/"
      purpose: "Artifact organization patterns"
      
  template: |
    # {Directory} Layer Patterns
    
    > **Parent**: See `/AGENTS.md` for project-wide patterns.
    > **Scope**: This file covers patterns specific to `{path}`.
    > **Last Updated**: {date}
    > **Session**: {session_id}
    
    ## Layer Purpose
    
    {purpose_description}
    
    ## Key Directories
    
    | Directory | Purpose |
    |-----------|---------|
    {directory_table}
    
    ## File Conventions
    
    | Pattern | Max Lines | Example |
    |---------|-----------|---------|
    {file_conventions}
    
    ## Import Rules
    
    {import_rules}
    
    ## Dependencies
    
    This layer depends on:
    {dependencies}
    
    ## Dependents
    
    The following depend on this layer:
    {dependents}
    
    ---
    **Generated by**: ASGL Governance
    **Parent Doc**: /AGENTS.md

# ═══════════════════════════════════════════════════════════════════════════
# UPDATE TRIGGERS
# ═══════════════════════════════════════════════════════════════════════════

update_triggers:
  agents_md:
    - trigger: "story_complete"
      condition: "stories_completed % 3 == 0"
      action: "update_agents_md"
      sections:
        - "Epic progress tables"
        - "Canonical locations"
        - "Active workflows"
        
    - trigger: "adr_created"
      condition: "always"
      action: "update_agents_md"
      sections:
        - "ADR reference table"
        - "Architecture decisions"
        
    - trigger: "epic_complete"
      condition: "always"
      action: "update_agents_md"
      sections:
        - "Epic status (mark DONE)"
        - "Health scores"
        
  claude_md:
    - trigger: "story_complete"
      condition: "stories_completed % 5 == 0"
      action: "update_claude_md"
      sections:
        - "Key directories"
        - "Development commands"
        - "Architecture patterns"
        
    - trigger: "major_refactor"
      condition: "files_changed > 20"
      action: "update_claude_md"
      sections:
        - "File structure"
        - "Import patterns"
        
  child_agents_md:
    - trigger: "layer_change"
      condition: "files_changed_in_layer > 5"
      action: "update_or_create_child_agents_md"

# ═══════════════════════════════════════════════════════════════════════════
# ARTIFACT LIFECYCLE
# ═══════════════════════════════════════════════════════════════════════════

artifact_lifecycle:
  states:
    DRAFT:
      description: "Being created"
      duration_max_hours: 24
      auto_transition_on_timeout: "SUSPECT"
      
    ACTIVE:
      description: "In use, referenced"
      requires:
        - "session_id present"
        - "at least one reference"
        
    SUSPECT:
      description: "Missing session or references"
      review_required: true
      auto_transition_hours: 24
      next_state: "REVIEW"
      
    REVIEW:
      description: "Needs human decision"
      options:
        - "Promote to ACTIVE (add refs)"
        - "Archive (no longer needed)"
        - "Delete (erroneous)"
        
    STALE:
      description: "Not updated in 7 days"
      mark_after_days: 7
      action: "prompt_for_review"
      
    ARCHIVED:
      description: "Phase complete, preserved"
      location_pattern: "_bmad-output/archive/{yyyy}/{mm}/"
      retention_days: 365
      
    DELETED:
      description: "Soft deleted"
      retention_days: 30
      permanent_delete_after: 30
      
  cross_reference:
    required: true
    bidirectional: true
    validation_frequency: "per_story"
    on_broken_ref: "mark_SUSPECT"

# ═══════════════════════════════════════════════════════════════════════════
# NAMING CONVENTIONS
# ═══════════════════════════════════════════════════════════════════════════

naming_conventions:
  artifacts:
    sprint_plan:
      pattern: "{type}-{yyyy-mm-dd}.yaml"
      example: "sprint-status-2026-01-05.yaml"
      
    health_assessment:
      pattern: "{type}-{yyyy-mm-dd}.md"
      example: "project-health-assessment-2026-01-05.md"
      
    epic_doc:
      pattern: "epic-{id}-{slug}.md"
      example: "epic-53-state-consolidation.md"
      
    story_doc:
      pattern: "story-{epic}-{story}.md"
      example: "story-53-2-dexie-helpers.md"
      
    adr:
      pattern: "adr-{number}-{slug}-{date}.md"
      example: "adr-024-state-consolidation-2026-01-04.md"
      
    research:
      pattern: "{topic}-research-{date}.md"
      example: "zustand-patterns-research-2026-01-05.md"
      
    handoff:
      pattern: "handoff-{from}-{to}-{story}.md"
      example: "handoff-analyst-dev-CC01.md"
      
  code_files:
    component:
      pattern: "{PascalCase}.tsx"
      max_lines: 300
      
    hook:
      pattern: "use{PascalCase}.ts"
      max_lines: 150
      
    store_slice:
      pattern: "{domain}-{concern}-slice.ts"
      max_lines: 120
      
    helper:
      pattern: "{kebab-case}-helpers.ts"
      max_lines: 120

# ═══════════════════════════════════════════════════════════════════════════
# ANTI-FRAGMENTATION RULES
# ═══════════════════════════════════════════════════════════════════════════

anti_fragmentation:
  single_source_of_truth:
    - domain: "Zustand stores"
      canonical: "src/infrastructure/persistence/stores/"
      deprecated:
        - "src/lib/state/"
        - "src/stores/"
      migration: "Create facade, update imports over time"
      
    - domain: "Dexie database"
      canonical: "src/infrastructure/persistence/dexie-db.ts"
      deprecated:
        - "src/lib/state/dexie-db.ts"
        
    - domain: "Event bus"
      canonical: "src/infrastructure/events/"
      deprecated:
        - "src/lib/events/"
        
  facade_protocol:
    when: "Moving canonical location"
    steps:
      - "Create new file at canonical location"
      - "Create facade at old location with re-exports"
      - "Add @deprecated JSDoc to facade"
      - "Add console.warn in dev mode"
      - "Update AGENTS.md with migration status"
      - "Track consumers in pending-wires.yaml"
      
  orphan_prevention:
    - "Every artifact has session_id"
    - "Every artifact has at least one reference"
    - "Orphan check runs on story completion"
    - "Orphans marked SUSPECT within 24h"

# ═══════════════════════════════════════════════════════════════════════════
# WIRE TRACKING (NO FORGOTTEN MIGRATIONS)
# ═══════════════════════════════════════════════════════════════════════════

wire_tracking:
  registry_file: "_bmad/modules/asgl/scratchpad/pending-wires.yaml"
  
  wire_types:
    IMPORT_UPDATE:
      description: "Import path needs updating"
      blocking: true
      
    FACADE_CREATION:
      description: "Backwards-compat facade needed"
      blocking: true
      
    CONSUMER_UPDATE:
      description: "Consumer needs to switch to new API"
      blocking: true
      
    TYPE_MIGRATION:
      description: "Type definitions moved"
      blocking: true
      
    DEPRECATION_WARNING:
      description: "Add @deprecated JSDoc"
      blocking: false
      
  validation:
    on_story_complete:
      - cmd: "grep -r 'from.*@/lib/state' src --include='*.ts' --include='*.tsx' | wc -l"
        expected: 0
        message: "Legacy import paths detected"
        
      - cmd: "pnpm exec tsc --noEmit 2>&1 | grep 'Cannot find module' | wc -l"
        expected: 0
        message: "Broken module references"
        
  blocking_completion:
    if: "pending_wires > 0"
    then: "Block story completion until resolved"

# ═══════════════════════════════════════════════════════════════════════════
# DESIGN & UX GOVERNANCE
# ═══════════════════════════════════════════════════════════════════════════

design_governance:
  reference: "_bmad-output/design-system-8bit-2025-12-25.md"
  ux_reference: "_bmad-output/ux-specification.md"
  
  mandatory_checks:
    - id: "no_glassmorphism"
      pattern: "backdrop-blur|bg-opacity-[0-4]|blur-(?!none)"
      search_path: "src/**/*.{tsx,css}"
      blocking: true
      message: "Glassmorphism detected - violates 8-bit design"
      
    - id: "no_soft_shadows"
      pattern: "shadow-(?!none|sm|md|lg|xl|2xl|inner|card)"
      search_path: "src/**/*.{tsx,css}"
      blocking: true
      message: "Non-standard shadow - use 8-bit hard shadows"
      
    - id: "css_variables"
      pattern: "#[0-9a-fA-F]{6}(?!.*var)|rgb\\([^v]|hsl\\([^v]"
      search_path: "src/**/*.{tsx,css}"
      blocking: true
      message: "Hardcoded color - use CSS variables"
      
    - id: "touch_targets"
      rule: "Interactive elements >= 44x44px"
      method: "CSS analysis"
      blocking: true
      
    - id: "i18n_strings"
      pattern: ">[A-Z][a-z]+.*<|placeholder=\"[A-Z]|label=\"[A-Z]"
      search_path: "src/**/*.tsx"
      exclude: "*.test.tsx"
      blocking: true
      message: "Hardcoded string - use t() function"

# ═══════════════════════════════════════════════════════════════════════════
# ARCHIVAL PROTOCOL
# ═══════════════════════════════════════════════════════════════════════════

archival:
  triggers:
    - event: "phase_complete"
      action: "archive_phase_artifacts"
      
    - event: "epic_complete"
      action: "archive_epic_artifacts"
      
    - event: "manual"
      action: "archive_specified"
      
  archive_structure:
    pattern: "_bmad-output/archive/{yyyy}/{mm}/{artifact-type}/"
    
  retention:
    archived: "365 days"
    deleted: "30 days soft delete, then permanent"
    
  cleanup:
    frequency: "monthly"
    actions:
      - "Move ARCHIVED older than retention to deep archive"
      - "Permanently delete soft-deleted after retention"
      - "Generate cleanup report"

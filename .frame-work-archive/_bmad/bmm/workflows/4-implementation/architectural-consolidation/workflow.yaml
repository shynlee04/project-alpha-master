# Architectural Consolidation Workflow (ARC) v2.0

**Goal:** To execute the "5-Layer VIA-GENT Architecture" consolidation, strictly adhering to the immutable contracts defined for Providers, Agents, Conversation, and State management.

**Your Role:** You are the **ARC Orchestrator**. You rigidly enforce the architectural boundaries defined in the Sprint Change Proposal. You do not allow shortcuts. You prioritize data integrity, clean contracts, and reactive state flows over feature speed.

## WORKFLOW ARCHITECTURE

### Core Principles

- **Micro-file Constraints**: Adhere to the < 300 lines per file rule.
- **Contract First**: No implementation without a defined interface/type contract.
- **State Sovereignty**: Store holds state; UI reflects state. Never local state for shared data.
- **Layered Strictness**: Layer 1 (Persistence) -> Layer 2 (Provider) -> Layer 3 (Agent) -> Layer 4 (Services) -> Layer 5 (UI). Dependency flows UP only.

### 5-Layer Stack Definition

1. **Layer 1: Persistence & Infrastructure** (Dexie, CredentialVault, EventBus)
2. **Layer 2: LLM Provider Configuration** (Hardcoded vs Custom, Model Loading)
3. **Layer 3: Agent Configuration Vault** (Provider+Model+Tools, CRUD, Workspace Bindings)
4. **Layer 4: Cross-Workspace Services** (Conversation, Thread, Context Managers)
5. **Layer 5: UI/UX Presentation** (AgentSelector, ChatPanel, Workspace Layouts)


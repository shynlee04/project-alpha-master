## WORKFLOW STEPS

### Phase 0: Showcase Critical (AC-01, AC-02, AC-03)
1. **init**: Context loading and validation of contracts.
2. **provider-foundation**: (AC-01) Implementing `ProviderConfigDialog` and `provider-models-store`.
3. **agent-vault**: (AC-02) Implementing `AgentSelector` with `useAgentsStore`.
4. **chat-unification**: (AC-03) Unifying `ChatPanel` across all 4 workspaces.

### Phase 1: Foundation (AC-04, AC-05, AC-06)
5. **store-reorg**: (AC-04) Migrating to `src/stores/{core,agent,conversation,workspace,sync}/`.
6. **data-flow**: (AC-05 & AC-06) Implementing Event Bus and Tool Binding system.

### Phase 2: Full Scope & Cleanup (AC-07, AC-08, AC-09)
7. **brownfield**: (AC-07) Connecting Project/FileTree to Knowledge.
8. **hygiene**: (AC-08) Breaking down files > 300 lines.
9. **finalize**: (AC-09) Test coverage and final validation.


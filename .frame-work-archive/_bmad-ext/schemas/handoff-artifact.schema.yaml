# Storage Conventions

```yaml
handoff_directory: "_bmad-output/handoffs/"
sub_directory_pattern: "{date}/{story_id}/"
filename_pattern: "{story_id}-{source_agent}-handoff.md"

# Examples
- "_bmad-output/handoffs/2026-01-10/FS-05/FS-05-dev-handoff.md"
- "_bmad-output/handoffs/2026-01-10/FS-05/FS-05-tea-sub-handoff.md"
- "_bmad-output/handoffs/2026-01-10/FS-05/FS-05-dev-failure.md"
```

---

# UUID Format

```regex
^hnd_[0-9]{8}_[0-9]{6}_[a-z0-9]{6}$     # handoff
^sub_[0-9]{8}_[0-9]{6}_[a-z0-9]{6}$     # sub-handoff
^fail_[0-9]{8}_[0-9]{6}_[a-z0-9]{6}$    # failure
```


## Sub-Agents
- tea-ext (testing, parent: dev-ext)
- pm (product management, parent: product-management-ext)
- sm (scrum master, parent: product-management-ext)
- store-refactorer (store splitting, parent: remediation-ext)
- component-splitter (component splitting, parent: remediation-ext)

## 2. Sub-Handoff

Used when main agent delegates to sub-agent.

```yaml
---
artifact_id: "sub_20260110_123456_def456"
artifact_type: "sub-handoff"
parent_id: "hnd_20260110_120000_xyz789"
parent_agent: "dev-ext"
story_id: "FS-05"
source_agent: "dev-ext"
target_agent: "tea-ext"
created_at: "2026-01-10T12:34:56Z"
status: "PENDING"
---

## Sub-Agent Task

Create comprehensive test suite for file-lock-service.ts

## Context from Parent

FileLockService implementation is complete. Service handles:
- Lock acquisition with timeout
- Lock release
- Lock state checking
- Concurrent lock attempts

Files to test:
- `src/domain/services/file-lock-service.ts`

## Return Criteria

- [ ] Test coverage > 80%
- [ ] All edge cases covered (timeout, concurrent, deadlock)
- [ ] Tests passing (0 failures)
- [ ] Mock file system dependencies

## Report Back To

dev-ext with completion status and test results
```

---

## 3. Failure Handoff

Used when agent encounters unrecoverable error.

```yaml
---
artifact_id: "fail_20260110_123456_ghi789"
artifact_type: "failure"
parent_id: "hnd_20260110_120000_xyz789"
story_id: "FS-05"
source_agent: "dev-ext"
target_agent: "master-orchestrator"
created_at: "2026-01-10T12:34:56Z"
status: "FAILED"
---

## Error Summary

**Error Type:** validation
**Severity:** high
**Recovery Attempts:** 3

## Error Message

```
TypeScript error in file-lock-service.ts:42:21
TS2345: Argument of type 'string | undefined' is not assignable
to parameter of type 'string'.
```

## Context

### Stack Trace
```
at file-lock-service.ts:42:21
at FileLockService.acquireLock()
at test/unit/services/file-lock.test.ts:15:18
```

### Files Involved
- `src/domain/services/file-lock-service.ts`
- `test/unit/services/file-lock.test.ts`

## Recovery Recommendation

retry_with_different_approach

## Suggested Action

TypeScript type error in FileLockService.acquireLock() method.
The lockId parameter may be undefined. Consider:
1. Add type guard: if (!lockId) throw new Error(...)
2. Make lockId required in LockOptions interface
3. Add default value for lockId parameter

Recovery attempted 3 times with different approaches.
Recommending human review or architect-ext consultation.
```


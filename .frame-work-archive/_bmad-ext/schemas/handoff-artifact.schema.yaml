# _bmad-ext/schemas/handoff-artifact.schema.yaml
# Required fields for all handoff artifacts
# Version: 1.0.0
# Updated: 2026-01-10

---
schema_version: "1.0.0"
schema_type: "handoff-artifact"
last_updated: "2026-01-10"
description: "Schema for agent-to-agent handoff artifacts in BMAD system"
---

# Artifact Types

| Type | Description | Flow |
|------|-------------|------|
| **handoff** | Main agent → Main agent (via orchestrator) | orchestrator → main → orchestrator |
| **sub-handoff** | Main agent → Sub-agent | main → sub → main |
| **failure** | Error escalation | any agent → orchestrator |
| **completion** | Work completed notification | main → orchestrator |

---

# Required Frontmatter (All Types)

```yaml
---
artifact_id: "{uuid}"           # Unique identifier
artifact_type: "handoff"         # Type: handoff, sub-handoff, failure, completion
parent_id: "{uuid or null}"     # Parent handoff ID (if continuation)
story_id: "{story_id}"           # Associated story
source_agent: "{agent_name}"     # Who created this
target_agent: "{agent_name}"     # Who should consume this
created_at: "{iso-8601}"         # Timestamp
status: "PENDING"                # PENDING | IN_PROGRESS | COMPLETED | FAILED
---
```

---

# Type-Specific Fields

## 1. Standard Handoff

Used when main agents communicate via orchestrator.

```yaml
---
artifact_id: "hnd_20260110_123456_abc123"
artifact_type: "handoff"
parent_id: null
story_id: "FS-05"
source_agent: "dev-ext"
target_agent: "master-orchestrator"
created_at: "2026-01-10T12:34:56Z"
status: "PENDING"
---

## Context Summary

Completed 3 tasks for FS-05: FileLockService implementation.
Service now handles lock acquisition, release, and timeout.
Files created: file-lock-service.ts, file-lock.test.ts
Next: Integrate with FileSyncService.

## Handoff Data

### Story File
`_bmad-output/stories/FS-05-context.xml`

### Validation Results
- TypeScript Errors: 0
- Tests Passed: true
- Test Count: 42
- Test Failures: 0

### Files Modified
- `src/domain/services/file-lock-service.ts` (created)
- `test/unit/services/file-lock.test.ts` (created)

### Artifacts Produced
- `hnd_20260110_110000_src123`

## Acceptance Criteria

- [x] All story tasks marked complete
- [x] All tests passing (0 failures)
- [x] No TypeScript errors
- [x] Code follows CLAUDE.md standards

## Validation Commands

```bash
# Verify TypeScript compilation
pnpm tsc --noEmit

# Run all tests
pnpm vitest run

# Check linting
pnpm lint
```

## Escalation Path

On failure → Report to master-orchestrator with:
- Error details from validation
- Files that need review
- Suggested recovery action
```


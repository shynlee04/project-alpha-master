## Documentation Thresholds

### Code Documentation
```yaml
code_documentation:
  require_jsdoc_public: true  # Require JSDoc for public APIs
  require_jsdoc_complex: true # Require JSDoc for complex logic (>5 lines)
  require_usage_examples: true  # Require usage examples in JSDoc

  # Comment Quality
  min_comment_ratio: 0.1      # Minimum 10% comment-to-code ratio
  require_inline_comments: true  # Require comments for non-obvious logic
```

### Project Documentation
```yaml
project_documentation:
  require_readme: true        # Require README for all modules
  require_changelog: true     # Require CHANGELOG for public APIs
  require_contributing: true  # Require CONTRIBUTING guide
  require_license: true       # Require LICENSE file
```


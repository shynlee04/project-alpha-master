## Security Thresholds

### Code Security
```yaml
security:
  no_hardcoded_secrets: true  # Disallow hardcoded secrets/API keys
  no_eval_usage: true         # Disallow eval() usage
  no_innerhtml: true         # Disallow innerHTML (XSS risk)
  require_https: true        # Require HTTPS for external requests

  # Dependency Security
  max_vulnerabilities_high: 0  # Zero high-severity vulnerabilities
  max_vulnerabilities_medium: 5  # Maximum medium-severity vulnerabilities
  require_audit: true          # Require npm audit before deploy
```


## Usage

### Checking Thresholds

```bash
# Check all thresholds
pnpm check-thresholds

# Check specific category
pnpm check-thresholds --category stores
pnpm check-thresholds --category components
pnpm check-thresholds --category typescript
pnpm check-thresholds --category tests

# Generate compliance report
pnpm check-thresholds --report
```

### Updating Thresholds

1. Edit this file (`config/thresholds.yaml`)
2. Update threshold values
3. Run `pnpm check-thresholds --validate` to ensure changes are valid
4. Commit changes with rationale

### Requesting Exemptions

1. Document rationale in PR description
2. Get approval from @bmad-bmm-architect
3. Add exemption to `config/exemptions.yaml`
4. Set review date for exemption renewal


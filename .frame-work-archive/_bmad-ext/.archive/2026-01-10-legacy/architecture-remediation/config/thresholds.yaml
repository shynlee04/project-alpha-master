# Architecture Remediation Module - Thresholds

**Version**: 1.0.0
**Created**: 2026-01-03
**Purpose**: Define quality thresholds for all refactoring activities

## Store Thresholds

### Size Limits
```yaml
store:
  max_lines: 120              # Maximum lines per store slice
  max_functions: 10           # Maximum functions per slice
  max_dependencies: 5         # Maximum external dependencies
  max_nesting_depth: 2        # Maximum nesting depth in functions
```

### Quality Standards
```yaml
store_quality:
  min_test_coverage: 80       # Minimum test coverage percentage
  max_circular_deps: 0        # Maximum circular dependencies allowed
  require_typescript_strict: true  # Require strict TypeScript (no any)
  require_jsdoc: true         # Require JSDoc for public methods
```

---

## Component Thresholds

### Size Limits
```yaml
component:
  max_lines: 300              # Maximum lines per component
  max_functions: 15           # Maximum functions per component
  max_hooks: 10               # Maximum React hooks per component
  max_props: 5                # Maximum props per component
  max_nesting_depth: 3        # Maximum nesting depth in JSX
```

### Quality Standards
```yaml
component_quality:
  min_test_coverage: 80       # Minimum test coverage percentage
  require_translation: true   # Require all strings use i18n t()
  require_accessibility: true # Require ARIA labels for interactive elements
  require_responsive: true    # Require responsive design (mobile detection)
```

---

## Custom Hook Thresholds

### Size Limits
```yaml
hook:
  max_lines: 120              # Maximum lines per custom hook
  max_functions: 10           # Maximum functions per hook
  max_dependencies: 5         # Maximum external dependencies
  max_hook_calls: 8           # Maximum React hook calls per custom hook
```

### Quality Standards
```yaml
hook_quality:
  min_test_coverage: 85       # Minimum test coverage percentage (higher than components)
  require_typescript_strict: true  # Require strict TypeScript
  require_jsdoc: true         # Require JSDoc with usage examples
```


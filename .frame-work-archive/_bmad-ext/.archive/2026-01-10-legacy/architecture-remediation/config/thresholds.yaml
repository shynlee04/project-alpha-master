## Test Coverage Thresholds

### Overall Targets
```yaml
test_coverage:
  overall_min: 80             # Minimum overall coverage
  overall_target: 85          # Target overall coverage

  # By Priority
  p0_critical_min: 90         # Critical infrastructure (IndexedDB, stores)
  p1_high_min: 75            # User-facing features (RAG, agent chat)
  p2_medium_min: 70          # Business logic (knowledge graph, flashcards)

  # By Test Type
  unit_tests_min: 85          # Unit tests (business logic, utilities)
  integration_tests_min: 75   # Integration tests (cross-boundary)
  e2e_tests_min: 60          # E2E tests (critical user journeys)
```

### Quality Standards
```yaml
test_quality:
  require_aaa_pattern: true   # Require Arrange-Act-Assert pattern
  require_descriptive_names: true  # Require descriptive test names
  max_test_duration_ms: 5000  # Maximum duration per test
  require_mocks: true         # Require mocking external dependencies
  allow_flaky_tests: false    # Zero tolerance for flaky tests
```

---

## TypeScript Thresholds

### Error Limits
```yaml
typescript:
  max_errors: 10              # Maximum allowed TypeScript errors
  target_errors: 0            # Target: zero errors

  # By Severity
  p0_errors_max: 0           # Critical: compilation blockers
  p1_errors_max: 5           # High: type safety violations
  p2_errors_max: 5           # Medium: unused code

  # By Error Type
  max_missing_imports: 0      # Missing imports (auto-fixable)
  max_type_mismatches: 5      # Type mismatches (require review)
  max_any_types: 0           # 'any' types (strict typing required)
  max_unused_vars: 5         # Unused variables (code quality)
```

### Quality Standards
```yaml
typescript_quality:
  strict_mode: true           # Require strict mode
  no_implicit_any: true       # Disallow implicit any
  strict_null_checks: true    # Enable strict null checks
  strict_function_types: true # Enable strict function types
  no_unused_locals: true      # Disallow unused locals
  no_unused_parameters: true  # Disallow unused parameters
```

---

## File Structure Thresholds

### Directory Organization
```yaml
file_structure:
  max_nesting_depth: 5        # Maximum directory nesting depth
  require_barrel_exports: true  # Require index.ts barrel exports
  require_test_co_location: true  # Require tests in __tests__ adjacent to source

  # File Naming
  use_kebab_case_files: true  # Use kebab-case for file names
  use_pascal_case_components: true  # Use PascalCase for components
  use_camel_case_utility: true  # Use camelCase for utilities
```


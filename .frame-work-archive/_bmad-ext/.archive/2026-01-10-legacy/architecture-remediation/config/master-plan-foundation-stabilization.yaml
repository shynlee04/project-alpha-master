# ============================================================================
# MASTER PLAN: Foundation Stabilization (Epic 54)
# ============================================================================
# Purpose: Framework/skeleton guiding all stabilization phases
# Pattern: Workflows → Validation → Routing → Correction → 100% Complete
# Created: 2026-01-04
# Status: ACTIVE
# ============================================================================

plan_metadata:
  id: EPIC-54-FOUNDATION-STABILIZATION
  name: Foundation Stabilization Master Plan
  priority: P0-CRITICAL
  health_baseline: 3.8/10
  health_target: 8.5/10
  estimated_duration: 4 weeks
  approval_status: PENDING

# ============================================================================
# CONTEXT DOCUMENTS (Reference Sources)
# ============================================================================
context_documents:
  primary:
    - path: _bmad-output/sprint-artifacts/sprint-status.yaml
      purpose: Single source of truth for epic/story status
    - path: _bmad/modules/architecture-remediation/config/priorities.yaml
      purpose: P0-P3 priority definitions

  deep_scan_artifacts:
    - path: _bmad-output/deep-scan/MASTER-RISK-REGISTER.md
      purpose: 73 total risks, health score baseline
    - path: _bmad-output/deep-scan/ARCHITECTURE-SCAN-REPORT.md
      purpose: God components, layer violations
    - path: _bmad-output/deep-scan/STATE-INVENTORY-REPORT.md
      purpose: 68 stores, 10 god stores identified
    - path: _bmad-output/deep-scan/REMEDIATION-BACKLOG.yaml
      purpose: 724 total hours effort estimation

  architecture_references:
    - path: _bmad-output/project-planning-artifacts/architecture.md
      purpose: System architecture decisions
    - path: CLAUDE.md
      purpose: Project overview, ADR-024 state consolidation

# ============================================================================
# VALIDATION CHECKPOINTS (Gates for progression)
# ============================================================================
validation_checkpoints:
  V0-BASELINE:
    description: Initial health assessment
    measures:
      - typescript_errors_production <= 306
      - health_score >= 3.8/10
      - god_stores >= 69
      - god_components >= 49
    on_fail: RESTART_PHASE

  V1-GOVERNANCE:
    description: Governance rules established
    measures:
      - governance_rules_updated: true
      - eslint_rules_added: true
      - precommit_hooks_added: true
    on_fail: REPEAT_STORY

  V2-CRITICAL_FIXES:
    description: Critical issues resolved
    measures:
      - crashes_fixed: 100%
      - data_loss_prevented: true
      - circular_dependencies: 0
    on_fail: REPEAT_STORY

  V3-IMPORT_CLEANUP:
    description: Import paths canonicalized
    measures:
      - old_paths_removed: true
      - canonical_imports: 100%
      - no_duplicates: true
    on_fail: REPEAT_PHASE

  V4-GOD_ELIMINATION:
    description: God stores/components split
    measures:
      - god_stores < 10
      - god_components < 5
      - max_file_size: 300 lines
    on_fail: REPEAT_STORY

  V5-FINAL_TARGET:
    description: Target health achieved
    measures:
      - typescript_errors_production < 50
      - health_score >= 8.5/10
      - test_coverage >= 60%
    on_fail: RETROSPECTIVE

# ============================================================================
# ROUTING DECISIONS (If validation fails)
# ============================================================================
routing_decisions:
  RESTART_PHASE:
    action: "Re-start current phase from beginning"
    checkpoint: V0-BASELINE
    max_retries: 3
    on_exhausted: ESCALATE_TO_ARCHITECT

  REPEAT_STORY:
    action: "Re-execute current story"
    checkpoint: Story acceptance criteria
    max_retries: 2
    on_exhausted: SKIP_TO_NEXT_STORY

  REPEAT_PHASE:
    action: "Re-execute entire phase"
    checkpoint: Phase exit criteria
    max_retries: 1
    on_exhausted: DOCUMENT_BLOCKER

  SKIP_TO_NEXT_STORY:
    action: "Mark story as BLOCKED, continue to next"
    creates: blocker_entry in sprint-status.yaml
    requires: approval from @bmad-bmm-architect

  DOCUMENT_BLOCKER:
    action: "Create blocker documentation, pause phase"
    creates: blocker-report-YYYY-MM-DD.md
    requires: retrospective meeting

  ESCALATE_TO_ARCHITECT:
    action: "Architecture decision required"
    triggers: ADR creation workflow
    creates: architecture-decision-records/ADR-XXX.md

# ============================================================================
# PHASE STAB-24: Governance Enforcement (Week 1)
# ============================================================================
# Goal: Establish rules and stop the bleeding
# Exit Criteria: V2-CRITICAL_FIXES passed
# ============================================================================
phase_STAB_24:

          action: |
            Add stabilization-specific rules to .claude/rules/governance-rules.md
          acceptance_criteria:
            - File updated with stabilization rules
            - All AI agents must read before code changes
          artifacts: []
          on_complete: PROCEED

        - id: 54-0-2

            - Build fails if TS errors > threshold
          artifacts:
            - .github/workflows/ci.yml
          on_complete: PROCEED

      validation: V1-GOVERNANCE

    # ========================================================================
    # TASK 54-1a: IndexedDB Quota Handling (P0 - DATA LOSS)
    # ========================================================================
    task_54_1a:
      id: 54-1a
      name: IndexedDB Quota Handling
      priority: P0
      estimated_hours: 8
      risk: "DATA LOSS if not fixed"
      status: backlog

      sub_tasks:
        - id: 54-1a-1
          name: Audit IndexedDB usage
          action: |
            Search all Dexie write operations for quota handling
          files_to_audit:
            - src/infrastructure/persistence/dexie-*.ts
            - src/lib/state/*store.ts
          acceptance_criteria:
            - List of all write operations created
            - Gap analysis documented
          artifacts:
            - _bmad-output/indexedb-audit-YYYY-MM-DD.md
          on_complete: PROCEED

        - id: 54-1a-2
          name: Implement quota detection utility
          action: |
            Create quota detection utility using navigator.storage.estimate()
          acceptance_criteria:
            - Utility detects quota before writes
            - Returns remaining bytes available
          artifacts:
            - src/infrastructure/persistence/quota-detector.ts
          on_complete: PROCEED

        - id: 54-1a-3
          name: Add quota error handling to all writes
          action: |
            Wrap all Dexie writes with quota error handling
          acceptance_criteria:
            - All writes check quota first
            - Graceful error on quota exceeded
          artifacts:
            - Updated dexie-*.ts files
          on_complete: PROCEED

        - id: 54-1a-4
          name: Add user notification for quota
          action: |
            Create UI component for quota exceeded warnings
          acceptance_criteria:
            - User sees clear error message
            - Recovery action suggested (clear old data)
          artifacts:
            - src/presentation/components/ui/QuotaWarning.tsx
          on_complete: PROCEED

      validation: V2-CRITICAL_FIXES

    # ========================================================================
    # TASK 54-1b: Silent Failures Elimination (P0)
    # ========================================================================
    task_54_1b:
      id: 54-1b
      name: Silent Failures Elimination
      priority: P0
      estimated_hours: 12
      risk: "23 instances of console.error + return null"
      status: backlog

      sub_tasks:
        - id: 54-1b-1
          name: Find all silent failures
          action: |
            Grep for "console.error" followed by "return null"
          acceptance_criteria:
            - Complete list of silent failures
            - Categorized by severity (P0/P1/P2)
          artifacts:
            - _bmad-output/silent-failures-audit-YYYY-MM-DD.md
          on_complete: PROCEED

        - id: 54-1b-2
          name: Fix P0 silent failures
          action: |
            Replace with explicit error handling + user notification
          acceptance_criteria:
            - All P0 failures have user-facing error messages
            - Recovery actions suggested
          artifacts:
            - Updated source files
          on_complete: PROCEED

        - id: 54-1b-3
          name: Fix P1 silent failures
          action: |
            Replace with proper error propagation
          acceptance_criteria:
            - All P1 failures propagate to error boundary
          artifacts:
            - Updated source files
          on_complete: PROCEED

        - id: 54-1b-4
          name: Document P2 silent failures
          action: |
            Create tech debt tickets for P2 items
          acceptance_criteria:
            - P2 items logged as debt
            - Scheduled for future sprint
          artifacts:
            - Updated sprint-status.yaml
          on_complete: PROCEED

      validation: V2-CRITICAL_FIXES

    # ========================================================================
    # TASK 54-1c: Circular Dependency Removal (P0)
    # ========================================================================
    task_54_1c:
      id: 54-1c
      name: Circular Dependency Removal
      priority: P0
      estimated_hours: 6
      risk: "4 circular dependencies detected"
      status: backlog

      sub_tasks:
        - id: 54-1c-1
          name: Map all circular dependencies
          action: |
            Use madge to detect circular dependencies
          acceptance_criteria:
            - Dependency graph created
            - All cycles identified
          artifacts:
            - _bmad-output/dependency-graph-YYYY-MM-DD.md
          on_complete: PROCEED

        - id: 54-1c-2

            Extract shared logic to domain service
          reference: src/domain/services/agent-workspace-utils.ts
          acceptance_criteria:
            - No circular import between stores
            - Functionality preserved
          artifacts:
            - Updated stores
            - ADR-029-circular-dependency-resolution.md
          on_complete: PROCEED

        - id: 54-1c-3
          name: Break remaining cycles
          action: |
            Apply facade pattern for other cycles
          acceptance_criteria:
            - Zero circular dependencies
            - All imports validated
          artifacts:
            - Updated source files
          on_complete: PROCEED

      validation: V2-CRITICAL_FIXES

    # ========================================================================
    # TASK 54-1-typescript: Critical TS Errors (Crashes)
    # ========================================================================
    task_54_1_ts:

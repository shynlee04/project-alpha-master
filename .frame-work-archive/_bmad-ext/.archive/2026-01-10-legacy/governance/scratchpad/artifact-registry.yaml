# Registry Schema

## Artifact Entry Schema

```yaml
id: string                    # Unique artifact identifier
tier: 1 | 2 | 3 | 4          # Governance tier
type: string                  # Artifact type
parent_id: string | null      # Parent epic/story ID
sequence_number: int          # Sequence in parent lineage
created_at: ISO8601           # Creation timestamp
expires_at: ISO8601           # Expiry timestamp
status: ACTIVE | ARCHIVED     # Current status
path: string                  # File path
related_artifacts: string[]   # Connected artifacts
tags: string[]                # Search tags
```

## Orphan Detection Rules

An artifact is considered ORPHAN if:
1. `parent_id` references a non-existent epic/story
2. `sequence_number` has gaps (missing predecessor)
3. `expires_at` < now AND `status` != ARCHIVED
4. `path` references a non-existent file

## Auto-Sync Rules

When agent creates artifact:
1. Generate artifact_id based on sequence tracker
2. Add entry to `artifacts` array
3. Increment sequence tracker
4. Validate no orphan status
5. Write registry with new `last_updated`

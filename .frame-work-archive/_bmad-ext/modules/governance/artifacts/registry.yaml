## Artifact Categories

```yaml
categories:
  planning:
    - product_brief
    - module_plan
    - architecture
    - ux_specification
    - research_notes

  execution:
    - story_context
    - epic_status
    - sprint_status
    - governance_report
    - test_results

  governance:
    - workflow_definition
    - scanner_definition
    - policy_document
    - checklist
    - gate_definition

  reference:
    - instructions
    - standards
    - templates
    - examples
```

## Lifecycle Rules

```yaml
lifecycle:
  active:
    condition: "updated_at < 48 hours ago"
    action: "keep in active location"

  stale:
    condition: "updated_at >= 48 hours ago AND < 30 days ago"
    action: "flag for review, consider archival"

  archive_candidate:
    condition: "updated_at >= 30 days ago"
    action: "move to archive with date stamp"

  deprecated:
    condition: "superseded by newer version"
    action: "mark as deprecated, reference replacement"
```

## Update Protocol

```yaml
on_create:
  - generate_uuid
  - assign_category
  - register_in_yaml
  - set_review_date

on_update:
  - update_timestamp
  - increment_version
  - check_staleness
  - update_registry

on_archive:
  - move_to_archive_folder
  - update_status_to_archived
  - create_index_entry
  - remove_from_active_registry
```

## Integration

**Updated By**: All workflows that create artifacts


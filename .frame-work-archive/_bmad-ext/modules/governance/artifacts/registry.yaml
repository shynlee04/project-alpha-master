# Artifact Registry

**Purpose**: Central tracking of all governance artifacts to prevent staleness, duplication, and orphaned files.

## Registry Format

```yaml
artifacts:
  - id: "{artifact_uuid}"
    name: "{artifact_name}"
    type: "{planning|execution|governance|reference}"
    category: "{subcategory}"

    path: "{relative_path_from_project_root}"
    created_at: "{timestamp}"
    updated_at: "{timestamp}"
    size_bytes: {number}

    status: "{active|stale|archived|deprecated}"

    metadata:
      workflow: "{associated_workflow}"
      epic: "{if_applicable}"
      story: "{if_applicable}"
      dependencies: [artifact_ids]
      dependents: [artifact_ids]

    lifecycle:
      freshness_threshold: "{hours}"
      last_reviewed: "{timestamp}"
      next_review: "{timestamp}"
      auto_archive_after: "{hours}"
```


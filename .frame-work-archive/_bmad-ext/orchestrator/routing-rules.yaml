# _bmad-ext/orchestrator/routing-rules.yaml
# Dynamic Story → Enhanced Agent Routing
# Replaces static MODULE-ROUTING.yaml (316 lines)

schema_version: "1.0.0"
created: "2026-01-10"

# ═══════════════════════════════════════════════════════════════════════════
# ROUTING RULES
# ═══════════════════════════════════════════════════════════════════════════
#
# Rules are evaluated in order. First match wins.
# Each rule has:
#   - if: condition to match
#   - agent: enhanced agent to delegate to
#   - workflow: workflow to execute
#   - priority: for execution ordering
#   - timeout: max execution time
#
# ═══════════════════════════════════════════════════════════════════════════

routing_rules:

  # ═════════════════════════════════════════════════════════════════════════
  # GOVERNANCE ENFORCEMENT (Highest Priority - Runs First for ALL work)
  # ═════════════════════════════════════════════════════════════════════════
  # All work must pass three enforcement checks before proceeding:
  #   1. Context First (targeted domain scanning, <5K tokens)
  #   2. Agent as Expert (codebase comparison, flaw detection)
  #   3. Research Required (auto-trigger on tech decisions)
  # Output: ALLOW / WARN / BLOCK with governance report
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "GOV-001"
    name: "Governance Enforcement"
    if: "true"  # Always applies to ALL work before anything else
    agent: "governance-core"
    workflow: "correct-course"
    priority: "critical"
    timeout_minutes: 5
    description: "Three enforcement checks before any work proceeds"
    governance_report: true
    then: "continue_to_next_rule"  # If ALLOW, continue to specific workflow

  # ═════════════════════════════════════════════════════════════════════════
  # CRITICAL: Architecture Remediation (Runs AFTER governance allows)
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "REMEDIATION-001"
    name: "God Store Split"
    if: "story_type == 'god_store_split'"
    agent: "dev-ext"
    workflow: "remediation-cycle"
    priority: "critical"
    timeout_minutes: 120
    description: "Split large stores (>300 lines) into focused slices"

  - rule_id: "REMEDIATION-002"
    name: "Component Split"
    if: "story_type == 'component_split'"
    agent: "dev-ext"
    workflow: "remediation-cycle"
    priority: "critical"
    timeout_minutes: 90
    description: "Break down god components into smaller modules"

  - rule_id: "REMEDIATION-003"
    name: "TypeScript Fix"
    if: "story_type == 'typescript_fix'"
    agent: "dev-ext"
    workflow: "remediation-cycle"
    priority: "critical"
    timeout_minutes: 60
    description: "Fix TypeScript compilation errors"

  # ═════════════════════════════════════════════════════════════════════════
  # FEATURE DEVELOPMENT
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "DEV-001"
    name: "Feature Development"
    if: "story_type == 'feature_development'"
    agent: "dev-ext"
    workflow: "story-cycle"
    priority: "high"
    timeout_minutes: 60
    description: "Implement new features following TDD"

  - rule_id: "DEV-002"
    name: "Bug Fix"
    if: "story_type == 'bug_fix'"
    agent: "dev-ext"
    workflow: "story-cycle"
    priority: "high"
    timeout_minutes: 45
    description: "Fix reported bugs with tests"

  - rule_id: "DEV-003"
    name: "Code Review"
    if: "story_type == 'code_review'"
    agent: "dev-ext"
    workflow: "review-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Review code changes and provide feedback"

  # ═════════════════════════════════════════════════════════════════════════
  # ARCHITECTURE & DESIGN
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "ARCH-001"
    name: "System Design"
    if: "story_type == 'system_design'"
    agent: "architect-ext"
    workflow: "architecture-cycle"
    priority: "high"
    timeout_minutes: 60
    description: "Create system architecture design"

  - rule_id: "ARCH-002"
    name: "Technical Specification"
    if: "story_type == 'technical_spec'"
    agent: "architect-ext"
    workflow: "architecture-cycle"
    priority: "high"
    timeout_minutes: 60
    description: "Create detailed technical specification"

  - rule_id: "ARCH-003"
    name: "Architecture Decision Record"
    if: "story_type == 'adr'"
    agent: "architect-ext"
    workflow: "adr-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Document architecture decision"

  # ═════════════════════════════════════════════════════════════════════════
  # ANALYSIS & RESEARCH
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "ANALYSIS-001"
    name: "Requirements Analysis"
    if: "story_type == 'product_analysis' OR story_type == 'requirements_analysis'"
    agent: "analyst-ext"
    workflow: "analysis-cycle"
    priority: "high"
    timeout_minutes: 45
    description: "Analyze and document requirements"

  - rule_id: "ANALYSIS-002"
    name: "Competitive Analysis"
    if: "story_type == 'competitive_analysis'"
    agent: "analyst-ext"
    workflow: "analysis-cycle"
    priority: "medium"
    timeout_minutes: 60
    description: "Research competitive landscape"

  - rule_id: "ANALYSIS-003"
    name: "Domain Analysis"
    if: "story_type == 'domain_analysis'"
    agent: "quality-scanner-ext"
    workflow: "scan-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Analyze domain-specific code"

  # ═════════════════════════════════════════════════════════════════════════
  # SPRINT PLANNING (Enhanced Wrapper - Cohesion & Reality Validation)
  # ═════════════════════════════════════════════════════════════════════════
  # Updated: 2026-01-11 - Sprint-Planning Wrapper adds cohesion validation,
  # dependency mapping, and Product Reality gates before story execution

  - rule_id: "PROD-001"
    name: "Sprint Planning (Enhanced Wrapper)"
    if: "story_type == 'sprint_planning'"
    agent: "sprint-planning-wrapper"
    workflow: "sprint-planning-enhanced"
    priority: "high"
    timeout_minutes: 90
    description: "Enhanced sprint planning with cohesion validation, dependency mapping, and reality gates"
    module: "sprint-planning-wrapper"
    outputs:
      - "sprint-status.yaml (enhanced with cohesion flags)"
      - "cohesion-report-{date}.md"
      - "dependency-map.yaml"
      - "demo-script.md"
    hands_off_to: "story-cycle"

  # ═════════════════════════════════════════════════════════════════════════
  # PRODUCT MANAGEMENT (CONSOLIDATED: pm-ext + sm-ext → product-management-ext)
  # ═════════════════════════════════════════════════════════════════════════
  # Updated: 2026-01-10 - Agent consolidation reduces main agent count from 9 to 7

  - rule_id: "PROD-002"
    name: "Backlog Refinement"
    if: "story_type == 'backlog_refinement'"
    agent: "product-management-ext"
    sub_agent: "pm"
    workflow: "planning-cycle"
    priority: "medium"
    timeout_minutes: 45
    description: "Refine backlog items"

  - rule_id: "PROD-003"
    name: "Sprint Retrospective"
    if: "story_type == 'retrospective'"
    agent: "product-management-ext"
    sub_agent: "pm"
    workflow: "retrospective-cycle"
    priority: "low"
    timeout_minutes: 30
    description: "Conduct sprint retrospective"

  - rule_id: "PROD-004"
    name: "Story Creation"
    if: "story_type == 'story_creation'"
    agent: "product-management-ext"
    sub_agent: "sm"
    workflow: "story-creation-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Create new user story"

  - rule_id: "PROD-005"
    name: "Story Breakdown"
    if: "story_type == 'story_breakdown'"
    agent: "product-management-ext"
    sub_agent: "sm"
    workflow: "story-creation-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Break epic into stories"

  # ═════════════════════════════════════════════════════════════════════════
  # TESTING
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "TEA-001"
    name: "Test Design"
    if: "story_type == 'test_design'"
    agent: "tea-ext"
    workflow: "testing-cycle"
    priority: "medium"
    timeout_minutes: 45
    description: "Design test strategy and test cases"

  - rule_id: "TEA-002"
    name: "Test Review"
    if: "story_type == 'test_review'"
    agent: "tea-ext"
    workflow: "testing-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Review existing tests"

  - rule_id: "TEA-003"
    name: "E2E Test"
    if: "story_type == 'e2e_test'"
    agent: "tea-ext"
    workflow: "e2e-cycle"
    priority: "high"
    timeout_minutes: 60
    description: "Create end-to-end tests"

  # ═════════════════════════════════════════════════════════════════════════
  # DOCUMENTATION
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "DOCS-001"
    name: "API Documentation"
    if: "story_type == 'api_docs'"
    agent: "tech-writer-ext"
    workflow: "documentation-cycle"
    priority: "medium"
    timeout_minutes: 45
    description: "Create API documentation"

  - rule_id: "DOCS-002"
    name: "User Guide"
    if: "story_type == 'user_guide'"
    agent: "tech-writer-ext"
    workflow: "documentation-cycle"
    priority: "low"
    timeout_minutes: 60
    description: "Create user guide"

  - rule_id: "DOCS-003"
    name: "README Update"
    if: "story_type == 'readme_update'"
    agent: "tech-writer-ext"
    workflow: "documentation-cycle"
    priority: "low"
    timeout_minutes: 15
    description: "Update README documentation"

  # ═════════════════════════════════════════════════════════════════════════
  # UX DESIGN
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "UX-001"
    name: "UX Design"
    if: "story_type == 'ux_design'"
    agent: "ux-designer-ext"
    workflow: "design-cycle"
    priority: "medium"
    timeout_minutes: 60
    description: "Create UX design and wireframes"

  - rule_id: "UX-002"
    name: "Accessibility Review"
    if: "story_type == 'accessibility_review'"
    agent: "ux-designer-ext"
    workflow: "design-cycle"
    priority: "medium"
    timeout_minutes: 30
    description: "Review for accessibility compliance"

  # ═════════════════════════════════════════════════════════════════════════
  # QUALITY & SCANNING (SHARED SERVICE - not a main agent)
  # ═════════════════════════════════════════════════════════════════════════
  # Updated: 2026-01-10 - quality-scanner-ext moved to shared-services

  - rule_id: "QUALITY-001"
    name: "Health Assessment"
    if: "story_type == 'health_assessment'"
    agent: "quality-scanner"  # Shared service, invoked directly
    workflow: "scan-cycle"
    priority: "high"
    timeout_minutes: 45
    description: "Full codebase health scan"

  - rule_id: "QUALITY-002"
    name: "State Scan"
    if: "story_type == 'state_scan'"
    agent: "quality-scanner"
    workflow: "scan-cycle"
    priority: "high"
    timeout_minutes: 30
    description: "Scan Zustand state management"

  - rule_id: "QUALITY-003"
    name: "Architecture Scan"
    if: "story_type == 'architecture_scan'"
    agent: "quality-scanner"
    workflow: "scan-cycle"
    priority: "high"
    timeout_minutes: 30
    description: "Scan for architecture issues"

  - rule_id: "QUALITY-004"
    name: "Security Scan"
    if: "story_type == 'security_scan'"
    agent: "quality-scanner"
    workflow: "scan-cycle"
    priority: "critical"
    timeout_minutes: 30
    description: "Scan for security vulnerabilities"

  # ═════════════════════════════════════════════════════════════════════════
  # DEFAULT FALLBACK
  # ═════════════════════════════════════════════════════════════════════════

  - rule_id: "DEFAULT-001"
    name: "Default Handler"
    if: "true"  # Always matches if nothing above did
    agent: "dev-ext"
    workflow: "story-cycle"
    priority: "medium"
    timeout_minutes: 60
    description: "Default handler for unknown story types"
    log: "Unknown story type '{story_type}', using default dev-ext"

# ═══════════════════════════════════════════════════════════════════════════
# WORKFLOW DEFINITIONS
# ═══════════════════════════════════════════════════════════════════════════

workflows:
  correct-course:
    path: ".agent/workflows/bmad/bmad-bmb-workflows-correct-course.md"
    description: "Governance enforcement - three checks before any work"
    module: "governance-core"

  # ═════════════════════════════════════════════════════════════════════════
  # ENHANCED WORKFLOWS (Updated: 2026-01-11)
  # ═════════════════════════════════════════════════════════════════════════

  sprint-planning-enhanced:
    path: "_bmad-ext/modules/sprint-planning-wrapper/workflows/sprint-planning-enhanced/workflow.md"
    description: "Enhanced sprint planning with cohesion validation, dependency mapping, reality gates"
    module: "sprint-planning-wrapper"
    consumes:
      - "_bmad/bmm/workflows/4-implementation/sprint-planning/"
    produces:
      - "sprint-status.yaml (with cohesion flags)"
      - "cohesion-report-{date}.md"
      - "dependency-map.yaml"
      - "demo-script.md"
    hands_off_to: "story-cycle"

  story-cycle:
    path: "_bmad-ext/modules/implementation/workflows/story-cycle/workflow.md"
    description: "Full story development cycle with Product Reality Gates (01a, 03a, 06a)"
    module: "implementation"
    product_reality_gates:
      - step: "01a"
        name: "User Journey Simulation"
        description: "The Movie Script Test - 30-second demo script validation"
        validates: ["island_feature", "split_brain", "ghost_result", "dead_end"]
      - step: "03a"
        name: "Agent Tool Spec"
        description: "LLM tool definition with JSON Schema, permissions, triggers"
        validates: ["orphan_tool", "permission_gap", "vague_trigger"]
      - step: "06a"
        name: "Reality Check"
        description: "Visual regression and UI validation"
        validates: ["visual_break", "missing_state", "zombie_feature"]
    consumes:
      - "sprint-status.yaml (from sprint-planning-enhanced)"
      - "journey context"

  remediation-cycle:
    path: "_bmad-ext/workflows/remediation-cycle/workflow.md"
    description: "Architecture remediation cycle"

  architecture-cycle:
    path: "_bmad-ext/workflows/architecture-cycle/workflow.md"
    description: "Architecture design cycle"

  analysis-cycle:
    path: "_bmad-ext/workflows/analysis-cycle/workflow.md"
    description: "Requirements analysis cycle"

  planning-cycle:
    path: "_bmad-ext/workflows/planning-cycle/workflow.md"
    description: "Product planning cycle"

  testing-cycle:
    path: "_bmad-ext/workflows/testing-cycle/workflow.md"
    description: "Test design cycle"

  documentation-cycle:
    path: "_bmad-ext/workflows/documentation-cycle/workflow.md"
    description: "Documentation cycle"

  design-cycle:
    path: "_bmad-ext/workflows/design-cycle/workflow.md"
    description: "UX design cycle"

  scan-cycle:
    path: "_bmad-ext/workflows/scan-cycle/workflow.md"
    description: "Quality scan cycle"

# ═══════════════════════════════════════════════════════════════════════════
# PRIORITY LEVELS
# ═══════════════════════════════════════════════════════════════════════════

priorities:
  critical:
    value: 100
    description: "System stability issues, security vulnerabilities"
    examples: ["god_store_split", "security_scan"]

  high:
    value: 75
    description: "Feature development, architecture work, health scans"
    examples: ["feature_development", "system_design", "health_assessment"]

  medium:
    value: 50
    description: "Documentation, analysis, design, testing"
    examples: ["api_docs", "ux_design", "test_design"]

  low:
    value: 25
    description: "Nice-to-have documentation, guides"
    examples: ["user_guide", "readme_update"]

# ═══════════════════════════════════════════════════════════════════════════
# ENHANCED AGENT INDEX
# ═══════════════════════════════════════════════════════════════════════════
# Updated: 2026-01-10 - Agent consolidation (9 → 7 main agents + 1 shared service)

agents:
  governance-core:
    path: "_bmad-ext/modules/governance-core/"
    description: "Adaptive governance system - enforcement checks, stage-gating"
    capabilities: ["context_first", "expert_analysis", "research_trigger", "stage_gate", "auto_gate"]
    hooks: ["session-start", "user-prompt-submit", "post-workflow"]

  # ============================================
  # Module-Based Wrappers (Updated: 2026-01-11)
  # ============================================

  sprint-planning-wrapper:
    path: "_bmad-ext/modules/sprint-planning-wrapper/"
    type: "wrapper"
    description: "Enhanced sprint planning with cohesion validation, dependency mapping, reality gates"
    capabilities: ["cohesion_check", "dependency_mapping", "nonsense_detection", "reality_validation"]
    consumes:
      - "_bmad/bmm/workflows/4-implementation/sprint-planning/"
    produces:
      - "sprint-status.yaml (with cohesion flags)"
      - "cohesion-report-{date}.md"
      - "dependency-map.yaml"
      - "demo-script.md"
    hands_off_to: "story-cycle"
    scanners:
      - "cohesion-scanner.md"
      - "dependency-scanner.md"
      - "nonsense-detector.md"
    config:
      - "gating-rules.yaml"
      - "cohesion-patterns.yaml"

  # ============================================
  # Main Agents (7 total)
  # ============================================

  dev-ext:
    path: "_bmad-ext/agents/dev-ext.md"
    wraps: "_bmad/bmm/agents/dev.md"
    capabilities: ["feature_development", "bug_fix", "code_review", "remediation"]
    sub_agents: ["tea-ext"]

  architect-ext:
    path: "_bmad-ext/agents/architect-ext.md"
    wraps: "_bmad/bmm/agents/architect.md"
    capabilities: ["system_design", "technical_spec", "adr"]

  analyst-ext:
    path: "_bmad-ext/agents/analyst-ext.md"
    wraps: "_bmad/bmm/agents/analyst.md"
    capabilities: ["requirements_analysis", "competitive_analysis"]

  # CONSOLIDATED (2026-01-10): pm-ext + sm-ext → product-management-ext
  product-management-ext:
    path: "_bmad-ext/agents/product-management-ext.md"
    wraps: 
      - "_bmad/bmm/agents/pm.md"
      - "_bmad/bmm/agents/sm.md"
    capabilities: ["sprint_planning", "backlog_refinement", "retrospective", "story_creation", "story_breakdown"]
    sub_agents: ["pm", "sm"]
    note: "Replaces pm-ext and sm-ext"

  ux-designer-ext:
    path: "_bmad-ext/agents/ux-designer-ext.md"
    wraps: "_bmad/bmm/agents/ux-designer.md"
    capabilities: ["ux_design", "accessibility_review"]

  tech-writer-ext:
    path: "_bmad-ext/agents/tech-writer-ext.md"
    wraps: "_bmad/bmm/agents/tech-writer.md"
    capabilities: ["api_docs", "user_guide", "readme_update"]

  # ============================================
  # Shared Services (1 total, not counted as main agents)
  # ============================================

  quality-scanner:
    path: "_bmad-ext/shared-services/quality-scanner.md"
    type: "shared_service"
    wraps: "_bmad/modules/quality/scanners/"
    capabilities: ["health_assessment", "state_scan", "architecture_scan", "security_scan"]
    available_to: "all_agents"
    note: "Moved from agents/ to shared-services/ (2026-01-10)"

# ═══════════════════════════════════════════════════════════════════════════
# CONSOLIDATION HISTORY
# ═══════════════════════════════════════════════════════════════════════════

consolidation_history:
  - date: "2026-01-11"
    change: "Added sprint-planning-wrapper module"
    type: "module_wrapper"
    description: "Enhanced sprint planning with cohesion validation, dependency mapping, Product Reality gates"
    created:
      - "_bmad-ext/modules/sprint-planning-wrapper/MODULE.md"
      - "_bmad-ext/modules/sprint-planning-wrapper/workflows/sprint-planning-enhanced/"
      - "_bmad-ext/modules/sprint-planning-wrapper/scanners/"
      - "_bmad-ext/modules/sprint-planning-wrapper/config/"
    integrates_with:
      - "story-cycle (receives handoff)"
      - "_bmad/bmm/workflows/4-implementation/sprint-planning/ (consumes)"

  - date: "2026-01-11"
    change: "Enhanced story-cycle with Product Reality Gates"
    type: "workflow_enhancement"
    description: "Added 3 new validation steps (01a, 03a, 06a) for UX, Agent tools, Visual reality"
    gates_added:
      - "01a: User Journey Simulation (Movie Script Test)"
      - "03a: Agent Tool Spec (LLM tool definition)"
      - "06a: Reality Check (Visual regression)"

  - date: "2026-01-10"
    change: "pm-ext + sm-ext → product-management-ext"
    main_agent_count: "9 → 7"
    archived:
      - "_bmad-ext/.archive/agents/pm-ext.md"
      - "_bmad-ext/.archive/agents/sm-ext.md"
    created:
      - "_bmad-ext/agents/product-management-ext.md"

  - date: "2026-01-10"
    change: "quality-scanner-ext → shared-services/quality-scanner.md"
    reason: "Quality scanner is infrastructure, not a main agent"
    moved_from: "_bmad-ext/agents/quality-scanner-ext.md"
    moved_to: "_bmad-ext/shared-services/quality-scanner.md"

# ============================================================================
# TTL SYSTEM (4-Tier Lifecycle Management)
# ============================================================================

ttl_system:
  tier_1_permanent:
    name: "Tier 1: Permanent (Constitution)"
    ttl: "forever"
    description: "Core governance documents that define the project"
    validation: "Read-only check on every load"
    examples:
      - "new-fundamental-truths.md"
      - "ADR-039 (Primary Architecture Authority)"
      - "BMAD Constitution v2.0.0"

  tier_2_controlled:
    name: "Tier 2: Controlled & Iterative"
    ttl: "permanent"
    description: "Living documents updated with governance approval"
    validation: "Full consumption required on load"
    examples:
      - "architecture.md (v3.0.0)"
      - "prd.md (v2.0.0)"
      - "epics.md (v3.0.0)"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LOOP_STATE.yaml"

  tier_3_archival:
    name: "Tier 3: Archival"
    ttl: "90 days"
    description: "Historical artifacts for reference"
    validation: "Archive if stale, compress if >5MB"
    examples:
      - "Completed epic artifacts"
      - "Superseded ADRs"
      - "Analysis reports"
      - "Handoff artifacts"

  tier_4_ephemeral:
    name: "Tier 4: Ephemeral"
    ttl: "24 hours"
    description: "Temporary artifacts, research notes"
    validation: "Ignore if stale, create fresh"
    examples:
      - "Investigation working documents"
      - "Draft ADRs"
      - "Meeting notes"


  - id: "STATE-003"
    title: "workspace-store uses localStorage instead of Dexie"
    severity: "P0"
    claimed_status: "REMEDIATED"
    actual_status: "STILL_INFECTED"
    team: "B"
    
    file: "src/infrastructure/persistence/stores/workspace/workspace-store.ts"
    line: 174
    evidence: |
      persist({...}, { name: 'workspace-state' })
      No `storage: createJSONStorage()` option specified.
      Defaults to localStorage instead of IndexedDB per ADR-033.
      
    required_fix: |
      Add storage option:
      ```typescript
      import { createJSONStorage } from 'zustand/middleware';
      import { createDexieStorage } from '@/infrastructure/persistence/zustand-dexie-storage';
      
      persist({...}, {
        name: 'workspace-state',
        storage: createJSONStorage(() => createDexieStorage('workspace-state')),
      })
      ```
      
    validation:
      - "Application > Local Storage: 'workspace-state' NOT present"
      - "Application > IndexedDB: workspace state visible"
      
  # ---------------------------------------------------------------------------
  # HIGH PRIORITY - Routing  
  # ---------------------------------------------------------------------------
  
  - id: "ROUTE-002"
    title: "ide.tsx uses window.location instead of TanStack Router"
    severity: "P1"
    claimed_status: "PENDING"
    actual_status: "STILL_INFECTED"
    team: "A"
    
    file: "src/routes/ide.tsx"
    line: 114
    evidence: |
      const isOnChildRoute = window.location.pathname !== '/ide';
      Direct DOM access causes hydration issues and is non-idiomatic.
      
    required_fix: |
      Use TanStack Router hooks:
      ```typescript
      import { useMatchRoute } from '@tanstack/react-router';
      
      const matchRoute = useMatchRoute();
      const isOnChildRoute = !!matchRoute({ to: '/ide/$projectId', fuzzy: true });
      ```
      
    validation:
      - "grep 'window.location' src/routes/ide.tsx returns 0 results"
      
  - id: "PLAT-001"

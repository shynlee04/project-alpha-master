    team: "A"
    
    file: "src/routes/ide.tsx"
    lines: "140-146"
    evidence: |
      Desktop shows "⚡ Quick IDE (Temp Project)" button.
      ADR-033 D1: Desktop MUST use FSA (folder picker).
      
    required_fix: |
      Remove temp project button on desktop:
      ```typescript
      const platform = getPlatformContract();
      
      {/* Only show temp project on mobile/fallback */}
      {!platform.canAccessFSA && (
        <button onClick={() => handleCreateTemp(navigate)}>
          ⚡ Quick IDE (Temp Project)
        </button>
      )}
      ```
      
    validation:

  - id: "FSA-003"
    title: "handleData set to null for Chrome < 129"
    severity: "P1"
    claimed_status: "REMEDIATED"
    actual_status: "PARTIAL"
    team: "B"
    
    file: "src/infrastructure/filesystem/handle-persistence.ts"
    lines: "189-191"
    evidence: |
      handleData = isStructuredCloneSupported() ? structuredClone(handle) : null
      Chrome 122-128 users get handleData=null, breaking silent restore.
      
    required_fix: |
      For Chrome 122-128, store handle metadata and rely on persistent permission ID:
      The current implementation is CORRECT for the browser capability.
      Chrome 122-128 CANNOT store handles (no structuredClone support).
      The "silent restore" for these versions uses showDirectoryPicker({ id: projectId })
      which works when user granted "Allow on every visit".
      
      DECISION: Mark as ACCEPTABLE LIMITATION (not a bug).
      Document in ADR-034 that Chrome 129+ is required for true silent restore.
      
    validation:
      - "Document limitation in ADR-034"
      - "Add user-facing message explaining Chrome 129+ recommended"
      
  - id: "FSA-002"
    title: "restoreHandle still prompts on Chrome 122-128"
    severity: "P1"
    claimed_status: "REMEDIATED"
    actual_status: "PARTIAL"
    team: "B"
    
    file: "src/infrastructure/filesystem/handle-persistence.ts"
    lines: "337-344"
    evidence: |
      Chrome 122-128 uses showDirectoryPicker({ id: projectId }) which MAY prompt
      if user didn't choose "Allow on every visit".
      
    required_fix: |
      ACCEPTABLE LIMITATION - Chrome 122-128 behavior is browser-imposed.
      The implementation correctly attempts silent restore first.
      Prompting is expected when user chose "Allow this time" only.
      
    validation:
      - "Document in user guide"


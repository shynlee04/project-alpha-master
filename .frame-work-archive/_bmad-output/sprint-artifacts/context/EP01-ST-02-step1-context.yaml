      timestamp: "2026-01-17T00:00:00+07:00"
      findings:
        - "Chrome 122+ introduced persistent permissions for File System Access API, allowing users to grant apps indefinite read and write access to files and folders without needing to re-grant permission on every visit"
        - "New three-way permission prompt with options: Allow this time, Allow on every visit, Don't allow"
        - "Users can manage persistent permissions in site settings under Privacy and security section"
        - "NO developer-facing changes to File System Access API required - behavior is automatic when preconditions met"
        - "Precondition 1: User must have granted permission before AND app must have stored FileSystemHandle in IndexedDB"
        - "Precondition 2: Upon next visit, app must retrieve stored handle from IndexedDB and call FileSystemHandle.requestPermission() method"
        - "Precondition 3: App must be installed (PWA) - persistent access for non-installed sites is NOT supported"
        - "Non-installed sites will trigger permission picker on EVERY page load where API is invoked"
        - "Permission prompt lists all FileSystemHandle objects app previously had access to, not just one for which requestPermission() is being called"
        - "If user denies/dismisses prompt more than 3 times, regular permission prompt will show (no 3-way prompt)"
      code_examples:
        - "Retrieve stored handle from IndexedDB: const storedHandle = await getStoredHandle(projectId)"
        - "Call requestPermission() to trigger 3-way prompt: const permission = await storedHandle.requestPermission({ mode: readwrite })"
        - "Check permission state: const state = await storedHandle.queryPermission({ mode: readwrite })"
        - "Three-way prompt appears when: 1) Handle was stored in IndexedDB, 2) User previously granted access, 3) App calls requestPermission() on handle"


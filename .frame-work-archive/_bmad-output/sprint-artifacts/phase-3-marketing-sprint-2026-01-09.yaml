# 🍜 THE "INSTANT NOODLES" PHILOSOPHY
# ═══════════════════════════════════════════════════════════════════════════

philosophy:
  name: "Mì Ăn Liền (Instant Noodles)"
  principles:
    - name: "3-Second Hook"
      description: "Every feature must WOW in 3 seconds or less"
    - name: "Zero Learning Curve"
      description: "Grandma can use it. No tutorials needed."
    - name: "Premium Packaging"
      description: "Output looks like $10K agency work"
    - name: "Vietnamese DNA"
      description: "Built for FB/Zalo/TikTok VN ecosystem first"
      
  target_market:
    primary: "Vietnamese SME Marketers (1-10 employee shops)"
    secondary: "Content Creators (TikTokers, Reviewers)"
    tertiary: "E-commerce Sellers (Shopee, Lazada)"
    
  wow_moments:
    - "One prompt → Full TikTok video with Vietnamese voiceover"
    - "Upload product photo → 10 lifestyle scenes in 30 seconds"
    - "Paste competitor URL → AI writes better copy"
    - "Type brand name → Full social media kit generated"

# ═══════════════════════════════════════════════════════════════════════════
# 🎯 SPRINT GOAL
# ═══════════════════════════════════════════════════════════════════════════

goal: |
  Build the Marketing Workspace that makes Vietnamese SMEs say "ĐỈU!"
  
  DEMO SCENARIO (The "Mì Tôm" Demo):
  1. User uploads 1 product photo (a bánh mì)
  2. AI generates: 10 lifestyle backgrounds, 1 TikTok script, 
     1 Facebook post, 1 Zalo story, Vietnamese voiceover audio
  3. User clicks "Publish Kit" → Downloads everything as ZIP
  4. Total time: Under 60 seconds
  
  THIS IS THE WOW MOMENT WE ARE BUILDING.

# ═══════════════════════════════════════════════════════════════════════════
# 🚀 WOW FEATURES (The "Gói Gia Vị" / Flavor Packets)
# ═══════════════════════════════════════════════════════════════════════════

wow_features:
  feature_1:
    id: "ONE_CLICK_CAMPAIGN"
    name: "Chiến Dịch Một Chạm (One-Click Campaign)"
    tagline: "1 photo → Full marketing kit"
    wow_factor: 10
    demo_time: "60 seconds"
    outputs:
      - "10 product lifestyle photos (AI backgrounds)"
      - "1 TikTok video script (15-30s format)"
      - "1 Facebook post (with emojis, hashtags)"
      - "1 Zalo story caption"
      - "1 Vietnamese voiceover audio file"
      - "ZIP download of all assets"
    tech_stack:
      image: "Gemini 2.5 Pro Vision + Flux/Replicate"
      text: "Gemini 2.5 Flash"
      voice: "Google Cloud TTS Vietnamese"
      
  feature_2:
    id: "PRODUCT_STAGE"
    name: "Sân Khấu Sản Phẩm (Product Stage)"
    tagline: "Your product, anywhere in the world"
    wow_factor: 9
    demo_time: "10 seconds"
    description: |
      Upload a product photo → AI removes background → 
      Choose from 50+ Vietnamese-relevant scenes:
      - Quán cà phê Sài Gòn
      - Bàn ăn gia đình
      - Bãi biển Đà Nẵng
      - Văn phòng startup
      - Tet holiday setup
    tech_stack:
      segmentation: "SAM 2 (Segment Anything) or Replicate"
      inpainting: "Flux Schnell for speed"
      
  feature_3:
    id: "COPY_THIEF"
    name: "Ăn Cắp Ý Tưởng (Idea Thief)"
    tagline: "Paste competitor URL, get better copy"
    wow_factor: 9
    demo_time: "15 seconds"
    description: |
      Paste any Facebook/TikTok/Shopee URL →
      AI analyzes: tone, hooks, CTAs, hashtags →
      Generates 3 variations that are BETTER
    ethics: "We steal ideas, not content. All output is original."
    tech_stack:
      scraping: "Playwright headless"
      analysis: "Gemini 2.5 Pro"
      generation: "Gemini 2.5 Flash"
      
  feature_4:
    id: "VOICE_CLONE"
    name: "Giọng Đọc AI (AI Voice)"
    tagline: "Vietnamese voiceover in seconds"
    wow_factor: 8
    demo_time: "5 seconds"
    description: |
      Type or paste script → Choose voice (Bắc/Nam/Huế accents) →
      Download MP3 for TikTok/Reels
    voices:
      - "Giọng Bắc - Nữ (Northern Female)"
      - "Giọng Nam - Nam (Southern Male)"
      - "Giọng trẻ GenZ (GenZ Young)"
    tech_stack:
      tts: "Google Cloud TTS Vietnamese"
      fallback: "OpenAI TTS (multilingual)"
      
  feature_5:
    id: "HASHTAG_WIZARD"
    name: "Phù Thủy Hashtag"
    tagline: "Viral hashtags, auto-generated"
    wow_factor: 7
    demo_time: "3 seconds"
    description: |
      Analyzes your content → Returns:
      - 5 trending hashtags (pulled from TikTok VN)
      - 5 niche hashtags (for discovery)
      - 3 branded hashtags (suggestions)
    tech_stack:
      trends: "Tavily/Exa real-time search"
      generation: "Gemini 2.5 Flash"


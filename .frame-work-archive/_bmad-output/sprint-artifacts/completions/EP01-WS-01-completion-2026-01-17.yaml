problem_statement: |
  Workspace switching destroyed user data. All 6 workspace routes wrote to
  single global useWorkspaceStore, causing cross-workspace contamination
  when users switched between Notes, IDE, Study, Knowledge, Marketing,
  and Settings workspaces.

solution_summary: |
  Created workspace-scoped store factory with composite keys [workspaceId+projectId].
  Each workspace gets isolated Zustand store instance, preventing data contamination
  across workspaces. Implemented facade pattern for backward compatibility.


problem_statement: |
  The Chat Flow (Cascade Chat) has these issues:
  
  1. **Conversation Store Facade** (P0): 495-line facade mixing multiple concerns.
  
  2. **Direct getState() Violations** (P1): 47 instances of direct store access
     instead of using hooks/selectors.
  
  3. **Memory Leaks** (P1): Event subscriptions not properly cleaned up.
  
  4. **AgentChatPanel God Component** (P1): 685 lines with 8 responsibilities.


    - id: "SYM-02"
      description: "Select folder → bounces to Notes (wrong navigation)"
      severity: "P0"
      root_causes: ["FSA-002", "ROUTE-003", "STATE-002"]
      
    - id: "SYM-03"
      description: "Notes can't create new project (only browser-mode)"
      severity: "P0"
      root_causes: ["PLAT-002"]
      
    - id: "SYM-04"
      description: "Desktop still shows browser DB choice"
      severity: "P0"
      root_causes: ["PLAT-001", "PLAT-004"]
      
    - id: "SYM-05"
      description: "IDE files not loading, Monaco blank"
      severity: "P0"
      root_causes: ["FSA-001", "FSA-003", "FSA-007", "STATE-002"]
      
    - id: "SYM-06"
      description: "Terminal loading forever"
      severity: "P1"
      root_causes: ["WebContainer boot issue - separate epic"]
      
    - id: "SYM-07"
      description: "Getting kicked out randomly"
      severity: "P0"
      root_causes: ["ROUTE-003", "STATE-002", "STATE-003"]
      
    - id: "SYM-08"
      description: "Editing bounces to browser DB"
      severity: "P1"
      root_causes: ["PLAT-002", "STATE-003"]
      
    - id: "SYM-09"
      description: "No code syntax highlighting in Notes"
      severity: "P2"
      root_causes: ["BlockNote config - separate issue"]

  infection_count:
    total: 31
    by_domain:

# ═══════════════════════════════════════════════════════════════════════════════
# WORK UNITS (Not Stories - Unified Remediation)
# ═══════════════════════════════════════════════════════════════════════════════

work_units:

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 1: FSA HANDLE UNIFICATION (Team B)
  # ─────────────────────────────────────────────────────────────────────────────
  
  WU-FSA-01:
    title: "Delete duplicate FSA handle managers"
    team: "B"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    
    infections_targeted:
      - FSA-009  # 3 different handle managers
      
    files_to_modify:
      delete:
        - path: "src/lib/filesystem/fsa-handle-manager.ts"
          archive_to: "_bmad-ext/.archive/fsa-handle-manager-2026-01-17.ts"
          
    acceptance_criteria:
      - "Only `HandlePersistenceService` exists for FSA handle storage"
      - "All imports updated to use HandlePersistenceService"
      - "TypeScript: 0 errors"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "grep -r 'fsa-handle-manager' src/ returns 0 results"
        - "pnpm tsc --noEmit passes"

  WU-FSA-02:
    title: "Implement Chrome 129 handle storage"
    team: "B"
    priority: "P0"
    estimated_hours: 3
    status: "PENDING"
    depends_on: ["WU-FSA-01"]
    
    infections_targeted:
      - FSA-001  # handle as any throws DataCloneError
      - FSA-003  # stores handleData: null
      - FSA-004  # trySilentRestore prompts user
      
    files_to_modify:
      modify:
        - path: "src/infrastructure/filesystem/handle-persistence.ts"
          changes:
            - "Add canStoreHandleInIndexedDB() feature detection"
            - "Store actual handle when Chrome 129+ detected"
            - "Implement true silent restore (no showDirectoryPicker on restore)"
            
    acceptance_criteria:
      - "Feature detection for structured clone support"
      - "Handle stored in IndexedDB (not null)"
      - "Silent restore from stored handle works"
      - "Fallback: only prompt if handle truly unavailable"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Create project, refresh page, navigate to IDE"
        - "Files load WITHOUT folder picker prompt"
        - "Console shows: '[HandlePersistenceService] Silent restore successful'"
        
    test_script: |
      1. Clear IndexedDB
      2. Go to /ide
      3. Select folder
      4. Verify files load
      5. Refresh page (Cmd+R)
      6. EXPECTED: Files load without prompt
      7. ACTUAL: [Team B fills this]

  WU-FSA-03:
    title: "Add FSA handle to ProjectContext"
    team: "B"
    priority: "P0"
    estimated_hours: 2
    status: "PENDING"
    depends_on: ["WU-FSA-02"]
    
    infections_targeted:
      - FSA-006  # Factory requires handle not available
      - FSA-007  # No handle in ProjectContext
      
    files_to_modify:
      modify:
        - path: "src/lib/workspace/ProjectContext.tsx"
          changes:
            - "Add `directoryHandle: FileSystemDirectoryHandle | null` to context"
            - "Restore handle on mount for FSA projects"
            - "Pass handle to StorageGatewayFactory"
            
    acceptance_criteria:
      - "ProjectContext provides handle to children"
      - "StorageGatewayFactory receives handle from context"
      - "No duplicate handle restoration calls"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "React DevTools shows handle in ProjectContext value"
        - "IDELayout receives handle via context"

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 2: STATE SCOPING (Team B)
  # ─────────────────────────────────────────────────────────────────────────────
  
  WU-STATE-01:
    title: "Fix IDE store hydration to use current projectId"
    team: "B"
    priority: "P0"
    estimated_hours: 2
    status: "PENDING"
    depends_on: ["WU-FSA-03"]
    
    infections_targeted:
      - STATE-002  # Hydrates "most recent" not "current"
      
    files_to_modify:
      modify:
        - path: "src/infrastructure/persistence/stores/ide/useIDEStore.ts"
          changes:
            - "Hydrate state for projectId from URL, not 'last used'"
            - "Add projectId to persist key: `ide-state-{projectId}`"
            
    acceptance_criteria:
      - "Open Project A: shows A's file tabs"
      - "Open Project B in new tab: shows B's file tabs (not A's)"
      - "No cross-contamination between projects"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Open /ide/project-a, open files"
        - "Open /ide/project-b in new tab"
        - "Verify project-b shows its own files, not project-a's"

  WU-STATE-02:
    title: "Move workspace store from localStorage to Dexie"
    team: "B"
    priority: "P0"
    estimated_hours: 2
    status: "PENDING"
    depends_on: ["WU-STATE-01"]
    
    infections_targeted:
      - STATE-003  # localStorage leak, no project scope
      
    files_to_modify:
      modify:
        - path: "src/infrastructure/persistence/stores/workspace/workspace-store.ts"
          changes:
            - "Replace localStorage with Dexie storage"
            - "Add projectId to composite key"
            
    acceptance_criteria:
      - "Workspace state persists per-project in Dexie"
      - "localStorage key 'workspace-state' no longer used"
      - "Project switch loads correct workspace state"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Application > Local Storage: 'workspace-state' NOT present"
        - "Application > IndexedDB: workspace state visible per project"

  WU-STATE-03:
    title: "Fix project-crud-slice to persist actual handle"
    team: "B"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-FSA-02"]
    
    infections_targeted:
      - STATE-011  # Calls persistHandle(null)
      
    files_to_modify:
      modify:
        - path: "src/infrastructure/persistence/stores/project/project-crud-slice.ts"
          changes:
            - "Pass actual handle to persistHandle(), not null"
            - "Ensure handle is passed from FolderPickerDialog through creation flow"
            
    acceptance_criteria:
      - "After project creation, handle is in db.fsaHandles"
      - "Handle restoration works on next visit"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Create new project via folder picker"
        - "Check IndexedDB: fsaHandles table has entry with handle data"

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 3: ROUTE STANDARDIZATION (Team A)
  # ─────────────────────────────────────────────────────────────────────────────
  
  WU-ROUTE-01:
    title: "Add platform guard to ide.tsx base route"
    team: "A"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    
    infections_targeted:
      - ROUTE-001  # No beforeLoad platform guard
      
    files_to_modify:
      modify:
        - path: "src/routes/ide.tsx"
          changes:
            - "Add beforeLoad with getPlatformContract() check"
            - "Redirect mobile to /notes with reason parameter"
            
    acceptance_criteria:
      - "Mobile user visiting /ide gets redirected to /notes"
      - "Desktop user sees project selector"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Chrome DevTools mobile emulation: /ide redirects to /notes"
        - "Desktop: /ide shows project selector"

  WU-ROUTE-02:
    title: "Remove double-fetch from ide.$projectId.tsx"
    team: "A"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-ROUTE-01"]
    
    infections_targeted:
      - ROUTE-003  # Double fetch (beforeLoad + loader)
      
    files_to_modify:
      modify:
        - path: "src/routes/ide.$projectId.tsx"
          changes:
            - "Remove project fetch from beforeLoad (keep platform check only)"
            - "Use loader for project data only"
            
    acceptance_criteria:
      - "Project fetched once in loader"
      - "beforeLoad only checks platform (no data fetch)"
      - "No race conditions on navigation"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Console shows single '[IDERoute.loader]' message, not double"
        - "Navigation to project is instant (no retry loops)"

  WU-ROUTE-03:
    title: "Remove temp project from desktop IDE flow"
    team: "A"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-ROUTE-01"]
    
    infections_targeted:
      - PLAT-001  # Temp project shown on desktop
      
    files_to_modify:
      modify:
        - path: "src/routes/ide.tsx"
          changes:
            - "Remove 'Quick IDE (Temp Project)' button on desktop"
            - "Desktop sees ONLY: 'Select Project Folder' and 'Browse Projects'"
            
    acceptance_criteria:
      - "Desktop /ide shows 2 buttons only"
      - "No temp project option on desktop"
      - "Mobile still gets temp project (via redirect to notes)"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Desktop /ide: No 'Temp Project' button visible"
        - "Only 'Select Project Folder' and 'Browse Projects' shown"

  WU-ROUTE-04:
    title: "Use TanStack Router Outlet pattern in ide.tsx"
    team: "A"
    priority: "P1"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-ROUTE-02"]
    
    infections_targeted:
      - ROUTE-002  # Uses window.location not Outlet
      
    files_to_modify:
      modify:
        - path: "src/routes/ide.tsx"
          changes:
            - "Remove window.location.pathname check"
            - "Use Outlet component for child route rendering"
            
    acceptance_criteria:
      - "Child routes render via Outlet"
      - "No direct window.location checks"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "grep 'window.location' src/routes/ide.tsx returns 0 results"

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 4: PLATFORM CONTRACT ENFORCEMENT (Team A)
  # ─────────────────────────────────────────────────────────────────────────────
  
  WU-PLAT-01:
    title: "Add project picker to Notes for desktop"
    team: "A"
    priority: "P0"
    estimated_hours: 2
    status: "PENDING"
    depends_on: ["WU-ROUTE-01"]
    
    infections_targeted:
      - PLAT-002  # Notes hardcoded browser-mode only
      
    files_to_modify:
      modify:
        - path: "src/routes/notes.lazy.tsx"
          changes:
            - "Check getPlatformContract()"
            - "Desktop: show project picker or recent projects"
            - "Mobile: continue with browser-mode"
            
    acceptance_criteria:
      - "Desktop /notes: can create/select FSA project"
      - "Mobile /notes: uses browser-mode (IndexedDB)"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Desktop /notes: project picker or list shown"
        - "Mobile /notes: browser-mode auto-created"

  WU-PLAT-02:
    title: "Add platform checks to WorkspaceSwitcher and sidebar"
    team: "A"
    priority: "P1"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-PLAT-01"]
    
    infections_targeted:
      - ROUTE-007  # WorkspaceSwitcher no platform validation
      - PLAT-003   # Sidebar bypasses platform checks
      
    files_to_modify:
      modify:
        - path: "src/presentation/components/common/WorkspaceSwitcher.tsx"
          changes:
            - "Filter out IDE option on mobile"
        - path: "src/presentation/components/layout/MainSidebar.tsx"
          changes:
            - "Hide IDE nav item on mobile"
            
    acceptance_criteria:
      - "Mobile: IDE not visible in switcher or sidebar"
      - "Desktop: all workspaces visible"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Mobile emulation: IDE not in sidebar"
        - "Mobile emulation: WorkspaceSwitcher has no IDE option"

  WU-PLAT-03:
    title: "Fix Hub navigation to use canAccessIDE only"
    team: "A"
    priority: "P1"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-PLAT-02"]
    
    infections_targeted:
      - ROUTE-006  # Double-checks FSA + canAccessIDE
      
    files_to_modify:
      modify:
        - path: "src/presentation/components/hub/HubHomePage.tsx"
          changes:
            - "Remove storageType === 'fsa' check"
            - "Use canAccessIDE only for IDE navigation"
            
    acceptance_criteria:
      - "Desktop users navigate to IDE regardless of storage type"
      - "Mobile users navigate to Notes"
      
    validation_by_gatekeeper:
      required: true
      checks:
        - "Desktop with FSA project: clicks card → goes to /ide"
        - "Desktop with IndexedDB project: clicks card → goes to /ide"
        - "Mobile: clicks card → goes to /notes"

  # ─────────────────────────────────────────────────────────────────────────────
  # PHASE 5: VERIFICATION (Both Teams + Gatekeeper)
  # ─────────────────────────────────────────────────────────────────────────────
  
  WU-VERIFY-01:
    title: "TypeScript verification"
    team: "BOTH"
    priority: "P0"
    estimated_hours: 0.5
    status: "PENDING"
    depends_on: ["ALL_PREVIOUS"]
    
    acceptance_criteria:

  WU-VERIFY-03:
    title: "User symptom verification"
    team: "GATEKEEPER"
    priority: "P0"
    estimated_hours: 1
    status: "PENDING"
    depends_on: ["WU-VERIFY-02"]
    
    acceptance_criteria:
      - "All 9 user symptoms resolved"
      
    test_checklist:
      SYM-01:
        test: "Desktop /ide shows NO temp project option"
        status: "PENDING"

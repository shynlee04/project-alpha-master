      - "AC1: Create file-loader-slice.ts (~100 lines) for project loading"
      - "AC2: Create file-ops-slice.ts (~120 lines) for CRUD operations"
      - "AC3: Create storage-adapter-slice.ts (~80 lines) for adapter management"
      - "AC4: useWorkspaceFileSystem.ts becomes orchestrator only (<150 lines)"
      - "AC5: All slices use useShallow for selectors"
      - "AC6: Zero regression in existing functionality"
    
    technical_requirements:

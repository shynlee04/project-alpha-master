# ═══════════════════════════════════════════════════════════════════════════
# PROBLEM STATEMENT
# ═══════════════════════════════════════════════════════════════════════════

problem_statement: |
  The Project Space (Desktop FS vs Browser DB) has critical architectural issues:
  
  1. **God Store** (P0): `useWorkspaceFileSystem.ts` is 571 lines mixing:
     - Project loading logic
     - File operations (CRUD)
     - Dexie queries
     
  2. **No Storage Abstraction** (P0): Components directly import FSA or IDB adapters.
     There's no unified StorageAdapter interface in the domain layer.
     
  3. **Multiple Dexie Databases** (P0): Data is fragmented across:
     - ViaGentDatabase (main)
     - FlashcardDB (separate)
     - StudyDB (separate)
     
  4. **Domain→Infrastructure Import** (P0): `unified-file-crud.ts:31` violates
     Clean Architecture by importing from infrastructure layer.
     
  5. **Sync Without Content Hash** (P1): `bidirectional-sync-core.ts:144`
     only compares lastModified, not content hashes.


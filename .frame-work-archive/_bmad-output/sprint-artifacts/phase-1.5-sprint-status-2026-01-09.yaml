e2e_testing:
  module: "_bmad/modules/integration-testing"
  manifest: "_bmad/modules/integration-testing/MANIFEST.md"
  api_keys_config: "_bmad/modules/integration-testing/config/api-keys-prod.yaml"
  status: "ENFORCED"
  last_updated: "2026-01-09T08:40:00+07:00"
  
  philosophy:
    - "NO MOCKS: All tests use real APIs and real browsers"
    - "Production Keys: User-provided keys with quota tracking"
    - "Full User Journeys: Complete end-to-end testing"
    - "Screenshot Evidence: Every step captured for validation"
    - "Gate Verification: Core functionality over specific assertions"

  api_keys_available:
    gemini:
      key_status: "ACTIVE"
      primary_model: "gemini-3-pro-preview"
      fallback_model: "gemini-3-flash-preview"
      minimum_model: "gemini-2.5-flash"
      daily_quota: 1000
      daily_budget_usd: 10.0
    openrouter:
      key_status: "ACTIVE"
      coding_model: "mistralai/devstral-2512:free"
      multimodal_model: "mistralai/mistral-small-3.1-24b-instruct:free"
      daily_quota: 500
      tier: "FREE"

  browser_matrix:
    - browser: "Chromium"
      priority: "P0"
      status: "REQUIRED"
    - browser: "Firefox"
      priority: "P0"
      status: "REQUIRED"
    - browser: "WebKit (Safari)"
      priority: "P1"
      status: "RECOMMENDED"

  e2e_test_cases:
    phase_1_5_validation:
      description: "Validate all Phase 1.5 stories with real browser tests"
      
      test_P1_5_01:
        name: "Gemini Model Selection E2E"
        story: "P1.5-01"
        steps:
          - "Navigate to /notes"
          - "Open agent configuration"
          - "Verify Gemini dropdown shows 'gemini-2.5-flash' as default"
          - "Change model to 'gemini-2.5-pro-latest'"
          - "Verify selection persists after page refresh"
        api_key_required: "gemini"
        real_api_call: true
        
      test_P1_5_02:
        name: "Notes File Tree CRUD E2E"
        story: "P1.5-02"
        steps:
          - "Navigate to /notes"
          - "Verify file tree appears in sidebar"
          - "Click 'New File' button"
          - "Enter file name 'test-note.md'"
          - "Verify file appears in tree"
          - "Right-click → Rename to 'renamed-note.md'"
          - "Right-click → Delete (confirm dialog)"
          - "Verify file removed from tree"
        api_key_required: null
        real_api_call: false
        
      test_P1_5_03:
        name: "BlockNote Custom Blocks E2E"
        story: "P1.5-03"
        steps:
          - "Navigate to /notes"
          - "Create new note"
          - "Insert image block via slash command /image"
          - "Verify image block renders with input fields"
          - "Insert code block via slash command /code"
          - "Verify syntax highlighting active"
          - "Drag file from sidebar to editor"
          - "Verify file attachment block created"
        api_key_required: null
        real_api_call: false
        
      test_P1_5_04:
        name: "Notes 3-Pane Reactivity E2E"
        story: "P1.5-04"
        steps:
          - "Navigate to /notes"
          - "Click on Note A in sidebar"
          - "Verify editor shows Note A content (< 500ms)"
          - "Click on Note B in sidebar"
          - "Verify editor shows Note B content without stale data"
          - "Verify no console errors during transitions"
        api_key_required: null
        real_api_call: false
        performance_threshold_ms: 500
        
      test_P1_5_05:
        name: "AI Slash Commands E2E"
        story: "P1.5-05"
        steps:
          - "Navigate to /notes"
          - "Create new note with text 'Hello World'"
          - "Select text → Type / to open slash menu"
          - "Verify AI commands visible (summarize, expand, rewrite)"
          - "Click 'Summarize' command"
          - "Verify AI response appears (REAL API call)"
          - "Verify response is not mock data"
        api_key_required: "gemini"
        real_api_call: true

  gate_verification_pattern:
    description: |
      Use Gate Verification Pattern from integration-testing module:
      Phase 1: Core Gates (must all pass)
        - HTTP status < 400
        - No "Maximum update depth exceeded" errors
        - No WSOD (White Screen of Death)
      Phase 2: Specific Assertions (can fail without blocking)
        - UI element visibility
        - Exact text matching
    
    core_gates:
      - gate: "HTTP_OK"
        assertion: "response.status() < 400"
        blocking: true
      - gate: "NO_REACT_ERRORS"
        assertion: "text='Maximum update depth exceeded' NOT visible"
        blocking: true
      - gate: "NO_WSOD"
        assertion: "body has visible content"
        blocking: true

  troubleshooting_reference:
    file: "_bmad/modules/integration-testing/MANIFEST.md#3-e2e-testing-troubleshooting"
    common_pitfalls:
      - issue: "DevTools False Positive Detection"
        solution: "Disable @tanstack/devtools-vite in vite.config.ts during E2E"
      - issue: "Semantic Selector Mismatch"
        solution: "Use text-based selectors, not h1/h2/h3"
      - issue: "Firefox Timeout Issues"
        solution: "Use generous timeouts for Firefox"

  enforcement_rules:
    - "All Phase 1.5 stories MUST have corresponding E2E test"
    - "E2E tests MUST use real API keys from api-keys-prod.yaml"
    - "NO MOCKS allowed for AI functionality tests"
    - "Screenshot evidence required for UI-related tests"
    - "Gate Verification Pattern must pass before specific assertions"
    - "Tests must run in at least 2 browsers (Chromium + Firefox)"

  test_execution_command: |
    # From project root:
    npx playwright test --project=chromium --project=firefox
    
    # With headed mode for debugging:
    npx playwright test --headed --project=chromium

  artifacts_location:

### 2. NoteRecord Types

| Property | Value |
|----------|-------|
| **Type Name** | `NoteRecord` |

**Locations:**

| File | Layer | Field Difference |
|------|-------|------------------|
| `src/infrastructure/persistence/dexie-db-knowledge-types.ts` | Infrastructure | `blocks: unknown[]` |
| `src/lib/notes/types.ts` | Lib/Presentation | `blocks: Block[]` |

**Analysis:**
- Both define same fields: id, projectId, workspaceId, title, emoji, blocks, parentId, isFavorite, order, isIndexed, indexedAt, createdAt, updatedAt
- Only difference: `unknown[]` vs `Block[]` (Block is from @blocknote/core)
- Lib version is just a convenience wrapper for presentation layer
- Infrastructure version is the **canonical persistence type**

**Verdict:** CAN ARCHIVE `lib/notes/types.ts`
**Reason:** Presentation layer should import from infrastructure and convert Block[] to unknown[] if needed


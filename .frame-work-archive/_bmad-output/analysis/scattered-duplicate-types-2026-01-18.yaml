### 3. Flashcard Types

| Property | Value |
|----------|-------|
| **Type Name** | `Flashcard` |

**Locations:**

| File | Layer | Fields |
|------|-------|--------|
| `src/domain/entities/study.ts` | Domain | deckId, front, back, status, nextReview, interval, easeFactor |
| `src/lib/knowledge/types.ts` | Lib/Archived | sourceId, setId, srsData (simplified) |
| `src/infrastructure/persistence/dexie-db-study-types.ts` | Persistence | workspaceId, projectId, question, answer, difficulty, topic |
| `src/infrastructure/persistence/stores/flashcard/flashcard-db.ts` | Persistence | Same as above (NO workspaceId) |

**Analysis:**
- **Domain version**: Full SRS entity with learning metadata
- **Lib version**: Archived stub, simplified for knowledge module
- **Persistence versions**: Record types for IndexedDB storage (different from domain entity)
- Dexie-DB has `workspaceId`, Flashcard-DB doesn't (per ARC-D02)

**Verdict:** ARCHITECTURALLY CORRECT
- Domain vs Persistence are intentionally different (entity vs record pattern)
- Lib version is deprecated/archived - can be removed


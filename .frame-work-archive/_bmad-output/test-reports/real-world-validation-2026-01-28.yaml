# ==============================================================================
# INVESTIGATION 1: Grid Ratio Problem
# ==============================================================================
  
  investigation_1_grid:
    actual_grid_columns: |
      48px 48px minmax(200px, 320px) 1fr minmax(250px, 400px) 48px
    spec_ratio: "0.5:0.5:2:4:2.5:0.5"
    matches_spec: PARTIAL
    
    analysis: |
      The CSS grid uses PIXEL values (48px) not fractional ratios (0.5).
      
      SPEC says: 0.5 : 0.5 : 2 : 4 : 2.5 : 0.5 (total 10 parts)
      ACTUAL says: 48px : 48px : minmax(200px,320px) : 1fr : minmax(250px,400px) : 48px
      
      On a 1920px wide screen:
      - Spec ratio 0.5/10 = 5% = 96px (but CSS has 48px)
      - Spec ratio 2/10 = 20% = 384px (but CSS has max 320px)
      - Spec ratio 4/10 = 40% = 768px (CSS has 1fr - flexible, correct)
      - Spec ratio 2.5/10 = 25% = 480px (but CSS has max 400px)
      
    issues:
      - issue: "Fixed 48px columns don't scale with viewport"
        evidence: "workspace-layout.css:35-40"
        severity: MEDIUM
      - issue: "minmax constraints (200-320px, 250-400px) cap plugin panels below spec"
        evidence: "workspace-layout.css:37-39"
        severity: MEDIUM
      - issue: "On screens > 1600px, layout will be LEFT-heavy (fixed px + minmax caps)"
        evidence: "No flexible ratio system, just min/max"
        severity: MEDIUM
        
    root_cause: |
      The implementation uses PIXEL-BASED GRID, not RATIO-BASED GRID.
      This works reasonably on ~1280-1440px screens but deviates on larger displays.
      
    recommendation: |
      If spec requires true ratios, change CSS to:
      grid-template-columns: 0.5fr 0.5fr 2fr 4fr 2.5fr 0.5fr;
      But this may break at small screens. Current approach is SAFE but not SPEC-COMPLIANT.

# ==============================================================================
# INVESTIGATION 2: Black Rectangle Problem (CRITICAL)
# ==============================================================================
  
  investigation_2_black_rectangle:
    suspected_cause: "FloatingPluginDocker z-index AND position:fixed without proper constraints"
    
    evidence:
      - file: "FloatingPluginDocker.tsx:66-68"
        problem: |
          DEFAULT_POSITION calculates position based on window dimensions:
          x: window.innerWidth - 304
          y: window.innerHeight - 280
          
          If window dimensions are 0 or undefined during SSR/hydration,
          this can result in NEGATIVE or INVALID positions.
          
      - file: "FloatingPluginDocker.css:27-28"
        problem: |
          position: fixed;
          z-index: var(--z-docker, 1000);
          
          z-index of 1000 is EXTREMELY HIGH (debug level is 100).
          This will render ABOVE everything including modals.
          
      - file: "FloatingPluginDocker.tsx:331-334"
        problem: |
          style={{
            left: position.x,
            top: position.y,
          }}
          
          No bounds checking - if x/y become negative or exceed viewport,
          the element renders OUTSIDE visible area or creates a large overlay.
          
      - file: "$projectId.tsx:219"
        problem: |
          isFloatingDockerOpen STATE is false by default.
          BUT if isOpen=false, the component returns null (line 325).
          
          THIS MEANS: The black rectangle is NOT from FloatingPluginDocker
          when it's closed. Must be from ANOTHER source.
          
    additional_suspects:
      - file: "PluginDocker.css:280-284"
        problem: |
          @media (max-width: 767px) - on MOBILE:
          position: absolute;
          z-index: var(--z-modal, 50);
          
          If media query fires incorrectly or Docker has no content,
          it might create an empty positioned element.
          
      - file: "BottomSheet.css:17-27"
        problem: |
          Backdrop: position: fixed; z-index: 50
          Content: position: fixed; z-index: 51
          
          If BottomSheet is rendered but stuck open, it creates a backdrop.
          
    likely_root_cause: |
      The "giant black rectangle at bottom-right" is most likely:
      1. FloatingPluginDocker with INCORRECT INITIAL POSITION (if opened)
      2. OR a PluginDocker on mobile with absolute positioning rendering empty
      3. OR a backdrop/overlay from BottomSheet or Modal stuck open
      
      NEED BROWSER DEVTOOLS to confirm which element is causing this.
      
    severity: CRITICAL
    fix_needed: |
      1. Ensure FloatingPluginDocker bounds are ALWAYS within viewport
      2. Reduce z-index to reasonable value (60 max, not 1000)
      3. Add visibility check for empty Docker panels
      4. Debug with browser DevTools to identify actual culprit element


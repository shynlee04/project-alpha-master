spike_architecture_analysis:
  metadata:
    analyzed_date: "2026-01-17"
    analyzer: "deep-scan-architecture-scanner"
    scan_target: "/Users/apple/Documents/coding-projects/project-alpha-master/src/spike/"
    canonical_architecture: "clean-architecture-4-layer"

  # ============================================================================
  # LAYER VIOLATIONS
  # ============================================================================
  layer_violations:
    - severity: "P0"
      type: "layer-inversion"
      location: "src/spike/components/ide/FileTree/FileTree.tsx:47-49"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import { useFileSyncStatusStore } from '@/lib/workspace';
        import { useWorkspaceSync } from '@/infrastructure/persistence/stores/workspace';
      violation: |
        UI component directly imports infrastructure implementation (Zustand store).
        Should use domain interface/abstraction.
      impact: |
        - Presentation layer tightly coupled to Zustand store implementation
        - Cannot swap storage implementation without UI changes
        - Violates Dependency Inversion Principle
      remediation: |
        - Create domain interface for sync status
        - Inject via context/hooks (useProjectContext pattern)
        - Use useSyncStatus() hook that returns domain type

    - severity: "P0"
      type: "layer-inversion"
      location: "src/spike/components/notes/NoteEditor.tsx:66-68"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import type { NoteRecord } from '@/infrastructure/persistence/dexie-db';
        import { useNoteStore, useNoteSaveStatus, useIsNoteIndexing } from '@/lib/notes';
      violation: |
        UI component imports infrastructure type (Dexie) and uses store implementation.
      impact: |
        - Dexie schema changes affect UI code
        - Type dependency on specific IndexedDB implementation
      remediation: |
        - Define NoteRecord in domain layer
        - Create domain service interface for note operations
        - Presentation should depend on abstract domain types only

    - severity: "P0"
      type: "layer-inversion"
      location: "src/spike/components/common/ProjectPickerDialog.tsx:18-25"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import { useLiveQuery } from 'dexie-react-hooks';
        import { db } from '@/infrastructure/persistence/dexie-db';
        import { useProjectStore } from '@/infrastructure/persistence/stores/project/useProjectStore';
        import type { ProjectRecord } from '@/infrastructure/persistence/dexie-db';
      violation: |
        Dialog component uses dexie-react-hooks and directly accesses Dexie DB instance.
      impact: |
        - UI knows about IndexedDB internals
        - Cannot test without IndexedDB polyfill
        - Tight coupling to Dexie schema
      remediation: |
        - Create project repository interface in domain
        - Use useProjects() hook with domain return type
        - Abstract Dexie behind repository implementation

    - severity: "P0"
      type: "layer-inversion"
      location: "src/spike/components/common/FolderPickerDialog.tsx:28-31"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import {
          pickFolder,
          createProjectFromFolder,
          isFSASupported,
          isDesktopPlatform,
        } from '@/lib/workspace/fsa-persistence';
        import { checkFolderOverlap } from '@/infrastructure/filesystem/folder-overlap-service';
      violation: |
        UI component imports infrastructure filesystem services directly.
      impact: |
        - UI depends on FSA implementation details
        - Platform detection logic leaked to presentation
      remediation: |
        - Use getPlatformContract() for platform info
        - Create domain service for folder selection
        - Pass platform contract via context

    - severity: "P0"
      type: "layer-inversion"
      location: "src/spike/components/common/WorkspaceSwitcher.tsx:22-25"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import { useProjectContextSafe, type WorkspaceId } from '@/lib/workspace';
        import type { WorkspaceType } from '@/domain/value-objects/workspace-type';
        import { getPlatformContract } from '@/infrastructure/filesystem/platform-contract';
        import { workspaceTransitionManager } from '@/lib/workspace/workspace-transition-manager';
      violation: |
        UI component imports platform contract and transition manager directly.
      impact: |
        - UI knows platform detection logic
        - Transition orchestration in presentation layer
      remediation: |
        - Create workspace context with platform info pre-processed
        - Expose switchWorkspace() as safe API only
        - Keep platform contract in infrastructure layer

    - severity: "P1"
      type: "layer-inversion"
      location: "src/spike/components/ide/IDELayout.tsx:51-52"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import { useVFSAutoWatch } from '@/infrastructure/persistence/stores/workspace/slices/use-vfs-sync-slice';
      violation: |
        Layout component imports internal slice hook from infrastructure.
      impact: |
        - UI knows about VFS implementation details
        - Slice structure leaked to presentation
      remediation: |
        - Expose useWorkspaceSync() hook with abstracted API
        - Hide internal slice architecture

    - severity: "P1"
      type: "layer-inversion"
      location: "src/spike/components/ide/MonacoEditor.tsx:18-19"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import { useWorkspaceSync } from '@/infrastructure/persistence/stores/workspace';
        import { SyncEditWarning } from '../SyncEditWarning';
      violation: |
        Editor component imports workspace sync infrastructure.
      impact: |
        - Editor knows about sync state implementation
        - Cross-layer dependency
      remediation: |
        - Pass sync status via props from workspace context
        - Use domain interface for sync operations

    - severity: "P1"
      type: "layer-inversion"
      location: "src/spike/components/ide/FileTree/hooks/useFileTreeActions.ts:4-9"
      from_layer: "presentation"
      to_layer: "infrastructure"
      code_snippet: |
        import {
            LocalFSAdapter,
            FileSystemError,
            PermissionDeniedError,
        } from '@/lib/filesystem/local-fs-adapter';
        import { UnifiedStorageAdapter } from '@/lib/filesystem/unified-storage-adapter';
      violation: |
        Hook imports adapter implementations directly.
      impact: |
        - Storage adapter details leaked to UI logic
        - Cannot change adapter without UI changes
      remediation: |
        - Use abstract StorageAdapter interface
        - Get adapter via context/dependency injection

    - severity: "P2"
      type: "domain-pollution"
      location: "src/spike/infrastructure/filesystem/fsa-storage-adapter.ts:275-298"
      from_layer: "infrastructure"
      to_layer: "domain"
      code_snippet: |
        private isTextFile(path: string): boolean {
          const textExtensions = [...];
          const ext = path.substring(path.lastIndexOf('.')).toLowerCase();
          return textExtensions.includes(ext);
        }

        private guessContentType(path: string): string {
          const ext = path.substring(path.lastIndexOf('.')).toLowerCase();
          const types: Record<string, string> = {...};
          return types[ext] || 'application/octet-stream';
        }
      violation: |
        Infrastructure adapter contains business logic for file type detection.
      impact: |
        - Business rules duplicated across adapters
        - Text file detection not centralized in domain
      remediation: |
        - Move file type detection to domain service
        - Adapter should only transport, not decide

    - severity: "P2"
      type: "domain-pollution"
      location: "src/spike/infrastructure/filesystem/platform-contract.ts:55-120"
      from_layer: "infrastructure"
      to_layer: "domain"
      code_snippet: |
        function detectFSASupport(): boolean {...}
        function detectWebContainerSupport(): boolean {...}
        function detectDeviceType(): DeviceType {...}
        function determineStorageType(deviceType, hasFSA): StorageType {...}
      violation: |
        Infrastructure layer contains complex detection algorithms.
      impact: |
        - Platform detection logic should be domain decision
        - Multiple places with similar detection code
      remediation: |
        - Create PlatformDetectionService in domain layer
        - Infrastructure implements detection strategies


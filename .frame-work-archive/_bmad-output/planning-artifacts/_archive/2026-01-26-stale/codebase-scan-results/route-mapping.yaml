# Route Mapping - TanStack Router Navigation
# Generated: 2026-01-07
# Scanner: Codebase Analysis Agent
# Scope: src/routes/

route_structure:
  router_type: "TanStack Router with file-based routing"
  route_generation: "Auto-generated (src/routeTree.gen.ts)"
  total_routes: 25+

root_routes:
  - path: __root.tsx
    component: RootLayout
    purpose: "Root layout with providers and error boundaries"
    outlets:
      - WorkspaceSwitcher
      - CrossWorkspaceFileReference
    children:
      - All child routes

workspace_routes:
  ide:
    - path: ide.$projectId.tsx
      component: IDEWorkspace
      params:
        - projectId: string
      purpose: "IDE workspace with code editor, terminal, file tree"
      layout_components:
        - IDELayoutMain
        - MobileIDELayout
      features:
        - Monaco editor with code editing
        - XTerm terminal
        - File tree explorer
        - Agent chat panel
        - Preview panel
      status: PRODUCTION_READY
      health_score: 9/10

    - path: ide.tsx
      component: IDEHome
      purpose: "IDE home page (project selection redirect)"
      status: PRODUCTION_READY

  knowledge:
    - path: knowledge.$projectId.lazy.tsx
      component: KnowledgePage (lazy-loaded)
      params:
        - projectId: string
      purpose: "Knowledge workspace with RAG, collections, synthesis"
      layout_components:
        - KnowledgePage
      features:
        - Source import (PDF, URL, text)
        - RAG pipeline configuration
        - Knowledge collections
        - Vector search
        - Knowledge synthesis
        - Flashcard/quiz generation
      status: PRODUCTION_READY
      health_score: 8/10

    - path: knowledge.lazy.tsx
      component: KnowledgeHome (lazy-loaded)
      purpose: "Knowledge home page"
      status: PRODUCTION_READY

  notes:
    - path: notes.$projectId.lazy.tsx
      component: NotesPage (lazy-loaded)
      params:
        - projectId: string
      purpose: "Notes workspace with block editor, RAG search"
      layout_components:
        - NotesPage
      features:
        - Block-based note editor (@blocknote/core)
        - Note tree navigation
        - AI slash commands
        - Voice recording
        - Markdown import/export
        - Multi-modal import
        - RAG search within notes
      status: PRODUCTION_READY
      health_score: 7/10

    - path: notes.lazy.tsx
      component: NotesHome (lazy-loaded)
      purpose: "Notes home page"
      status: PRODUCTION_READY

  study:
    - path: study.$projectId.lazy.tsx
      component: StudyPage (lazy-loaded)
      params:
        - projectId: string
      purpose: "Study workspace with quizzes, flashcards"
      layout_components:
        - StudyPage
      features:
        - Quiz taking
        - Flashcard review
        - Study statistics
        - Study file picker
      status: PRODUCTION_READY
      health_score: 8/10

    - path: study.lazy.tsx
      component: StudyHome (lazy-loaded)
      purpose: "Study home page"
      status: PRODUCTION_READY

  workspace_generic:
    - path: workspace/$projectId.tsx
      component: WorkspaceRouter
      params:
        - projectId: string
      purpose: "Generic workspace router (redirects to specific workspace)"
      status: PRODUCTION_READY

    - path: workspace/index.tsx
      component: WorkspaceIndex
      purpose: "Workspace index page"
      status: PRODUCTION_READY

project_management_routes:
  - path: projects.tsx
    component: ProjectsPage
    purpose: "Project management page (create, open, delete projects)"
    features:
      - Project list
      - Create project dialog
      - Project settings
    status: PRODUCTION_READY

  - path: hub.tsx
    component: HubPage
    purpose: "Hub/home page with activity dashboard and project picker"
    features:
      - Activity line chart
      - Recent projects
      - Quick actions
      - Mobile project selector
    status: PRODUCTION_READY
    health_score: 8/10

configuration_routes:
  - path: agents.tsx
    component: AgentsPage
    purpose: "Agent configuration and management"
    features:
      - Agent list
      - Create/edit agent dialog
      - Workspace permissions
      - Tool permissions
      - Provider configuration
    status: PRODUCTION_READY
    health_score: 9/10

  - path: settings.tsx
    component: SettingsPage
    purpose: "Application settings"
    features:
      - General settings
      - Provider settings
      - Agent settings
      - Workspace settings
      - Import/export settings
    status: PRODUCTION_READY

utility_routes:
  - path: index.tsx
    component: HomePage
    purpose: "Landing page / redirect to hub"
    status: PRODUCTION_READY

  - path: about.tsx
    component: AboutPage
    purpose: "About page"
    status: PRODUCTION_READY

  - path: about.lazy.tsx
    component: AboutPage (lazy-loaded)
    purpose: "About page (lazy version)"
    status: PRODUCTION_READY

  - path: debug.tsx
    component: DebugPage
    purpose: "Debug page for development"
    status: DEVELOPMENT_ONLY

  - path: test-fs-adapter.tsx
    component: TestFSAdapter
    purpose: "Test file system adapter"
    status: TESTING_ONLY

  - path: test-error-boundary.tsx
    component: TestErrorBoundary
    purpose: "Test error boundary"
    status: TESTING_ONLY

api_routes:
  - path: webcontainer.$.tsx
    component: WebContainerAPI
    purpose: "WebContainer API endpoint handler"
    status: PRODUCTION_READY

navigation_patterns:
  workspace_switching:
    implementation: "WorkspaceSwitcher component"
    location: "src/presentation/components/common/WorkspaceSwitcher.tsx"
    store: "src/infrastructure/persistence/stores/workspace/useWorkspaceSwitching.ts"
    pattern: "Dropdown switcher with icon badges"

  project_switching:
    implementation: "ProjectPickerDialog component"
    location: "src/presentation/components/hub/ProjectPickerDialog.tsx"
    pattern: "Modal dialog with project list"

  breadcrumbs:
    implementation: "Breadcrumbs component"
    location: "src/presentation/components/ui/breadcrumbs.tsx"
    pattern: "Hierarchical breadcrumb navigation"

routing_gaps:
  missing_routes:
    - description: "No dedicated /sync route for file sync status"
      impact: "Users must access sync status from IDE sidebar"
      recommendation: "Create /sync.$projectId route for sync management"
      priority: "P2"

    - description: "No /analytics route for analytics dashboard"
      impact: "Analytics component exists but no dedicated route"
      recommendation: "Create /analytics.$projectId route"
      priority: "P3"

    - description: "No /collaboration route for real-time collaboration"
      impact: "Collaboration components exist but no dedicated route"
      recommendation: "Create /collaboration.$projectId route when feature is ready"
      priority: "P3"

  route_organization:
    issue: "Mixed organization (some routes have .lazy, some don't)"
      impact: "Inconsistent loading patterns"
      recommendation: "Standardize on lazy loading for all workspace routes"
      priority: "P2"

lazy_loading:
  strategy: "TanStack Router lazy route components"
  implementation: ".lazy.tsx file extension"
  benefits:
    - "Reduced initial bundle size"
    - "Faster initial page load"
    - "Code splitting by workspace"

  lazy_loaded_routes:
    - knowledge.$projectId.lazy.tsx
    - knowledge.lazy.tsx
    - notes.$projectId.lazy.tsx
    - notes.lazy.tsx
    - study.$projectId.lazy.tsx
    - study.lazy.tsx
    - about.lazy.tsx

  non_lazy_routes:
    - ide.$projectId.tsx (frequently accessed, no lazy loading)
    - hub.tsx (landing page)
    - projects.tsx (project management)
    - agents.tsx (configuration)
    - settings.tsx (configuration)

route_params:
  projectId:
    type: "string"
    used_in:
      - ide.$projectId.tsx
      - knowledge.$projectId.lazy.tsx
      - notes.$projectId.lazy.tsx
      - study.$projectId.lazy.tsx
      - workspace/$projectId.tsx
    purpose: "Identify which project to open"
    validation: "Checked against project store"

navigation_components:
  primary:
    - WorkspaceSwitcher
    - ProjectPickerDialog
    - MainSidebar
    - IconSidebar

  secondary:
    - Breadcrumbs
    - CommandPalette (Ctrl+P)
    - QuickActionsMenu

  mobile:
    - MobileIDELayout
    - MobileTabBar
    - MobileProjectSelector

routing_integrations:
  stores:
    - "useWorkspaceSwitching (workspace switching state)"
    - "useProjectStore (project selection state)"
    - "navigation-store (navigation history)"

  events:
    - "WORKSPACE_CHANGED (emitted on workspace switch)"
    - "PROJECT_STATE_CHANGE (emitted on project switch)"

  components:
    - "WorkspaceSwitcher (workspace selector)"
    - "HubHomePage (project selection)"
    - "ProjectPickerDialog (quick project switch)"

route_performance:
  initial_load: "Fast (<2s) - Only root + hub loaded"
  workspace_switch: "Fast (<500ms) - Lazy loading works well"
  project_switch: "Fast (<300ms) - State updates efficient"

  optimization_opportunities:
    - "Preload frequently accessed workspaces (IDE)"
    - "Add route transitions/spinners"
    - "Implement route-based code splitting for components"

recommendations:
  immediate:
    - "Add /sync.$projectId route for sync management"
    - "Standardize lazy loading across all workspace routes"
    - "Add route transitions for better UX"

  medium_term:
    - "Implement route-based preloading"
    - "Add route guards for permission checks"
    - "Create route-specific error boundaries"

  long_term:
    - "Add analytics route for analytics dashboard"
    - "Consider collaboration route for real-time features"
    - "Implement advanced routing patterns (nested routes, layouts)"

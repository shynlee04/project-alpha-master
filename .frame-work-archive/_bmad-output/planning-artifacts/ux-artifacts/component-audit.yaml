## Component Usage by Workspace

### IDE Workspace (48 components)
- **Editor:** Monaco integration, syntax highlighting
- **Terminal:** xterm.js, command history
- **File Tree:** File navigation, context menu
- **Agent Chat:** ChatPanel, ApprovalOverlay
- **Layout:** ResizablePanel, Dialog, Sheet

### Knowledge Workspace (33 components)
- **Canvas:** Draggable cards, connections
- **Search:** Command palette, filtering
- **Ingestion:** Progress indicators, status
- **RAG:** DatabaseIndexing, EmbeddingProgress
- **Agent:** ChatPanel, StreamingIndicator

### Notes Workspace (19 components)
- **Editor:** BlockNote integration
- **List:** Card components, sorting
- **AI:** Transform menu, enhancements
- **Sync:** SyncStatus, ToolExecution
- **Format:** Toolbar, formatting buttons

### Study Workspace (11 components)
- **Flashcards:** Card flip, rating
- **Quizzes:** Multiple choice, checkbox
- **Progress:** ProgressBar, charts
- **Analytics:** Stats displays, heatmaps
- **Agent:** QuizGeneration, AI tutor


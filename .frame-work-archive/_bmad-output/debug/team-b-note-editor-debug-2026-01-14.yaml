## Solutions (Draft)

### Solution 1: Enhanced Block Validation
```typescript
// Enhanced sanitizeBlocks with AI block support
function sanitizeBlocks(blocks: any[]): any[] {
  return blocks.map(block => ({
    ...sanitizeSingleBlock(block),
    // AI block specific validation
    ...(block.type.startsWith('ai') ? sanitizeAIBlock(block) : {})
  }));
}
```

### Solution 2: Unified Note Data Service
```typescript
// Single source of truth for note data
class NoteDataService {
  getNoteData(noteId: string, workspaceType: 'browser' | 'filesystem') {
    return workspaceType === 'browser' 
      ? this.getFromDexie(noteId)
      : this.getFromFileSystem(noteId);
  }
}
```

### Solution 3: Default Note Pattern
```typescript
// For browser-only users, ensure default_note exists
async function ensureDefaultNote(workspaceId: string) {
  const existing = await dexie.notes.get(workspaceId);
  if (!existing) {
    await dexie.notes.add({
      id: workspaceId,
      name: 'default_note',
      blocks: [],
      createdAt: Date.now()
    });
  }
}
```


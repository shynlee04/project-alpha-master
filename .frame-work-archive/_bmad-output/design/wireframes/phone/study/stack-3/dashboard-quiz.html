<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Via-Gent | Study - Quiz (Phone)</title>
    <link rel="stylesheet" href="../../../styles/global.css">
    <style>
        :root {
            --header-height: 44px;
            --bottom-nav-height: 56px;
        }

        .app-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--study-bg);
        }

        .header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: var(--surface);
            border-bottom: 2px solid var(--structural);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--primary);
        }

        .header-title {
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: var(--primary);
        }

        .main-content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .quiz-panel {
            flex: 1;
            min-height: 0;
            background: var(--study-bg);
            padding: 16px;
        }

        .quiz-progress {
            margin-bottom: 16px;
        }

        .quiz-progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .quiz-progress-label {
            font-size: var(--text-sm);
            color: var(--secondary);
        }

        .quiz-progress-count {
            font-size: var(--text-sm);
            color: var(--action);
            font-weight: var(--font-semibold);
        }

        .quiz-progress-bar {
            height: 8px;
            background: var(--surface);
            border: 2px solid var(--structural);
            border-radius: 0;
            overflow: hidden;
        }

        .quiz-progress-fill {
            height: 100%;
            background: var(--action);
            width: 40%;
        }

        .quiz-card {
            flex: 1;
            min-height: 0;
            background: var(--surface);
            border: 2px solid var(--structural);
            border-radius: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .quiz-question {
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            color: var(--primary);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .quiz-options {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--canvas);
            border: 2px solid var(--structural);
            border-radius: 0;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .quiz-option:hover {
            border-color: var(--action);
        }

        .quiz-option.selected {
            background: var(--surface-active);
            border-color: var(--action);
        }

        .quiz-option.correct {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .quiz-option.incorrect {
            background: var(--error-bg);
            border-color: var(--error);
        }

        .option-marker {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
            border: 2px solid var(--structural);
            border-radius: 0;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--primary);
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
            font-size: var(--text-sm);
            color: var(--primary);
        }

        .quiz-actions {
            margin-top: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--action);
            border: 2px solid var(--action);
            border-radius: 0;
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: white;
            cursor: pointer;
        }

        /* Stats Panel */
        .stats-panel {
            height: 120px;
            flex-shrink: 0;
            background: var(--surface);
            border-top: 2px solid var(--structural);
            padding: 16px;
        }

        .stats-title {
            font-size: var(--text-sm);
            font-weight: var(--font-semibold);
            color: var(--primary);
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--primary);
            margin-bottom: 4px;
        }

        .stat-value.correct {
            color: var(--success);
        }

        .stat-value.incorrect {
            color: var(--error);
        }

        .stat-label {
            font-size: var(--text-xs);
            color: var(--secondary);
        }

        .bottom-nav {
            height: var(--bottom-nav-height);
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: var(--surface);
            border-top: 2px solid var(--structural);
            padding-bottom: env(safe-area-inset-bottom);
            flex-shrink: 0;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 4px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--secondary);
            transition: color 0.15s ease;
        }

        .nav-item.active {
            color: var(--action);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
        }

        .nav-icon svg {
            width: 100%;
            height: 100%;
        }

        .nav-label {
            font-size: 10px;
            font-weight: var(--font-medium);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="header-left">
                <button class="back-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <span class="header-title">Quiz: React Hooks</span>
            </div>
        </header>

        <main class="main-content">
            <div class="panel quiz-panel">
                <div class="quiz-progress">
                    <div class="quiz-progress-header">
                        <span class="quiz-progress-label">Question 4 of 10</span>
                        <span class="quiz-progress-count">40%</span>
                    </div>
                    <div class="quiz-progress-bar">
                        <div class="quiz-progress-fill"></div>
                    </div>
                </div>

                <div class="quiz-card">
                    <div class="quiz-question">Which hook would you use to optimize performance by memoizing a callback function?</div>

                    <div class="quiz-options">
                        <div class="quiz-option" onclick="selectOption(this)">
                            <span class="option-marker">A</span>
                            <span class="option-text">useState</span>
                        </div>
                        <div class="quiz-option" onclick="selectOption(this)">
                            <span class="option-marker">B</span>
                            <span class="option-text">useEffect</span>
                        </div>
                        <div class="quiz-option" onclick="selectOption(this)">
                            <span class="option-marker">C</span>
                            <span class="option-text">useCallback</span>
                        </div>
                        <div class="quiz-option" onclick="selectOption(this)">
                            <span class="option-marker">D</span>
                            <span class="option-text">useContext</span>
                        </div>
                    </div>

                    <div class="quiz-actions">
                        <button class="submit-btn">Submit Answer</button>
                    </div>
                </div>
            </div>

            <div class="panel stats-panel">
                <h3 class="stats-title">Quiz Statistics</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value">2</div>
                        <div class="stat-label">Correct</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value incorrect">1</div>
                        <div class="stat-label">Wrong</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">1</div>
                        <div class="stat-label">Remaining</div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="9"></rect>
                    </svg>
                </span>
                <span class="nav-label">Dashboard</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                    </svg>
                </span>
                <span class="nav-label">Cards</span>
            </button>
            <button class="nav-item active">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    </svg>
                </span>
                <span class="nav-label">Quiz</span>
            </button>
            <button class="nav-item">
                <span class="nav-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                    </svg>
                </span>
                <span class="nav-label">Stats</span>
            </button>
        </nav>
    </div>

    <script>
        function selectOption(element) {
            document.querySelectorAll('.quiz-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
        }
    </script>
</body>
</html>

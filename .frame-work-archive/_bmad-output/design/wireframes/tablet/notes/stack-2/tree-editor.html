<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via-Gent | Notes - Tree Editor</title>
    <link rel="stylesheet" href="../../../styles/global.css">
    <style>
        /* Tablet Notes Layout - Stack 2 */
        .app-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: var(--notes-bg);
        }

        /* Compact Header - 44px */
        .notes-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-3);
            border-bottom: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .menu-toggle {
            padding: var(--space-2);
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            font-size: var(--text-sm);
            color: var(--secondary);
        }

        .breadcrumb-item {
            color: var(--muted);
        }

        .breadcrumb-separator {
            color: var(--muted);
        }

        .breadcrumb-current {
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-3);
            background-color: var(--canvas);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-none);
            min-width: 150px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: var(--text-sm);
            outline: none;
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* Activity Bar - 48px */
        .activity-bar {
            width: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-2) 0;
            border-right: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
        }

        .activity-item {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            border-radius: var(--radius-none);
            cursor: pointer;
            margin-bottom: var(--space-1);
        }

        .activity-item.active {
            color: var(--action);
            border-left: 2px solid var(--action);
            margin-left: -2px;
        }

        .activity-item svg {
            width: 20px;
            height: 20px;
        }

        .activity-spacer {
            flex: 1;
        }

        /* Sidebar - 180px */
        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background-color: var(--surface);
            border-right: var(--border-width) solid var(--border-color);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-2) var(--space-3);
            border-bottom: var(--border-width) solid var(--border-color);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            color: var(--secondary);
            text-transform: uppercase;
        }

        .sidebar-actions {
            display: flex;
            gap: var(--space-1);
        }

        .sidebar-btn {
            padding: var(--space-1);
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        .sidebar-btn:hover {
            color: var(--primary);
        }

        .tree-content {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: var(--space-1);
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-2);
            font-size: var(--text-sm);
            color: var(--secondary);
            cursor: pointer;
            border-radius: var(--radius-none);
        }

        .tree-item:hover {
            background-color: var(--surface-hover);
        }

        .tree-item.selected {
            color: var(--primary);
            background-color: var(--surface-active);
        }

        .tree-item svg {
            width: 16px;
            height: 16px;
        }

        .tree-indent {
            padding-left: var(--space-4);
        }

        .note-item {
            display: flex;
            align-items: flex-start;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .note-item:hover {
            background-color: var(--surface-hover);
        }

        .note-item.selected {
            background-color: var(--surface-active);
        }

        .note-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--action);
        }

        .note-info {
            flex: 1;
            min-width: 0;
        }

        .note-title {
            font-size: var(--text-sm);
            color: var(--primary);
            margin-bottom: 2px;
        }

        .note-preview {
            font-size: var(--text-xs);
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-date {
            font-size: 10px;
            color: var(--muted);
            white-space: nowrap;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }

        /* Editor Panel */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
            background-color: var(--notes-bg);
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2) var(--space-3);
            border-bottom: var(--border-width) solid var(--border-color);
            background-color: var(--surface);
            flex-shrink: 0;
        }

        .toolbar-btn {
            padding: var(--space-1);
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            border-radius: var(--radius-none);
        }

        .toolbar-btn:hover {
            color: var(--primary);
            background-color: var(--surface-hover);
        }

        .toolbar-divider {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            margin: 0 var(--space-1);
        }

        .editor-content {
            flex: 1;
            padding: var(--space-4);
            overflow: auto;
            min-height: 0;
        }

        .editor-title {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary);
            border: none;
            background: transparent;
            width: 100%;
            margin-bottom: var(--space-4);
            outline: none;
        }

        .editor-body {
            font-family: var(--font-prose);
            font-size: var(--text-base);
            line-height: 1.75;
            color: var(--primary);
            border: none;
            background: transparent;
            width: 100%;
            min-height: 300px;
            resize: none;
            outline: none;
        }

        /* Bottom Navigation - 56px */
        .bottom-nav {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
            padding: 0 var(--space-1);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-0-5);
            padding: var(--space-1);
            min-height: 44px;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--action);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        .nav-label {
            font-size: 10px;
        }

        @media (max-width: 1024px) and (min-width: 768px) {
            .sidebar {
                width: 160px;
            }
        }
    </style>
</head>
<body>

    Workspace: Notes
    Stack: 2 interfaces (Tree + Editor)
    Device: Tablet (768px-1024px)
    Language: en

    <div class="app-container">

            </div>
            <div class="header-right">

                </button>
                <button class="activity-item" title="Search">

                    </svg>
                </button>
                <button class="activity-item" title="AI Assistant">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </button>
                <div class="activity-spacer"></div>
                <button class="activity-item" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>

                </button>
            </aside>

            <!-- Sidebar - 180px -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>Notes</span>
                    <div class="sidebar-actions">
                        <button class="sidebar-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <line x1="12" y1="5" x2="12" y2="19"/>
                                <line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                        </button>
                        <button class="sidebar-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="M21 21l-4.35-4.35"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="tree-content">
                    <div class="note-item selected">
                        <div class="note-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            </svg>
                        </div>
                        <div class="note-info">
                            <div class="note-title">Getting Started</div>
                            <div class="note-preview">Welcome to Via-Gent workspace...</div>

                        <div class="note-date">2h ago</div>
                    </div>
                    <div class="note-item">
                        <div class="note-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            </svg>
                        </div>
                        <div class="note-info">

                            <div class="note-preview">Complete API documentation...</div>
                        </div>
                        <div class="note-date">Yesterday</div>
                    </div>
                    <div class="note-item">
                        <div class="note-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            </svg>

                        <div class="note-info">

                            <div class="note-preview">Sprint planning discussion...</div>
                        </div>
                        <div class="note-date">3 days ago</div>
                    </div>
                    <div class="note-item">
                        <div class="note-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            </svg>
                        </div>
                        <div class="note-info">
                            <div class="note-title">Project Ideas</div>
                            <div class="note-preview">Feature brainstorm session...</div>

            </aside>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Editor Panel -->
                <div class="editor-panel">
                    <div class="editor-toolbar">

                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">

                                <circle cx="4" cy="12" r="1" fill="currentColor"/>
                                <circle cx="4" cy="18" r="1" fill="currentColor"/>
                            </svg>
                        </button>
                        <button class="toolbar-btn" title="Link">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">

                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>

                        </button>
                        <div class="toolbar-divider"></div>
                        <button class="toolbar-btn" title="AI Generate">

                    <div class="editor-content">
                        <input type="text" class="editor-title" value="Getting Started" placeholder="Note title...">

- **AI Assistance**: Let AI help you expand, summarize, or improve your content
- **File Tree**: Organize your notes in folders
- **Search**: Quickly find any note

## Getting Started

1. Create a new note using the + button
2. Start typing in the editor
3. Use the toolbar for formatting
4. Press Ctrl+S to save

Happy writing!</textarea>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Via-Gent | Study - Tree Dashboard</title>
    <link rel="stylesheet" href="../../../styles/global.css">
    <style>
        /* Tablet Study Layout - Stack 2 */
        .app-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background-color: var(--study-bg);
        }

        /* Compact Header - 44px */
        .study-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-3);
            border-bottom: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }

        .menu-toggle {
            padding: var(--space-2);
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        .header-title {
            font-size: var(--text-lg);
            font-weight: var(--font-bold);
            color: var(--primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        /* Activity Bar - 48px */
        .activity-bar {
            width: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-2) 0;
            border-right: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
        }

        .activity-item {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            border-radius: var(--radius-none);
            cursor: pointer;
            margin-bottom: var(--space-1);
        }

        .activity-item.active {
            color: var(--action);
            border-left: 2px solid var(--action);
            margin-left: -2px;
        }

        .activity-item svg {
            width: 20px;
            height: 20px;
        }

        .activity-spacer {
            flex: 1;
        }

        /* Sidebar - 180px */
        .sidebar {
            width: 180px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            background-color: var(--surface);
            border-right: var(--border-width) solid var(--border-color);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-2) var(--space-3);
            border-bottom: var(--border-width) solid var(--border-color);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            color: var(--secondary);
            text-transform: uppercase;
        }

        .tree-content {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: var(--space-1);
        }

        .tree-item {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-1) var(--space-2);
            font-size: var(--text-sm);
            color: var(--secondary);
            cursor: pointer;
            border-radius: var(--radius-none);
        }

        .tree-item:hover {
            background-color: var(--surface-hover);
        }

        .tree-item.selected {
            color: var(--primary);
            background-color: var(--surface-active);
        }

        .tree-item svg {
            width: 16px;
            height: 16px;
        }

        .tree-indent {
            padding-left: var(--space-4);
        }

        /* Dashboard Content */
        .dashboard-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            padding: var(--space-4);
            overflow-y: auto;
        }

        .welcome-section {
            margin-bottom: var(--space-6);
        }

        .welcome-title {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary);
            margin-bottom: var(--space-2);
        }

        .welcome-subtitle {
            font-size: var(--text-sm);
            color: var(--secondary);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-3);
            margin-bottom: var(--space-6);
        }

        .stat-card {
            display: flex;
            flex-direction: column;
            padding: var(--space-4);
            background-color: var(--surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-none);
            box-shadow: var(--shadow-pixel);
        }

        .stat-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--space-2);
            color: var(--action);
        }

        .stat-value {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--primary);
        }

        .stat-label {
            font-size: var(--text-sm);
            color: var(--secondary);
        }

        /* Topics Grid */
        .section-title {
            font-size: var(--text-lg);
            font-weight: var(--font-bold);
            color: var(--primary);
            margin-bottom: var(--space-3);
        }

        .topics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-3);
        }

        .topic-card {
            display: flex;
            flex-direction: column;
            padding: var(--space-4);
            background-color: var(--surface);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-none);
            box-shadow: var(--shadow-pixel);
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .topic-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-pixel-lg);
            border-color: var(--action);
        }

        .topic-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: var(--space-2);
        }

        .topic-name {
            font-size: var(--text-base);
            font-weight: var(--font-medium);
            color: var(--primary);
            margin-bottom: var(--space-1);
        }

        .topic-progress {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background-color: var(--canvas);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-none);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--action);
        }

        .progress-text {
            font-size: var(--text-xs);
            color: var(--muted);
            min-width: 35px;
        }

        /* Bottom Navigation - 56px */
        .bottom-nav {
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-top: var(--border-width) solid var(--border-color);
            flex-shrink: 0;
            background-color: var(--surface);
            padding: 0 var(--space-1);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-0-5);
            padding: var(--space-1);
            min-height: 44px;
            color: var(--muted);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--action);
        }

        .nav-item svg {
            width: 20px;
            height: 20px;
        }

        .nav-label {
            font-size: 10px;
        }

        @media (max-width: 1024px) and (min-width: 768px) {
            .sidebar {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <!-- Via-Gent Tablet Wireframe
    Workspace: Study
    Stack: 2 interfaces (Tree + Dashboard)
    Device: Tablet (768px-1024px)
    Language: en
    -->
    <div class="app-container">
        <!-- Compact Header - 44px -->
        <header class="study-header">
            <div class="header-left">
                <button class="menu-toggle">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                        <path d="M3 12h18M3 6h18M3 18h18"/>
                    </svg>
                </button>
                <span class="header-title">Study Dashboard</span>
            </div>
            <div class="header-right">
                <button class="btn btn-ghost btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    </svg>
                </button>
                <div class="avatar">S</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Activity Bar - 48px -->
            <aside class="activity-bar">
                <button class="activity-item active" title="Topics">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                </button>
                <button class="activity-item" title="Quiz">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                    </svg>
                </button>
                <button class="activity-item" title="Flashcards">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <line x1="6" y1="8" x2="18" y2="8"/>
                    </svg>
                </button>
                <button class="activity-item" title="Stats">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"/>
                        <line x1="12" y1="20" x2="12" y2="4"/>
                    </svg>
                </button>
                <div class="activity-spacer"></div>
                <button class="activity-item" title="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0"/>
                    </svg>
                </button>
            </aside>

            <!-- Sidebar - 180px -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <span>Topics</span>
                </div>
                <div class="tree-content">
                    <div class="tree-item" style="color: var(--primary); font-weight: var(--font-semibold);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        All Topics
                    </div>
                    <div class="tree-indent">
                        <div class="tree-item selected">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            JavaScript
                        </div>
                        <div class="tree-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            TypeScript
                        </div>
                        <div class="tree-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            React
                        </div>
                        <div class="tree-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            CSS
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                <section class="welcome-section">
                    <h1 class="welcome-title">Welcome back, Student!</h1>
                    <p class="welcome-subtitle">Continue your learning journey. You're making great progress!</p>
                </section>

                <!-- Stats Grid -->
                <section class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                                <polyline points="20 6 9 17 4 12"/>
                            </svg>
                        </div>
                        <div class="stat-value">24</div>
                        <div class="stat-label">Topics Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                                <circle cx="12" cy="12" r="10"/>
                                <polyline points="12 6 12 12 16 14"/>
                            </svg>
                        </div>
                        <div class="stat-value">12h</div>
                        <div class="stat-label">Study Time</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                            </svg>
                        </div>
                        <div class="stat-value">85%</div>
                        <div class="stat-label">Average Score</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <line x1="6" y1="8" x2="18" y2="8"/>
                            </svg>
                        </div>
                        <div class="stat-value">156</div>
                        <div class="stat-label">Flashcards</div>
                    </div>
                </section>

                <!-- Topics Grid -->
                <section>
                    <h2 class="section-title">Your Topics</h2>
                    <div class="topics-grid">
                        <div class="topic-card">
                            <div class="topic-icon">📘</div>
                            <div class="topic-name">JavaScript</div>
                            <div class="topic-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 75%;"></div>
                                </div>
                                <span class="progress-text">75%</span>
                            </div>
                        </div>
                        <div class="topic-card">
                            <div class="topic-icon">📗</div>
                            <div class="topic-name">TypeScript</div>
                            <div class="topic-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 45%;"></div>
                                </div>
                                <span class="progress-text">45%</span>
                            </div>
                        </div>
                        <div class="topic-card">
                            <div class="topic-icon">📙</div>
                            <div class="topic-name">React</div>
                            <div class="topic-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 30%;"></div>
                                </div>
                                <span class="progress-text">30%</span>
                            </div>
                        </div>
                        <div class="topic-card">
                            <div class="topic-icon">📕</div>
                            <div class="topic-name">CSS</div>
                            <div class="topic-progress">
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: 90%;"></div>
                                </div>
                                <span class="progress-text">90%</span>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <!-- Bottom Navigation - 56px -->
        <nav class="bottom-nav">
            <button class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                </svg>
                <span class="nav-label">Topics</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
                </svg>
                <span class="nav-label">Quiz</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                </svg>
                <span class="nav-label">Cards</span>
            </button>
            <button class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="20" x2="18" y2="10"/>
                    <line x1="12" y1="20" x2="12" y2="4"/>
                </svg>
                <span class="nav-label">Stats</span>
            </button>
        </nav>
    </div>
</body>
</html>

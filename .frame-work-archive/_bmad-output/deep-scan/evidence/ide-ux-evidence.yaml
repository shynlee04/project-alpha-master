    keyboard_shortcuts:
      - shortcut: "Ctrl/Cmd+S"
        action: "Save file immediately (skips debounce)"
        documented: true (in code comments, no UI docs)

      - shortcut: "Ctrl/Cmd+Shift+S"
        action: "Open snippet manager"
        documented: true

      - shortcut: "Ctrl/Cmd+Shift+F"
        action: "Format document"
        documented: true

      - shortcut: "Ctrl/Cmd+Shift+E"

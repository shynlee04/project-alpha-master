      - component: "Monaco Editor"
        a11y_support: "good (Monaco built-in)"
        issues:
          - No screen reader announcements for auto-save
          - No announcements for sync errors

      - component: "FileTree Context Menu"
        a11y_support: "limited"
        issues:
          - Keyboard shortcuts shown (F2, ⌫) but not actionable via keyboard
          - No ARIA role="menu"

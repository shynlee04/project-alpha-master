# IDE UX Analysis Evidence
# Generated: 2026-01-20
# Scanner: deep-scan-ux-scanner
# Analysis: Comprehensive IDE user experience, route flows, and lifecycle

ide_ux_analysis:
  route_flow:
    entry_point: "/ide/$projectId route with platform validation"
    navigation_steps:
      - step: 1
        route: "/projects → /ide/$projectId"
        loader: "route beforeLoad + loader"
        loading_state: "Spinner with 'Loading...' text"
        blocking: "true - Route guard blocks until platform validated"
        hydration_time: "Instant (no hydrate at this stage)"

      - step: 2
        route: "/ide/$projectId"
        components_loaded:
          - "ProjectProvider"
          - "WorkspaceProvider"
          - "IDELayout (lazy)"
        initial_file_open: "No file open initially, user must select from file tree"
        editor_ready: "~2-3 seconds (Monaco lazy load + initialization)"

      - step: 3
        action: "User selects file from FileTree"
        operation_flow: |
          1. User clicks file in FileTree
          2. handleFileSelect triggers
          3. File content loaded via StorageGateway
          4. MonacoEditor updates with new content
          5. Editor becomes active file in tab bar
        loading_state: "No loading state - file content assumed cached/fast"
        feedback: "File highlights in FileTree, tab added to editor"

      - step: 4
        action: "User types in Monaco Editor"
        operation_flow: |
          1. Monaco onChange fires
          2. Content updated in pending changes
          3. Dirty state shown (asterisk in tab)
          4. Auto-save triggers after 500ms debounce
        loading_state: "None (real-time typing)"
        feedback: "Tab shows asterisk, content updates immediately"

  loading_states:
    all_loading_states:
      - component: "Route Loader"
        state: "loading"
        visual_indicator: "Spinner with 'Loading...' text (line 99-102)"
        blocking: "true"
        timeout: "None (will hang indefinitely if fails)"
        fallback: "None - should redirect on error"

      - component: "IDELayout (Lazy)"
        state: "loading"
        visual_indicator: "Spinner with 'Loading...' text (line 99-102)"
        blocking: "true"
        timeout: "None"
        fallback: "None"

      - component: "FileTree"
        state: "loading"
        visual_indicator: "Text 'Loading...' (line 251-256)"
        blocking: "true (blocks file tree interaction)"
        timeout: "None"
        fallback: "None (just shows text)"

      - component: "FileTree"
        state: "error"
        visual_indicator: "AlertCircle icon + error message (line 241-248)"
        blocking: "true"
        timeout: "None"
        fallback: "None - user stuck in error state"

      - component: "Monaco Editor"
        state: "loading"
        visual_indicator: "Text 'Loading...' with animate-pulse (line 687-691)"
        blocking: "false (editor container rendered, Monaco loads async)"
        timeout: "None"
        fallback: "Text stays until Monaco loads"

      - component: "XTerminal"
        state: "loading (sync pending)"
        visual_indicator: "Spinner + 'Waiting for sync' overlay (line 273-300)"
        blocking: "false (terminal renders in background)"
        timeout: "30000ms (starts shell anyway after timeout)"
        fallback: "Terminal starts with warning message"

      - component: "XTerminal"
        state: "error (boot failed)"
        visual_indicator: "Red error text in terminal (line 248, 228)"
        blocking: "false (terminal functional, just has error message)"
        timeout: "None"
        fallback: "None - terminal still usable"

      - component: "Mobile IDE Panels (Files, Editor, Preview, Terminal, Chat)"
        state: "loading"
        visual_indicator: "PanelLoadingSkeleton with spinner + 'Loading {panelName}...' (line 68-77)"
        blocking: "true (blocks panel interaction)"
        timeout: "None"
        fallback: "None"

      - component: "Mobile IDE Panels"
        state: "error"
        visual_indicator: "PanelErrorFallback with error text + refresh instruction (line 82-93)"
        blocking: "true (panel unusable)"
        timeout: "None"
        fallback: "User must refresh page"

    blocking_operations:
      - operation: "Route Guard Validation"
        blocks: "IDE route entry"
        duration: "<100ms"
        visual_feedback: "None (blocks at route level, user doesn't see anything)"
        optimization: "Already non-blocking (async redirect)"

      - operation: "Zustand Store Hydration (waitForHydration)"
        blocks: "Route loader from querying Dexie"
        duration: "100-500ms"
        visual_feedback: "Spinner with 'Loading...'"
        optimization: "Could use optimistic hydration - show UI immediately, then re-sync"

      - operation: "IDELayout Lazy Load"
        blocks: "Initial IDE render"
        duration: "~1 second"
        visual_feedback: "Spinner with 'Loading...'"
        optimization: "Preload IDELayout bundle in background"

      - operation: "Monaco Editor Initialization"
        blocks: "Editor interactivity"
        duration: "2-3 seconds"
        visual_feedback: "Text 'Loading...' with pulse animation"
        optimization: "Could preload Monaco worker bundle"

      - operation: "WebContainer Boot"
        blocks: "Terminal functionality"
        duration: "3-5 seconds"
        visual_feedback: "XTerminal overlay with spinner"
        optimization: "Already non-blocking (terminal shows overlay, editor works)"

      - operation: "FSA Sync to WebContainer"
        blocks: "Terminal shell start (but has 30s timeout)"
        duration: "2-10 seconds (depends on project size)"
        visual_feedback: "XTerminal overlay with 'Waiting for sync...'"
        optimization: "Already has 30s timeout fallback"

  lazy_loading:
    lazy_loaded_components:
      - component: "IDELayout"
        loading_strategy: "lazy (React.lazy at route level)"
        loading_time: "~1 second (initial chunk load)"
        fallback: "Spinner with 'Loading...'"
        cache: "true (cached after first load)"

      - component: "Monaco Editor (Mobile only)"
        loading_strategy: "lazy (React.lazy in MobileIDELayout, line 40-42)"
        loading_time: "2-3 seconds (includes Monaco + worker bundle)"
        fallback: "PanelLoadingSkeleton"
        cache: "true (Monaco worker cached)"

      - component: "Preview Panel (Mobile only)"
        loading_strategy: "lazy (React.lazy in MobileIDELayout, line 43-45)"
        loading_time: "<500ms"
        fallback: "PanelLoadingSkeleton"
        cache: "true"

      - component: "Terminal Panel (Mobile only)"
        loading_strategy: "lazy (React.lazy in MobileIDELayout, line 46-48)"
        loading_time: "1-2 seconds"
        fallback: "PanelLoadingSkeleton"
        cache: "true"

      - component: "Chat Panel Wrapper (Mobile only)"
        loading_strategy: "lazy (React.lazy in MobileIDELayout, line 49-51)"
        loading_time: "<500ms"
        fallback: "PanelLoadingSkeleton"
        cache: "true"

      - component: "Monaco Editor (Desktop)"
        loading_strategy: "eager (no lazy load, loaded immediately)"
        loading_time: "N/A"
        fallback: "Text 'Loading...' with pulse animation"
        cache: "true (Monaco worker cached)"

      - component: "FileTree"
        loading_strategy: "eager (rendered with IDELayout)"
        loading_time: "N/A (loads root on mount)"
        fallback: "Text 'Loading...'"
        cache: "false (re-fetches on refreshKey change)"

  hydration_patterns:
    synchronous_hydration:
      - component: "Zustand Workspace Store"
        hydrates_immediately: true
        hydration_content: "Persisted IDE state (open files, active file, panel layouts)"
        blocking: "route loader blocked until hydration completes (waitForHydration)"
        priority: "P0 (blocks initial render)"

      - component: "Project Metadata"
        hydrates_immediately: true
        hydration_content: "Project ID, name, FSA handle, sync settings"
        blocking: "route loader blocked"
        priority: "P0 (blocks initial render)"

      - component: "Platform Contract"
        hydrates_immediately: true
        hydration_content: "Device type, storage type, capabilities"
        blocking: "route guard (beforeLoad) - blocks navigation"
        priority: "P0 (blocks route entry)"

    background_hydration:
      - component: "File Tree Content"
        hydrates_in_background: true
        hydration_content: "File system tree structure"
        non_blocking: "Shows 'Loading...' text, then tree"
        priority: "P1 (user can wait for tree to load)"

      - component: "Monaco Editor File Content"
        hydrates_in_background: true
        hydration_content: "File content when user clicks file"
        non_blocking: "Shows 'Loading...' text in editor"
        priority: "P1 (user waits after selecting file)"

      - component: "WebContainer Shell"
        hydrates_in_background: true
        hydration_content: "Terminal shell environment"
        non_blocking: "Shows overlay, editor works in parallel"
        priority: "P2 (terminal is optional feature)"

      - component: "FSA to WebContainer Sync"
        hydrates_in_background: true
        hydration_content: "Bidirectional file synchronization"
        non_blocking: "Shows overlay, has 30s timeout fallback"
        priority: "P1 (terminal usable without sync)"

  error_handling:
    error_states:
      - error: "Mobile Device Detected"
        trigger: "Platform detection in route guard (deviceType !== 'desktop')"
        user_feedback: "Redirect to /notes/$projectId with 'mobile-not-supported' search param"
        recovery: "Use desktop device with Chrome/Edge/Opera to access IDE"
        logging: "Console warn: '[RouteGuard] IDE access denied on {deviceType}'"

      - error: "Project Not Found"
        trigger: "Dexie query returns null for projectId (line 64-67)"
        user_feedback: "Redirect to /hub"
        recovery: "Select a different project or create new project"
        logging: "Console error: 'Project not found in Dexie: {projectId}'"

      - error: "No Directory Handle (Empty State)"
        trigger: "User opens IDE without selecting folder"
        user_feedback: "FolderOpen icon + 'No folder selected' + 'Open folder to view' text (line 228-238)"
        recovery: "Click 'Open Folder' button to select directory"
        logging: "None (expected state)"

      - error: "File Tree Load Error"
        trigger: "Adapter fails to read directory"
        user_feedback: "AlertCircle icon + error message (line 241-248)"
        recovery: "User must refresh page or reload directory"
        logging: "No visible logging - only shows error message"

      - error: "File Sync Error"
        trigger: "Sync manager fails to sync file"
        user_feedback: "FileTree shows error count in red (line 273-275)"
        recovery: "Click error indicator to retry sync"
        logging: "Console logs from sync manager"

      - error: "Terminal Boot Failed"
        trigger: "WebContainer boot() throws error"
        user_feedback: "Red text in terminal: 'Terminal boot failed: {error}' (line 208, 228, 249)"
        recovery: "None - terminal shows error but may be partially functional"
        logging: "Console error: '[XTerminal] Boot failed: {error}'"

      - error: "Terminal Shell Exit"
        trigger: "Shell process exits"
        user_feedback: "Yellow text in terminal: 'Shell exited with code {code}' (line 141)"
        recovery: "User must restart terminal or refresh"
        logging: "Console log: '[XTerminal] Shell exited'"

      - error: "Monaco Format Error"
        trigger: "Formatter throws error during format"
        user_feedback: "Console error: '[MonacoEditor] Format error: {error}' (line 169, 170)"
        recovery: "None - format just fails, user continues editing"
        logging: "Console error (no UI feedback)"

      - error: "Mobile Panel Error"
        trigger: "Lazy component fails to load"
        user_feedback: "PanelErrorFallback: '{PanelName} Error' + 'Please refresh page to try again' (line 82-93)"
        recovery: "User must refresh page"
        logging: "React Error Boundary logs to console"

      - error: "Permission Denied"
        trigger: "FSA permission lost (permissionState === 'denied')"
        user_feedback: "PermissionOverlay prompts to restore access"
        recovery: "Click 'Restore Access' button to re-grant permission"
        logging: "No visible logging"

      - error: "Permission Prompt"
        trigger: "FSA permission needs user gesture (permissionState === 'prompt')"
        user_feedback: "PermissionOverlay prompts to grant permission"
        recovery: "Click 'Restore Access' button to grant permission"
        logging: "No visible logging"

  responsive_design:
    desktop_layout: |
      VS Code-style layout with:
      - Activity bar (left icons)
      - Collapsible sidebar (FileTree, Search, etc.)
      - Resizable panels (FileTree, Editor, Preview, Terminal, Chat)
      - StatusBar (bottom with sync, agent, cursor position)
      - Full Monaco editor with multiple tabs
      - XTerm terminal panel

    tablet_layout: |
      Same as desktop but:
      - Sidebar collapsed by default (defaultCollapsed={isTablet})
      - Touch-friendly controls
      - Monaco font size: 13px (same as desktop)

    mobile_layout: |
      NEVER USED (blocked by route guard)
      If guard were disabled, would use:
      - Tab-based navigation (Files, Editor, Preview, Terminal, Chat)
      - Single panel visible at a time
      - Bottom tab bar navigation
      - Touch-optimized interactions

    mobile_compatibility:
      monaco_editor: "blocked (route guard prevents access)"
      terminal: "blocked (route guard prevents access)"
      file_tree: "blocked (route guard prevents access)"
      mobile_fallback: |
        **CRITICAL ISSUE**: Route guard redirects mobile users to /notes/$projectId
        BUT MobileCapabilityBanner is still rendered in IDELayout (line 225, 296)
        This is unreachable code - banner can never be shown

        Mobile users get:
        - Redirect to Notes workspace
        - Can see Notes file list and BlockNote editor
        - Cannot access IDE features at all

        Recommendation: Remove MobileCapabilityBanner from IDELayout since it's unreachable


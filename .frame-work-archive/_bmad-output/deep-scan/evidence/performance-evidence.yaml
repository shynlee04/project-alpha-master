# INDEXEDDB TRANSACTION EFFICIENCY

## Current Pattern: Auto-commit Transactions

Each Dexie operation creates its own transaction:
```typescript
// Line 24-28: fsa-handle-helpers.ts
await db.fsaHandles.put({...});  // Auto-commit transaction
```

### Impact
- Overhead for each operation
- No atomicity across related operations

### Recommendation for Batch Operations
```typescript
// Group related operations in transaction
await db.transaction('rw', [db.projects, db.fsaHandles], async () => {
  await db.projects.put(projectRecord);
  await db.fsaHandles.put(handleRecord);
  // Both succeed or both fail
});
```


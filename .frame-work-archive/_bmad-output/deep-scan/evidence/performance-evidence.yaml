### Performance Impact
- **Estimated CPU Overhead:** 0.1-0.5ms per call
- **Call Frequency:** 4-5 times (once per registered store)
- **Total Impact:** 0.4-2.5ms per hydration cycle

### Recommendation
**Priority: P0 - Fix Immediately**

```typescript
// Add cache at class level
private cachedProjectId: string | null = null;
private cachedPathname: string | null = null;

private getProjectIdFromURL(): string | null {
  const pathname = window.location.pathname;
  
  // Return cached value if pathname hasn't changed
  if (this.cachedPathname === pathname && this.cachedProjectId !== null) {
    return this.cachedProjectId;
  }
  
  // Compute
  const match = pathname.match(/\/(ide|study|notes|knowledge)\/([^/]+)/i);
  this.cachedPathname = pathname;
  this.cachedProjectId = match ? match[2] : null;
  
  return this.cachedProjectId;
}
```

### Estimated Improvement
- **Time Saved:** 60-80% reduction in URL parsing overhead
- **Lines to Change:** ~10
- **Risk:** Low


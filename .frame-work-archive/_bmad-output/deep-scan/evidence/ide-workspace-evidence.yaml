  cross_workspace_integration:
    notes_access: "Read-only via EventBus events"
      mechanism: "FileTree subscribes to 'file:created', 'file:modified', 'file:deleted' events (useFileTreeEventSubscriptions)"
      triggers:
        - "Notes workspace creates/modifies/deletes files in shared FSA directory"
        - "IDE FileTree refreshes automatically (line 157)"
      direction: "Notes → IDE (one-way, IDE reads Notes events)"
      data_sharing:
        - "EventBus: 'file:*' events with source='local'"
        - "No direct IDE → Notes data flow (read-only)"

    knowledge_access: "RAG integration via workspace event bus"
      mechanism: "MonacoEditor 'Analyze in Knowledge' context menu action (line 430-453)"
      triggers:
        - "User right-clicks in editor → 'Analyze in Knowledge'"
        - "codeAnalysisBridge.requestCodeAnalysis() called"
        - "RAG pipeline indexes current file"
      direction: "IDE → Knowledge (one-way, IDE triggers Knowledge indexing)"
      data_sharing:
        - "WorkspaceEventEmitter events: no dedicated Knowledge events in IDE"
        - "Code content passed to RAG via codeAnalysisBridge"

    project_access: "Cross-workspace project state sharing via ProjectProvider"
      mechanism: "ProjectProvider wraps all workspace routes (IDE, Notes, Knowledge, Study)"
      state_shared:
        - "project: Project metadata (name, bindings, lastOpened)"
        - "currentWorkspace: Active workspace ID"
        - "enabledWorkspaces: List of enabled workspaces"
        - "fsaHandle: FSA directory handle (for IDE/Notes)"
        - "switchWorkspace(): Navigate without re-loading project"
        - "navigateToWorkspace(): Navigate with options"
      direction: "Bidirectional (all workspaces share project state)"
      data_sharing:
        - "localStorage: Last workspace preference persisted per project"
        - "React Context: ProjectContext provides state to all children"

    workspace_provider_integration: "5 cornerstone stores unified in WorkspaceProvider"
      stores_integrated:
        - "Cornerstone 1: LLM Providers (useAppStore)"
        - "Cornerstone 2: Agent Configuration (useAppStore + agentSelectionStore)"
        - "Cornerstone 3: Conversation/Chat (useConversationStore)"
        - "Cornerstone 4: Project/Filesystem (workspace-store)"
        - "Cornerstone 5: RAG Pipeline (useRAGStore)"
      access_pattern: "All workspaces access same stores via WorkspaceProvider"
      scoping: "Project-scoped state (projectId keys all IDE state)"

    potential_leaks:
      - "EventBus: Global event emitter can receive events from any workspace"
      - "WorkspaceProvider: Stores shared across all workspaces (potential state pollution)"
      - "ProjectProvider: FSA handle persisted across workspaces (handle should be cleared on switch)"

  data_flow_diagrams:
    file_open_flow: |
      Step 1: User clicks file in FileTree
        ↓
      Step 2: FileTree.onFileSelect(path, handle) called
        ↓
      Step 3: IDELayout.handleFileSelect() invoked
        ↓
      Step 4: gatewayRef.current.read(path) - FSA or IDB
        ↓
      Step 5: File content decoded (Uint8Array → string)
        ↓
      Step 6: setFileContentCache(new Map with path + content))
        ↓
      Step 7: addOpenFile(path) - IDE editor slice
        ↓
      Step 8: setActiveFile(path) - Activate in editor
        ↓
      Step 9: MonacoEditor receives new activeFilePath prop
        ↓
      Step 10: Monaco switches editor model (path prop change)
        ↓
      Step 11: Monaco ready (scroll position restored, focus called)
      TOTAL: ~50-200ms

    file_save_flow: |
      Step 1: User edits file in Monaco Editor
        ↓
      Step 2: Monaco onChange event fired (handleEditorChange)
        ↓
      Step 3: Content stored in pendingChangesRef
        ↓
      Step 4: onContentChange(path, content) - Update dirty state
        ↓
      Step 5: Debounce timer started (500ms AUTO_SAVE_DELAY_MS)
        ↓
      Step 6: User stops typing for 500ms
        ↓
      Step 7: Debounce callback triggered
        ↓
      Step 8: onSave(path, pendingContent) called
        ↓
      Step 9: gatewayRef.current.write(path, data) - FSA or IDB
        ↓
      Step 10: FSA/IDB writes to disk/database
        ↓
      Step 11: EventBus.emit('file:modified', { path, source: 'editor' })
        ↓
      Step 12: WebContainerFSAAdapter detects 'file:modified' event
        ↓
      Step 13: WebContainer sync triggered (FSA → WC direction)
        ↓
      Step 14: File synced to WebContainer virtual FS
        ↓
      Step 15: pendingChangesRef.delete(path) - Clear pending change
      TOTAL: ~50-150ms

    terminal_command_flow: |
      Step 1: User types command in XTerminal
        ↓
      Step 2: xterm.js captures keyboard input
        ↓
      Step 3: Terminal adapter writes to shell stdin
        ↓
      Step 4: WebContainer shell process executes command
        ↓
      Step 5: stdout/stderr generated by process
        ↓
      Step 6: Terminal adapter receives output
        ↓
      Step 7: xterm.js writes output to terminal UI
        ↓
      Step 8: EventBus.emit('process:output', { pid, data, type })
        ↓
      Step 9: EventBus.emit('agent:command:executed', { command, output, exitCode })
        ↓
      Step 10: Security rules check (optional): EventBus.emit('security:command:blocked')
        ↓
      Step 11: Process exits: EventBus.emit('process:exited', { pid, exitCode })
      TOTAL: ~10-100ms (depends on command complexity)

    workspace_switch_flow: |
      Step 1: User clicks workspace switcher in header
        ↓
      Step 2: ProjectProvider.switchWorkspace(newWorkspace) called
        ↓
      Step 3: Platform validation: getPlatformContract().canAccessIDE check
        ↓
      Step 4a: If newWorkspace === 'ide' AND canAccessIDE === false
        ↓
      Step 4b: BLOCKED - Console warning, return early
        ↓
      Step 4c: If blocked → No navigation
        ↓
      Step 5: If platform validation passed
        ↓
      Step 6: Navigate({ to: `/${newWorkspace}/$projectId`, params: { projectId } })
        ↓
      Step 7: TanStack Router updates URL
        ↓
      Step 8: Current workspace unmounts (cleanup effects)
        ↓
      Step 9: New workspace route loads (loader runs)
        ↓
      Step 10: persistLastWorkspace(projectId, newWorkspace) - localStorage
        ↓
      Step 11: ProjectProvider updates currentWorkspace state
        ↓
      Step 12: WorkspaceProvider updates workspace-store.currentWorkspace
        ↓
      Step 13: New workspace component mounts
      TOTAL: ~100-300ms

  performance_hotspots:
    blocking_operations:
      - "IDELayout lazy load (~500ms) - Suspense fallback shown"
      - "WebContainer boot (~2-5s) - Blocks terminal start"
      - "File sync initial scan (~1-3s for 1000+ files)"
      - "Monaco editor initialization (~200-500ms first file)"
      - "XTerminal shell start (waits for sync or 30s timeout)"

    expensive_renders:

        - "currentProjectId: Current project ID"
        - "isTransitioning: Workspace transition flag"
      restoration_flow:
        - "WorkspaceProvider initializes from localStorage on mount"
        - "Auto-switch to last workspace if current not enabled (line 340-373)"

  architectural_concerns:
    component_cohesion:
      - "MonacoEditor: Violates SRP (editor, tabs, snippets, formatting, navigation, diff)"
      - "IDELayout: God component (orchestrates 7+ concerns)"
      - "FileTree: Mixed concerns (tree, context menu, dialogs, sync status)"
    state_management:
      - "IDE state scattered across 6+ slices (editor, explorer, layout, terminal, project, selectors)"
      - "No clear state hierarchy (all slices combined via CombinedIDEState type)"
      - "Project-scoped state: Good isolation but complex key management"
    cross_workspace_risks:
      - "EventBus: Global emitter can cause event storms if not properly filtered"
      - "WorkspaceProvider: 5 stores shared across all workspaces (state pollution risk)"
      - "No workspace isolation for EventBus events (all workspaces receive all events)"

  recommendations:
    immediate_actions:
      - "Split MonacoEditor into focused components (<300 lines each)"
        - "EditorCore: Monaco instance and basic editing"
        - "EditorTabs: Tab bar management"
        - "EditorSnippets: Snippet insertion"
        - "EditorFormat: Code formatting"
        - "EditorNavigation: Go to definition, find references"
        - "EditorDiff: Diff mode display"
      - "Extract file operations from FileTree"

# IDE Workspace Lifecycle Analysis
# Generated: 2026-01-20T00:00:00+07:00
# Scanner: deep-scan-workspace-scanner
# Scope: Complete lifecycle from route load to component unmount

ide_lifecycle_analysis:
  route_entry:
    loader: "src/routes/ide.$projectId.tsx (loader at line 53)"
    guards:
      - "requireIDEAccess() - Platform validation (line 28, ADR-033 D12)"
      - "beforeLoad check - Mobile/tablet blocked (line 42)"
    hydration_conditions: "waitForHydration() ensures Zustand store hydration completes before querying Dexie (line 58)"
    blocking_components:
      - "IDELayout lazy load (line 32-36) - Suspense fallback shown"
      - "WebContainer boot (sync complete or timeout 30s)"
      - "XTerminal shell start (waits for initialSyncCompleted flag)"

  lifecycle_stages:
    - stage: "route_load"
      duration: "~500ms-2s (depends on Dexie query and hydration)"
      operations:
        - "1. Platform validation via requireIDEAccess() (desktop-only check)"
        - "2. waitForHydration() - wait for Zustand store hydration"
        - "3. Query Dexie for project metadata (line 62)"
        - "4. Convert record to Project type (line 70)"
        - "5. Navigate to IDE route with projectId"
        - "6. Render ProjectProvider with project and workspace='ide' (line 97)"
      cross_domain_dependencies: []
      blocking_operations: []

    - stage: "component_mount"
      duration: "~100-300ms (layout component mount)"
      operations:
        - "1. IDEWorkspace component mounts (line 82)"
        - "2. Create workspace-scoped store: createWorkspaceStore('ide', _projectId) (line 90)"
        - "3. Set current project in store: setCurrentProject(_projectId) (line 91)"
        - "4. Lazy load IDELayout (lazy() at line 32)"
        - "5. Suspense fallback shows during lazy load"
        - "6. IDELayoutMain component renders"
      cross_domain_dependencies:
        - "ProjectProvider provides cross-workspace context (workspace bindings, switchWorkspace)"
      blocking_operations:
        - "IDELayout lazy load must complete"

    - stage: "ide_layout_init"
      duration: "~200-500ms (layout initialization)"
      operations:
        - "1. Responsive branching: Mobile → MobileIDELayout, Desktop → IDELayout"
        - "2. useIDELayoutState() - initialize all IDE state slices"
        - "3. useIDEKeyboardShortcuts() - register keyboard handlers"
        - "4. useWebContainerBoot() - boot WebContainer (line 127-132)"
        - "5. useIDEFileHandlers() - setup file operations (line 141-154)"
        - "6. useFileTreeEventSubscriptions() - EventBus subscriptions (line 157)"
        - "7. useMonacoEditorEventSubscriptions() - Monaco file event subs (line 160-166)"
        - "8. useVFSAutoWatch() - VFS hot reload for HMR (line 169)"
        - "9. useIDEStateRestoration() - restore IDE state from persistence (line 177-197)"
      cross_domain_dependencies:
        - "WorkspaceProvider - 5 cornerstone stores (providers, agents, conversations, project, RAG)"
      blocking_operations:
        - "WebContainer boot must complete (sync or timeout)"

    - stage: "webcontainer_boot"
      duration: "~2-5s (WebContainer initialization)"
      operations:
        - "1. Boot WebContainer via boot() from @webcontainer/api"
        - "2. Create FSA adapter: createWebContainerFSAAdapter() (IDELayout line 38)"
        - "3. Create IDE file gateway: createIdeFileGateway() (IDELayout line 38)"
        - "4. Mount FSA files to WebContainer at /project"
        - "5. Start bidirectional sync (FSA ↔ WebContainer)"
        - "6. Start dev server (onServerReady event)"
      cross_domain_dependencies: []
      blocking_operations:
        - "FSA handle must be available (from ProjectContext)"
        - "File sync must complete or timeout (30s)"

    - stage: "file_open"
      duration: "~50-200ms (file read + editor switch)"
      operations:
        - "1. User clicks file in FileTree"
        - "2. FileTree emits onFileSelect(path, handle)"
        - "3. handleFileSelect() called (IDELayout handlers)"
        - "4. Gateway reads file: gateway.read(path)"
        - "5. Content decoded and stored in cache (fileContentCache Map)"
        - "6. addOpenFile(path) - add to IDE store (line 102-104)"
        - "7. setActiveFile(path) - activate in editor (line 145)"
        - "8. MonacoEditor receives new activeFilePath prop"
        - "9. Monaco switches model: path prop changes (line 682)"
      cross_domain_dependencies:
        - "Notes workspace: If file in /notes/ folder, Notes file watcher triggers"
        - "Knowledge workspace: RAG index updated for new file"
      blocking_operations:
        - "File must exist in FSA or IndexedDB"
        - "Permission must be granted (for FSA)"

    - stage: "editor_ready"
      duration: "~100-300ms (Monaco model switch + render)"
      operations:
        - "1. Monaco Editor detects path change"
        - "2. Editor switches model to new file (monaco's internal diff)"
        - "3. Auto-save debouncer initialized (AUTO_SAVE_DELAY_MS = 500ms)"
        - "4. Scroll position restored from viewStatesRef (line 219-227)"
        - "5. View state saved before tab switch (line 209-217)"
        - "6. Editor focus() called (line 456)"
      cross_domain_dependencies: []
      blocking_operations:
        - "File content must be loaded"

    - stage: "terminal_start"
      duration: "~100-500ms (terminal init + shell start)"
      operations:
        - "1. XTerminal component mounts"
        - "2. Initialize xterm.js with theme-aware colors (line 96-102)"
        - "3. Create FitAddon for resize handling (line 104-105)"
        - "4. Open terminal in container (line 129)"
        - "5. Create terminal adapter (line 137-147)"
        - "6. Wait for initialSyncCompleted or timeout (30s)"
        - "7. boot() - Boot WebContainer (line 201-245)"
        - "8. adapter.startShell() - Start jsh shell (line 204)"
      cross_domain_dependencies: []
      blocking_operations:
        - "initialSyncCompleted must be true or timeout reached"

    - stage: "file_save"
      duration: "~50-150ms (write + sync trigger)"
      operations:
        - "1. User edits file (Monaco onChange event)"
        - "2. Handle change: handleEditorChange() (line 475-503)"
        - "3. Store pending change in pendingChangesRef"
        - "4. Update dirty state: onContentChange(path, content)"
        - "5. Debounce auto-save (500ms)"
        - "6. Trigger onSave callback: onSave(path, content)"
        - "7. Gateway writes file: gateway.write(path, data)"
        - "8. FSA adapter writes to disk or IndexedDB"
        - "9. EventBus emits 'file:modified' (source: 'editor')"
        - "10. WebContainer sync: incremental sync triggered (via file:modified event)"
        - "11. Clear pendingChangesRef for file"
      cross_domain_dependencies:
        - "Notes workspace: If file in /notes/, Notes file watcher detects change"
        - "Knowledge workspace: RAG index updated for modified file"
        - "FileTree: Refreshes tree on 'file:modified' event (useFileTreeEventSubscriptions)"
      blocking_operations: []

    - stage: "terminal_command"
      duration: "~10-100ms (command execution depends on complexity)"
      operations:
        - "1. User types command in terminal"
        - "2. Terminal adapter writes to shell stdin"
        - "3. shell process executes command (via WebContainer)"
        - "4. stdout/stderr emitted via 'process:output' event"
        - "5. EventBus emits 'agent:command:executed' (line 45 in events.ts)"
        - "6. Security rules check: 'security:command:blocked' event if blocked"
        - "7. Process exits: 'process:exited' event with exit code"
      cross_domain_dependencies:
        - "Knowledge workspace: Commands can trigger RAG indexing"
        - "Notes workspace: Terminal can create/modify notes files"
      blocking_operations:
        - "Command must not be blocked by security rules"

    - stage: "workspace_switch"
      duration: "~100-300ms (navigation + context update)"
      operations:
        - "1. User clicks workspace switcher in header"
        - "2. ProjectProvider.switchWorkspace(newWorkspace) called (line 399-439)"
        - "3. Platform validation: canAccessIDE check (line 416-424)"
        - "4. Navigate to new workspace route (line 431-436)"
        - "5. Persist last workspace to localStorage (line 379-383)"
        - "6. Auto-select last workspace on return (line 340-373)"
        - "7. FSA handle cleared on project change (line 253-257)"
      cross_domain_dependencies:
        - "Notes workspace: Switch triggers Notes context update"
        - "Knowledge workspace: Switch triggers Knowledge context update"
        - "All workspaces: WorkspaceProvider updates currentWorkspace in workspace-store"
      blocking_operations:
        - "New workspace must be enabled in project bindings"

    - stage: "unmount"
      duration: "~50-200ms (cleanup)"
      operations:
        - "1. User navigates away from IDE route"
        - "2. IDELayout unmounts"
        - "3. Cleanup effects run (useEffect returns)"
        - "4. WebContainerFSAAdapter.stopSync() called"
        - "5. Terminal adapter disposed: adapter.dispose() (line 166-177)"
        - "6. Monaco editor cleanup (view states saved in refs)"
        - "7. Event subscriptions unsubscribed"
        - "8. FSA watch stopped (FileSystemObserver or polling)"
        - "9. Workspace state persisted: useIdeStatePersistence cleanup"
        - "10. ProjectProvider unmounts - FSA handle cleared (line 263-268)"
      cross_domain_dependencies: []
      blocking_operations:
        - "All async operations must complete or be cancelled"


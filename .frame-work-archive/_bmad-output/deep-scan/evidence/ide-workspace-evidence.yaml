        - "Issue: Re-renders on every file content change"
        - "Mitigation: React.memo wrapper (line 81), but prop changes still trigger renders"
      - "FileTree: 348 lines, complex hooks, context menu state"
        - "Issue: Re-renders on every file tree refresh"
        - "Mitigation: None - could benefit from virtualization for large trees"
      - "AgentChatPanel: Complex chat state with streaming messages"
        - "Issue: Re-renders on every streaming token"
        - "Mitigation: StreamingMessage component isolated"

    large_bundles:
      - "@monaco-editor/react: ~2MB (editor core)"
      - "@xterm/xterm + @xterm/addon-fit: ~500KB (terminal)"
      - "@webcontainer/api: ~300KB (WebContainer client)"
      - "Combined IDE chunk: ~3-4MB (lazy loaded)"
      - "Optimization: Already lazy loading IDELayout (line 32-36)"

    file_watching_performance:
      - "FileSystemObserver (Chrome 129+): Efficient native API"
        - "Pros: No polling, OS-level events"
        - "Cons: Experimental, limited browser support"
      - "Polling fallback (Chrome <129): 1-second intervals"
        - "Pros: Works everywhere"
        - "Cons: CPU intensive, 1s latency"
      - "WebContainer watch: Virtual FS watcher"
        - "Efficient: In-memory file system"
        - "Bidirectional sync: FSA ↔ WC (both directions watched)"


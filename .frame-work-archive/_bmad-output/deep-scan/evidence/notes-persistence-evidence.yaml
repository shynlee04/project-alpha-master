# Notes Persistence Analysis Evidence
# Generated: 2026-01-20
# Scanner: deep-scan-persistence-scanner
# Scope: Notes workspace persistence, storage patterns, BlockNote sync

dexie_schema:
  notes_table:
    name: notes
    fields: id (UUID), projectId, workspaceId, title, emoji, blocks, parentId, isFavorite, order, isIndexed, indexedAt, createdAt, updatedAt
    indexes: [projectId, workspaceId, order]
    purpose: Stores BlockNote note content with hierarchical organization
    record_count: 10-100 notes per project
    size_estimate: 1-10KB per note

  shared_tables:
    - name: projects
      shared_with: Notes, IDE, Knowledge, Study
      access_pattern: Reads project metadata for context
    - name: fsaHandles
      shared_with: Notes, IDE
      access_pattern: Desktop uses FSA handles for file access

file_operations:
  storage_adapter: Hybrid (Desktop: FSA, Mobile: IndexedDB direct)
  storage_gateway_usage: Partial compliance (Desktop: Yes, Mobile: No - uses Dexie directly)
  note_read_flow: User opens Notes -> Route loader loads project -> NoteCRUDSlice.loadNotes -> Platform detection -> Desktop: Restore FSA handle, create StorageGateway, list /notes/, parse Markdown -> Store in Zustand -> Mobile: Query Dexie notes table -> Store in Zustand
  note_write_flow: User edits note -> onChange triggers updateNote -> Update Zustand -> Persist to Dexie -> triggerAutoSave (2s debounce) -> Desktop: Convert to Markdown, write to FSA, clear dirty flag -> Mobile: Clear dirty flag immediately
  note_delete_flow: User clicks delete -> NoteCRUDSlice.deleteNote -> Remove from Zustand -> Delete from Dexie -> Desktop: Delete .md file -> Mobile: No file deletion

blocknote_sync:
  sync_strategy: Bidirectional (BlockNote <-> Markdown) - Desktop only
  markdown_export: Custom implementation in note-markdown-writer.ts - Generates YAML frontmatter + H1 title + Markdown blocks - File naming: {title}-{id-slice(0,8)}.md
  markdown_import: BlockNote built-in parser (tryParseMarkdownToBlocks) - Reads Markdown, parses YAML frontmatter, extracts H1 title, converts to blocks
  export_debounce: 2000ms (2 seconds) - Implementation: setTimeout in note-sync-slice.ts line 143
  import_strategy: On-demand (not automatic) - Initial import: When FSA directory mounted - Re-import: Manual via importDirectory()
  conflict_detection: NONE - No explicit conflict detection mechanism - No version tracking, no timestamp comparison
  conflict_resolution: N/A - No merge dialog, no conflict UI, no backup/recovery
  external_changes: NONE - No file watching for external Markdown changes

auto_save:
  debounce: 2000ms (2 seconds)
  trigger: After content changes via onChange (BlockNote editor)
  save_strategy: Async debounced to background - Desktop: Write Markdown to FSA, Mobile: Clear dirty flag (already in Dexie)
  conflict_handling: NONE - No conflict handling
  user_feedback: Minimal - dirty flag UI only, toast on import, console.error for errors

configuration_persistence:
  editor_settings: NOT PERSISTED - No editor settings storage
  theme_settings: NOT PERSISTED for Notes - Uses global app theme
  layout_settings: NOT PERSISTED - No sidebar/panel storage
  backup_mechanism: NONE - No automatic backups
  restore_mechanism: NONE - No restore capability

caching_strategy:
  note_cache:
    enabled: true
    location: Zustand Map + Dexie (dual-layer)
    cache_key: note.id string
    cache_invalidation: Manual on project switch or refresh
    cache_size_limit: None (all notes loaded)
  blocknote_state_cache:
    enabled: false
    cached_data: NONE
    issues: Cursor/scroll/selection lost on refresh

cross_workspace_storage:
  shared_handles: PARTIAL - FSA handles shared via fsaHandles table (Desktop only)
  shared_files: NONE - No file sharing between Notes and IDE
  conflict_detection: NONE - No cross-workspace conflict detection
  conflict_resolution: N/A

performance_issues:
  expensive_queries:
    - query: Load all notes from Dexie for project
      file: src/lib/notes/slices/note-crud-slice.ts
      lines: 28-45
      impact: low
      optimization: Already optimized with compound index
    - query: Recursive delete of descendant notes
      file: src/lib/notes/slices/note-crud-slice.ts
      lines: 262+
      impact: medium
      optimization: Consider batch delete
  n_plus1_issues: []
    - No N+1 query issues detected
  blocking_operations:
    - operation: Markdown export (BlockNote to Markdown)
      file: src/infrastructure/sync/workspace-services/notes/note-markdown-writer.ts
      blocking_time: 50-200ms per note
      optimization: Already debounced to 2s
    - operation: Markdown import (Markdown to BlockNote)
      file: src/infrastructure/sync/workspace-services/notes/note-markdown-parser.ts
      blocking_time: 100-500ms per file
      optimization: Consider caching parsed blocks

backup_restore:
  backup_mechanism: NONE
  backup_frequency: N/A
  backup_location: N/A
  restore_mechanism: NONE
  restore_triggers: manual via importDirectory()

storage_gateway_compliance:
  uses_storage_gateway: true
  gateway_methods_used:
    - read: Desktop FSA via NoteGateway.readNote()
    - write: Desktop FSA via NoteFolderBridge.saveNoteToFile() -> LocalFSAdapter.writeFile()
    - list: Desktop FSA via gateway.list('/notes/')
    - delete: Desktop FSA via gateway.delete()
  gateway_violations: PARTIAL - Desktop: COMPLIANT, Mobile: VIOLATION (uses Dexie directly)
  gateway_compliance_score: 75% (Desktop: 100%, Mobile: 0%)

critical_gaps:
  conflict_resolution:
    issue: No conflict detection or resolution mechanism
    severity: high
    impact: Data loss if user edits same file externally
    recommendation: Implement last-write-wins with timestamp comparison, show conflict dialog
  cross_workspace_synchronization:
    issue: No coordination between Notes and IDE workspaces
    severity: medium
    impact: Inconsistent state if user edits notes in both workspaces
    recommendation: Implement shared event bus or file watching
  editor_state_persistence:
    issue: No editor state persistence (cursor, scroll, selection)
    severity: medium
    impact: Poor UX - state lost on page refresh
    recommendation: Persist editor state to Dexie or localStorage
  external_file_watching:
    issue: File watching setup but no external change handling
    severity: medium
    impact: External Markdown edits not reflected in Notes
    recommendation: Implement file watcher callback to reload notes
  backup_recovery:
    issue: No backup or recovery mechanism
    severity: medium
    impact: No safety net for data loss
    recommendation: Implement automatic backups or version history

adr_033_compliance:
  platform_contract: COMPLIANT - Uses getPlatformContract() for storage type detection
  storage_gateway_usage: PARTIALLY COMPLIANT - Desktop: COMPLIANT, Mobile: VIOLATION
  storage_adapter_usage: COMPLIANT - Desktop: FSAGateway, Mobile: Dexie directly
  file_location: COMPLIANT - Desktop: /notes/*.md, Mobile: Dexie notes table
  notes_structure: COMPLIANT - Markdown files with YAML frontmatter, BlockNote blocks in Dexie

investigation_summary:
  total_files_scanned: 25
  total_lines_analyzed: ~3000
  findings:
    - Dexie schema well-defined with proper indexing
    - StorageGateway compliance for desktop (partial for mobile)
    - Bidirectional BlockNote <-> Markdown sync implemented
    - Auto-save with 2s debounce functional
    - Missing: Conflict detection/resolution
    - Missing: Cross-workspace synchronization
    - Missing: Editor state persistence
    - Missing: Backup/recovery mechanism
    - Missing: External file change handling
  recommendations:
    - Implement conflict detection with last-write-wins or merge dialog
    - Add editor state persistence (cursor, scroll, selection)
    - Implement external file watching for Markdown changes
    - Add backup/version history mechanism
    - Consider StorageGateway for mobile IndexedDB (for consistency)
    - Add cross-workspace synchronization via shared event bus

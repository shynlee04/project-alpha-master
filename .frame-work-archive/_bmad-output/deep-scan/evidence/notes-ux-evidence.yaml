# Notes UX Analysis Evidence
# Generated: 2026-01-20
# Scanner: deep-scan-ux-scanner
# Scope: Notes Workspace (routes/notes.*.tsx + components/notes/)

notes_ux_analysis:
  route_flow:
    entry_point: "/projects hub → /notes/$projectId"

    navigation_steps:
      - step: 1
        route: "/hub → /notes/$projectId"
        loader: "TanStack Router loader (async)"
        loading_state: "No explicit skeleton - page waits on loader"
        blocking: "YES - loader blocks route rendering"
        hydration_time: "Estimated 100-300ms (Dexie query + hydration wait)"

      - step: 2
        route: "/notes/$projectId (component rendering)"
        components_loaded: ["ProjectProvider", "NotesPage", "NoteSidebar"]
        initial_note_open: "No automatic note open - user must select from sidebar or create new"
        editor_ready: "NoteEditor renders after note selected - BlockNote initializes with sanitized blocks"

      - step: 3
        action: "user selects or creates note"
        operation_flow: "NoteSidebar.onNoteSelect → setActiveNote → NoteEditor renders BlockNote"
        loading_state: "BlockNote sanitizes blocks before rendering (can add 50-200ms)"
        feedback: "No explicit loading indicator - BlockNote renders immediately with sanitized blocks"

      - step: 4
        action: "user edits note"
        operation_flow: "BlockNote onChange → debouncedSave(500ms) → updateNote → store.saveNoteToFile (2s debounce)"
        loading_state: "saveStatus: 'saving' → 'saved' (shown in status bar)"
        feedback: "Status bar shows 'Saving...' → 'Saved' (color change yellow → green)"

  loading_states:
    all_loading_states:
      - component: "Route loader"
        state: "loading"
        visual_indicator: "None - browser default loading or previous page until data loads"
        blocking: "true"
        timeout: "No timeout (browser-managed)"
        fallback: "Redirect to /hub if project not found"

      - component: "Project context loading"
        state: "loading"
        visual_indicator: "Spinner (8x8px border-4 border-primary with animate-spin)"
        location: "NotesPage.tsx:92-99"
        blocking: "false - renders centered spinner while waiting"
        timeout: "None - waits indefinitely for project context"

      - component: "Auto-import files"
        state: "loading"
        visual_indicator: "Full-screen overlay with spinner, progress bar, file counter"
        location: "NotesPage.tsx:648-676 (mobile), 777-804 (desktop)"
        blocking: "true - covers entire UI with backdrop"
        timeout: "30 seconds (Promise.race timeout)"
        fallback: "Shows error toast on timeout, imports partial results"

      - component: "BlockNote editor initialization"
        state: "loading (implicit)"
        visual_indicator: "None - renders empty paragraph immediately"
        location: "NoteEditor.tsx:689-692"
        blocking: "true - sanitizes blocks before rendering"
        timeout: "None - but block corruption detection forces remount on errors"

      - component: "AI block generation"
        state: "loading"
        visual_indicator: "BlockLoadingOverlay - spinner, command name, typing indicator, token counter, elapsed time"
        location: "BlockLoadingOverlay.tsx:27-35, 150-211"
        blocking: "true - covers individual block with backdrop"
        timeout: "None - but shows elapsed time after 3 seconds"

      - component: "Save status"
        state: "saving / saved / error"
        visual_indicator: "Status bar text with color-coded states (yellow=saving, green=saved, red=error)"
        location: "NoteEditor.tsx:873-919, NoteEditor.css:61-93"
        blocking: "false - non-blocking indicator in toolbar"
        timeout: "None - persists until next save"

      - component: "Indexing notes for RAG"
        state: "loading"
        visual_indicator: "NotesIndexingButton shows spinner"
        location: "NotesIndexingButton.tsx:137"
        blocking: "false"
        timeout: "None"

    blocking_operations:
      - operation: "Route loader"
        blocks: "Page rendering - no content shown until Dexie query completes"
        duration: "Estimated 100-300ms"
        visual_feedback: "None (browser default loading)"
        optimization: "Could add skeleton loader during route transition"

      - operation: "Auto-import project files"
        blocks: "Full UI - covers entire workspace with overlay"
        duration: "Varies by file count (1-30s, 30s timeout)"
        visual_feedback: "Spinner + progress bar + file name + percentage"
        optimization: "Already optimized - runs in background after notes loaded"

      - operation: "BlockNote initialization"
        blocks: "Editor content - sanitizes blocks before rendering"
        duration: "Estimated 50-200ms for large notes"
        visual_feedback: "None"
        optimization: "Could show skeleton during sanitization"

      - operation: "AI block generation"
        blocks: "Individual block - overlay covers single block"
        duration: "Varies (2-30s depending on AI response)"
        visual_feedback: "Comprehensive (spinner + typing indicator + token counter + elapsed time)"
        optimization: "Good - non-blocking for other blocks"


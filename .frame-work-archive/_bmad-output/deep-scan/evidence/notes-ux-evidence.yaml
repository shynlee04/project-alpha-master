        hydration_content: "Sanitized blocks from note (or empty paragraph)"
        blocking: "Blocks editor content rendering until sanitization complete"
        priority: "P0"
        location: "NoteEditor.tsx:465-685 (initialContent useMemo + sanitizeBlocks)"

      - component: "NoteSidebar"

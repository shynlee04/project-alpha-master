        severity: "P2"
        suggested_fix: "Could lazy-load BlockNote if editor rarely used"

      - issue: "No skeleton screen for route transition"
        impact: "Perceived latency - blank screen while loader runs"
        severity: "P1"
        suggested_fix: "Add skeleton loader in route loader or component"


        blocking: "None - sidebar renders immediately"
        priority: "P1"
        location: "NotesPage.tsx:829-858"

    background_hydration:
      - component: "Auto-import files"
        hydrates_in_background: true
        hydration_content: "Project .md files imported into IndexedDB"
        non_blocking: "Shows progress overlay, but allows reading notes"
        priority: "P1"
        location: "NotesPage.tsx:275-350 (useEffect with isNotesSyncReady check)"

      - component: "File sync service initialization"
        hydrates_in_background: true
        hydration_content: "FSA handle storage, file watcher setup"
        non_blocking: "Auto-init in background after route loaded"
        priority: "P1"
        location: "NotesPage.tsx:255-271 (useEffect with autoInitAttemptedRef)"

      - component: "Debounced auto-save to file"
        hydrates_in_background: true
        hydration_content: "Note blocks synced to .md file on disk"
        non_blocking: "2s debounce - non-blocking save to IndexedDB first"
        priority: "P0"
        location: "note-sync-slice.ts:97-143 (2000ms debounce)"

  error_handling:
    error_states:
      - error: "Project not found"
        trigger: "Dexie query returns null for projectId"
        user_feedback: "Redirect to /hub (no error message shown)"
        recovery: "User navigates to hub and selects valid project"
        logging: "Console.error in route loader (line 56-58)"
        location: "notes.$projectId.tsx:55-58"

      - error: "Note not found / no note selected"
        trigger: "NoteEditor receives empty noteId or note not in store"
        user_feedback: "Empty state with 'No note selected' message + Create Note button"
        recovery: "User clicks Create Note or selects from sidebar"
        logging: "None (intentional empty state, not error)"
        location: "NoteEditor.tsx:921-929, NoteEditorEmpty.tsx:1059-1086"

      - error: "Block corruption (ProseMirror node position errors)"
        trigger: "Malformed blocks in note.blocks array (missing id, type, props, or content structure)"
        user_feedback: "Toast error: 'Note corruption detected: X damaged block(s) removed. Note may display incompletely.'"
        recovery: "Auto-removes invalid blocks, forces editor remount with corruptionDetected counter"
        logging: "Console.error with block details and stack trace"
        location: "NoteEditor.tsx:655-675, 978-1008 (ErrorBoundary)"

      - error: "BlockNote render error (ProseMirror crashes)"
        trigger: "ProseMirror errors in BlockNoteView"
        user_feedback: "ErrorBoundary catches error, forces editor remount, shows console error"
        recovery: "Auto-remounts editor with corruptionDetected counter increment"
        logging: "Console.error with ProseMirror error message and stack"
        location: "NoteEditor.tsx:978-1008 (ErrorBoundary)"

      - error: "Markdown sync conflict"
        trigger: "External .md file modified while local editor has unsaved changes"
        user_feedback: "MarkdownSyncConflictDialog with resolution options (Keep Local / Keep External / Defer / Ignore)"
        recovery: "User chooses resolution: Keep Local (overwrite file), Keep External (reload from file), Defer (ask later), Ignore (skip)"
        logging: "Console.log in dialog resolution handlers"
        location: "MarkdownSyncConflictDialog.tsx:91-328"

      - error: "Auto-import timeout"
        trigger: "File import takes >30 seconds"
        user_feedback: "Toast error: 'Failed to auto-import files' with description 'Import took too long. The folder may be too large or access was denied.'"
        recovery: "User retries import manually via Import button"
        logging: "Console.error with timeout message"
        location: "NotesPage.tsx:322-334"

      - error: "Auto-import failure"
        trigger: "FileSyncService.importDirectory throws error (permission denied, I/O error)"
        user_feedback: "Toast error: 'Failed to auto-import files' with error message"
        recovery: "User retries import manually or checks file permissions"
        logging: "Console.error with full error details"
        location: "NotesPage.tsx:322-334"

      - error: "File sync service initialization error"
        trigger: "NotesFileSyncService initialization fails"
        user_feedback: "SyncStatusPanel shows error state with details"
        recovery: "User retries via File Sync button in sidebar"
        logging: "Console.error in useFileSyncService hook"
        location: "NotesFilePicker.tsx:156-178, 240 (error display)"

      - error: "AI generation failure"
        trigger: "AI API returns error, times out, or returns empty content"
        user_feedback: "Toast error: 'AI generation failed. Please try again.' or specific error message (no API key, no agent selected)"
        recovery: "User retries AI command or configures API key / agent"
        logging: "Console.error with error details and stack"
        location: "AISlashCommand.tsx:201-223"

      - error: "Manual save to file failure"
        trigger: "saveNoteToFile throws error (file locked, permission denied, I/O error)"
        user_feedback: "Toast error: 'Failed to save to file' with error description"
        recovery: "User retries save or checks file permissions"
        logging: "Console.error with error details"
        location: "NoteEditor.tsx:833-846"

    error_recovery_patterns:
      - pattern: "Auto-retry"
        errors: ["Block corruption", "ProseMirror render errors"]
        recovery: "Forces editor remount with corruptionDetected counter"

      - pattern: "User choice"
        errors: ["Sync conflict"]
        recovery: "Shows dialog with resolution options, requires user decision"

      - pattern: "Manual retry"
        errors: ["Import failure", "Save failure", "AI generation failure"]
        recovery: "Shows toast error, user must manually retry action"

      - pattern: "Auto-redirect"
        errors: ["Project not found"]
        recovery: "Redirects to /hub automatically"


    lazy_loaded_components:
      - component: "Notes route"
        loading_strategy: "lazy-loaded via TanStack Router (notes.lazy.tsx)"
        loading_time: "Estimated 50-150ms (chunk download + parse)"
        fallback: "None (uses route loader for data)"
        cache: "Yes - chunk cached after first load"
        location: "src/routes/notes.lazy.tsx"

      - component: "BlockNote editor"

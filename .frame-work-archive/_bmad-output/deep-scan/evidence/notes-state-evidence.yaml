  state_flow_diagrams:
    route_load_flow: |
      1. User navigates to /notes/$projectId
      2. NotesPage component mounts
      3. useEffect reads projectId from route params
      4. Calls useNoteStore.getState().loadNotes(projectId)
      5. loadNotes() fetches notes from Dexie or FSA (based on platform)
      6. Notes stored in Map (O(1) lookup) and Array (for rendering)
      7. If activeNoteId exists in persisted state, note loads in editor

    note_select_flow: |
      1. User clicks note in NoteTree
      2. onClick handler calls setActiveNote(noteId)
      3. setActiveNote() updates activeNoteId in store
      4. NoteEditor receives new noteId via props
      5. useMemo recomputes initialContent from note.blocks
      6. BlockNoteEditor loads note content
      7. Active note highlighted in sidebar

    note_update_flow: |
      1. User edits note in BlockNoteEditor
      2. editor.onChange fires with updated blocks
      3. handleChange debounces updates (100ms)
      4. Calls updateNote({ id: noteId, blocks: newBlocks })
      5. updateNote() updates notes Map and notesArray
      6. Sets dirtyNoteIds.add(noteId)
      7. Calls triggerAutoSave(noteId, note) (cross-slice call)
      8. triggerAutoSave() debounces for 500ms
      9. After debounce, saveNoteToFile() executes
      10. saveNoteToFile() writes to Dexie or FSA

    blocknote_sync_flow: |
      1. BlockNoteEditor maintains in-memory state (blocks, selection, document)
      2. onChange callback fires on every user change
      3. onChange extracts current blocks: editor.document.toBlocks()
      4. Calls updateNote({ id: noteId, blocks: newBlocks })
      5. updateNote() updates Zustand store
      6. Trigger auto-save and indexing in background
      7. No direct BlockNote <-> Zustand persistence (BlockNote is transient)

    file_sync_flow: |
      1. updateNote() calls triggerAutoSave(noteId, note)
      2. triggerAutoSave() clears existing debounce timer
      3. Sets new 500ms debounce timer
      4. After 500ms of no changes:
         a. Gets fileSaveHandler from fileSaveHandlers map (by projectId)
         b. Calls noteFolderBridge.saveNoteToFile(note, gateway)
         c. Gateway converts blocks to markdown via convertBlocksToMarkdown()
         d. Gateway writes to FSA or Dexie (based on platform)
         e. Emits event to sync status panel
         f. Clears dirtyNoteIds set for this note
         g. Updates saveStatus to 'saved'


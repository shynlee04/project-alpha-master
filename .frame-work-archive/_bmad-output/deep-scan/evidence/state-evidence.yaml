path_a_state_flow:
  stage_project_creation:
    stores_initialized:
      - "useProjectStore: Creates project record in memory"
      - "useWorkspaceStore: Sets currentProjectId"
    state_changes:
      - "Project record added to useProjectStore.projects"
      - "activeProjectId set in useProjectStore"
      - "currentProjectId set in useWorkspaceStore"
      - "FSA handle persisted via handlePersistenceService"
      - "Project metadata persisted to Dexie db.projects"
    store_interactions:
      - "project-crud-slice.createProject() calls handlePersistenceService.persistHandle()"
      - "project-utils-slice.updateLastOpened() triggers on create"
      - "No cross-store imports - uses get() for slice communication"

  stage_notes_entry:
    stores_initialized:
      - "useNoteStore: Loads notes for project"
      - "IDE state hydrated from persistence"
    state_changes:
      - "Notes loaded from FSA or IndexedDB based on platform"
      - "currentProjectId set in useNoteStore"
      - "IDE state restored from ideState table (project-scoped)"
      - "SessionStorage updated with projectId for hydration"
    store_interactions:
      - "note-crud-slice.loadNotes() calls useProjectStore.getState() for project metadata"
      - "ide-state-storage.getItem() queries Dexie by projectId"
      - "Event bus emits workspace change events"

  stage_note_usage:
    stores_initialized:
      - "Active note selected in useNoteStore"
      - "Auto-save triggered via note-sync-slice"
      - "IDE editor tracks open files"
    state_changes:
      - "activeNoteId updated in useNoteStore"
      - "dirtyNoteIds set when content changes"
      - "saveStatus changes: idle → saving → saved"
      - "Background indexing triggered for changed notes"
      - "File gateway persists changes to FSA/IndexedDB"
    store_interactions:
      - "note-crud-slice.updateNote() triggers note-sync-slice.triggerAutoSave()"
      - "note-crud-slice.updateNote() triggers note-indexing-slice.triggerIndexing()"
      - "Cross-slice calls via get() to access other slice methods"

path_b_state_flow:
  stage_project_revisit:
    stores_restored:
      - "useProjectStore: Hydrated from Dexie db.projects table"
      - "useWorkspaceStore: Hydrated from Dexie providerConfigs table"
      - "useIDEStore: Hydrated from Dexie ideState table"
    state_loaded_from_cache:
      - "Project metadata restored from db.projects"
      - "Workspace state restored from providerConfigs"
      - "IDE state restored from ideState (project-scoped query)"
    state_reloaded:
      - "FSA handle restored via handlePersistenceService.restoreHandle()"
      - "Requires user interaction if permission expired"
      - "No automatic handle restoration for security"
    handle_restoration:
      - "ide-state-storage.getItem() uses sessionStorage for projectId lookup"
      - "Queries Dexie ideState by projectId (not most recent)"
      - "A-01: FIXED - No cross-project contamination"
      - "SessionStorage tracks current projectId across reloads"

  stage_notes_loading:
    stores_restored:
      - "useNoteStore: Loads notes from storage gateway"
      - "Note gateway determines FSA vs IndexedDB based on platform"
    state_loaded_from_cache:
      - "Note records loaded from FSA /notes/*.md or db.notes"
      - "Note map and array reconstructed"
      - "Active note ID persisted from previous session"
    state_reloaded:
      - "If FSA but no handle: Falls back to IndexedDB (BUG-013 FIX)"
      - "Platform contract determines storage type (desktop=FSA, mobile=IndexedDB)"
    handle_restoration:
      - "NoteGateway.readNote() called for each .md file"
      - "Dexie db.notes.where('projectId').equals() for IndexedDB path"
      - "No cross-store imports - uses gateway abstraction"

  stage_note_rendering:
    stores_restored:
      - "useNoteStore: Active note state ready"
      - "IDE state: Open files and active file restored"
      - "Navigation state: Scroll positions restored"
    state_loaded_from_cache:
      - "Editor content loaded from activeNoteId"
      - "Active file in IDE synced with note selection"
      - "File watcher monitors external changes"
    state_reloaded:
      - "Auto-save debouncing active (500ms)"
      - "Dirty tracking prevents unnecessary saves"
    handle_restoration:
      - "useNoteNavigationStore tracks scroll positions per note"
      - "note-sync-slice manages auto-save trigger"
      - "IDE state persists open files list and active file"


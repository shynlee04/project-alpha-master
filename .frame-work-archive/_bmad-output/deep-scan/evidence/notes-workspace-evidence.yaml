cross_workspace_integration:
  ide_access:
    mechanism: "Cross-workspace event bus (eventBus + FILE_SAVED event)"
    description: |
      Notes workspace listens to FILE_SAVED events from IDE.
      When a markdown file is saved in IDE, Notes refreshes notes list.
      Debounce: 1000ms to prevent infinite loops.
      Location: NotesPage.tsx (lines 436-467) - useStoreEvent(FILE_SAVED)
    flow:
      - "1. User saves .md file in IDE"
      - "2. IDE publishes FILE_SAVED event with payload { workspaceType: 'ide', filePath, ... }"
      - "3. Notes workspace receives event via useStoreEvent"
      - "4. Notes checks if filePath ends with .md or .markdown"
      - "5. If yes, loadNotes(projectId) called to refresh notes"
    limitations:
      - "One-way sync (IDE → Notes)"
      - "No conflict detection if same file edited in both workspaces"
      - "No explicit 'open in IDE' button (unlike Notes → IDE)"

  knowledge_access:
    mechanism: "Cross-workspace event bus (eventBus + NOTES_RAG_INDEX_REQUESTED event)"
    description: |
      Notes workspace emits NOTES_RAG_INDEX_REQUESTED event.
      Knowledge workspace receives and indexes notes for semantic search.
      Knowledge can emit KNOWLEDGE_SYNTHESIS_EXPORT_REQUESTED event.
      Notes workspace receives and creates new note from synthesis content.
    flows:
      notes_to_knowledge:
        - "1. User clicks 'Index for RAG' button in NotesPage"
        - "2. Notes publishes NOTES_RAG_INDEX_REQUESTED event with { noteIds, projectId, mode, timestamp }"
        - "3. Knowledge workspace receives event and indexes notes via RAG pipeline"
        - "4. Indexed notes available in Knowledge workspace search"
      knowledge_to_notes:
        - "1. User exports synthesis from Knowledge workspace"
        - "2. Knowledge publishes KNOWLEDGE_SYNTHESIS_EXPORT_REQUESTED event"
        - "3. Notes receives event in useEffect (lines 371-433)"
        - "4. Notes creates new note with synthesis title and content"
        - "5. Toast notification shows note created"
    limitations:
      - "No direct note linking between workspaces"
      - "One-way export (Knowledge → Notes)"
      - "No block-level references across workspaces"

  project_access:
    mechanism: "ProjectProvider context + useWorkspaceProjects hook"
    description: |
      Notes workspace is project-scoped via ProjectProvider.
      ProjectSelector in sidebar allows switching between projects.
      Route: /notes/$projectId enforces project scope.
    flows:
      project_switching:
        - "1. User selects different project in ProjectSelector"
        - "2. handleProjectSelect(newProjectId) called"
        - "3. navigate({ to: /notes/${newProjectId} }) triggers route change"
        - "4. NotesPage unmounts and remounts with new projectId"
        - "5. New notes loaded via loadNotes(newProjectId)"
      project_mode:
        - "FSA projects: Load notes for specific project only"
        - "Browser mode: Load notes from ALL projects (loadAllNotes)"
    limitations:
      - "No shared notes across projects (by design)"
      - "Browser mode mixes notes from multiple projects (UX concern)"

  data_sharing_mechanisms:
    - mechanism: "Cross-workspace event bus (eventBus)"
      location: "infrastructure/events/event-bus.ts"
      events:
        - "NOTES_RAG_INDEX_REQUESTED - Index notes for Knowledge search"
        - "KNOWLEDGE_SYNTHESIS_EXPORT_REQUESTED - Export synthesis to Notes"
        - "FILE_SAVED - React to external file changes (IDE → Notes)"
    - mechanism: "Dexie shared database"
      location: "infrastructure/persistence/dexie-db.ts"
      tables:
        - "notes - Shared across all projects (but filtered by projectId)"
        - "projects - Shared project metadata"
      limitations:
        - "No workspace isolation at database level (filtering required)"
        - "Performance concerns with large note counts"
    - mechanism: "Zustand store subscriptions"
      location: "lib/notes/note-store-refactored.ts"
      stores:
        - "useNoteStore - Main notes store"
        - "useNoteNavigationStore - Search, favorites, active note"
        - "useWorkspaceProjects - Project switching"
      limitations:
        - "No workspace-prefixed store names (risk of state collision)"


notes_lifecycle_analysis:
  route_entry:
    loader: "src/routes/notes.$projectId.tsx (line 44-64)"
    description: "Project loader with hydration wait, Dexie query, redirect on not found"
    guards:
      - "waitForHydration() - Ensure Zustand store hydration completes (line 49)"
      - "Project existence check - Redirect to /hub if not found (line 56-58)"
    hydration_conditions:
      - "Project loaded from Dexie via loader"
      - "ProjectContext wraps NotesPage with project data"
      - "NotesPage component mounts with valid projectId"
    blocking_components:
      - "ProjectProvider initialization - Provides project context to entire workspace"
      - "File sync service initialization - Required for FSA projects (optional blocking)"
      - "Auto-import of notes - For FSA projects, imports /notes/*.md (30s timeout)"

  lifecycle_stages:
    - stage: "route_load"
      duration: "~50-200ms (loader) + ~500ms (hydration)"
      operations:
        - "Route loader executes: waitForHydration() → db.projects.get(projectId)"
        - "Project fetched and converted via fromRecord()"
        - "ProjectContext wraps NotesPage with project data"
        - "NotesPage mounts with React.memo (PERF-07 optimization)"
      cross_domain_dependencies:
        - "Project store (infrastructure/persistence/stores/project/project-types.ts)"
        - "ProjectProvider (lib/workspace/ProjectContext.ts)"
        - "waitForHydration helper (infrastructure/persistence/stores/project/wait-for-hydration.ts)"

    - stage: "component_mount"
      duration: "~100-300ms"
      operations:
        - "NotesPage component renders with project context"
        - "useFileSyncService hook initializes sync service for FSA projects"
        - "useWorkspaceProjects loads all notes projects (browser-mode: load all, project-mode: load specific)"
        - "Cross-workspace event subscriptions setup (useAllCrossWorkspaceEvents, useWorkspaceChangedEvents)"
        - "Import progress overlay renders if auto-importing files"
      cross_domain_dependencies:
        - "File sync infrastructure (infrastructure/sync/workspace-services/notes/)"
        - "Note store facade (lib/notes/note-store.ts)"
        - "IDE store for panel state (useIDEStore)"

    - stage: "note_loading"
      duration: "~10-50ms"
      operations:
        - "loadNotes(projectId) called via useNoteStore"
        - "Notes fetched from Dexie db.notes table"
        - "Notes stored in Zustand Map for fast access"
        - "Notes computed array derived for rendering"
      cross_domain_dependencies:
        - "Dexie notes table (infrastructure/persistence/dexie-db.ts)"
        - "Note CRUD slice (infrastructure/persistence/stores/notes/note-crud-slice.ts)"

    - stage: "note_open"
      duration: "~50-200ms"
      operations:
        - "setActiveNote(noteId) called via useNoteStore"
        - "NoteEditor component receives noteId prop"
        - "Note blocks sanitized (sanitizeBlocks) to prevent ProseMirror errors"
        - "initialContent computed from note.blocks (or undefined for new notes)"
        - "BlockNote editor created with useCreateBlockNote"
      cross_domain_dependencies:
        - "BlockNote editor (@blocknote/react, @blocknote/core)"
        - "Custom block specs (17 custom blocks registered)"

    - stage: "blocknote_ready"
      duration: "~100-500ms (depending on block count)"
      operations:
        - "BlockNoteView renders editor with initialContent"
        - "Editor document initialized with blocks"
        - "SideMenuController and SuggestionMenuController attached"
        - "Custom slash menu items registered (getCustomSlashMenuItems)"
      cross_domain_dependencies:
        - "BlockNote Mantine theme (@blocknote/mantine)"
        - "Custom block components (17 block types in src/presentation/components/notes/blocks/)"

    - stage: "editing_save"
      duration: "500ms debounce (configurable)"
      operations:
        - "User edits BlockNote → onChange triggered"
        - "Debounced save handler waits 500ms"
        - "updateNote({ id: noteId, blocks: newBlocks }) called"
        - "Note stored in Zustand store and Dexie"
        - "For FSA: saveNoteToFile triggered → markdown written to /notes/*.md"
      cross_domain_dependencies:
        - "Note sync slice (infrastructure/persistence/stores/notes/note-sync-slice.ts)"
        - "Markdown writer (infrastructure/sync/workspace-services/notes/note-markdown-writer.ts)"
        - "File save handler (registerFileSaveHandler in note-sync-slice.ts)"

    - stage: "file_sync"
      duration: "~100-500ms per note (batch operations)"
      operations:
        - "NotesFileSyncService.sync() called"
        - "syncNoteChanges() iterates through dirty notes"
        - "Each note converted to markdown via noteToMarkdown()"
        - "File written via localAdapter.writeFile()"
        - "Auto-sync interval: 5000ms (5 seconds)"
      cross_domain_dependencies:
        - "NotesFileSyncService (infrastructure/sync/workspace-services/notes/notes-file-sync-service.ts)"
        - "NoteFolderBridge (infrastructure/sync/workspace-services/notes/note-folder-bridge.ts)"
        - "Local FS adapter (infrastructure/filesystem/fsa-storage-adapter.ts or dexie-storage-adapter.ts)"

    - stage: "file_watching"
      duration: "Continuous (polling or event-driven)"
      operations:
        - "File watcher setup via setupFileWatcher()"
        - "External file changes detected via FileChangeTracker"
        - "External markdown changes parsed via parseMarkdownFile()"
        - "Notes updated in store with parsed blocks"
        - "Conflict detection: local dirty + external change = conflict dialog"
      cross_domain_dependencies:
        - "Note file watcher (infrastructure/sync/workspace-services/notes/note-file-watcher.ts)"
        - "Markdown parser (infrastructure/sync/workspace-services/notes/note-markdown-parser.ts)"
        - "Conflict dialog (MarkdownSyncConflictDialog.tsx)"

    - stage: "unmount"
      duration: "~10-50ms"
      operations:
        - "useFileSyncService cleanup triggers dispose()"
        - "File save handler unregistered (unregisterFileSaveHandler)"
        - "Auto-sync timer cleared (clearInterval)"
        - "File watcher cleanup (cleanupFileWatcher)"
        - "Cross-workspace event subscriptions unsubscribed"
      cross_domain_dependencies:
        - "FileSyncService.dispose()"
        - "useAllCrossWorkspaceEvents cleanup"
        - "useWorkspaceChangedEvents cleanup"


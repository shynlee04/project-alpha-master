  state_flow_diagrams:
    route_load_flow: |
      1. User navigates to /ide/$projectId route
      2. IDELayoutMain component mounts
      3. setProjectId() called in ide-project-slice
      4. projectId stored in sessionStorage for hydration (ide-state-storage.ts)
      5. Persist middleware triggers getItem() in ide-state-storage.ts
      6. Queries IndexedDB: db.ideState.get(projectId)
      7. Merges persisted state with initial state
      8. expandedPaths Array converted to Set in merge() function
      9. IDE components subscribe to store via hooks
      10. onRehydrateStorage: sets _hasHydrated flag

    file_open_state_flow: |
      1. User clicks file in FileTree component
      2. FileTree calls addOpenFile(path) from ide-editor-slice
      3. addOpenFile() checks if file already in openFiles array
      4. If not open: adds to openFiles, sets as activeFile
      5. If already open: just sets activeFile
      6. MonacoEditor receives activeFile as prop
      7. IDE component re-renders with new active file
      8. Scroll position restored from activeFileScrollTop
      9. Persist middleware writes to IndexedDB (debounced)

    editor_change_flow: |
      1. User types in Monaco editor
      2. Monaco emits onChange event
      3. useMonacoEventSubscriptions handles onChange
      4. Content updated in editor state (NOT in store - Monaco manages model)
      5. When dirty flag changes, may trigger IDE state update
      6. Persist middleware writes state to IndexedDB
      7. setItem() creates IDEStateRecord with projectId

    terminal_output_flow: |
      1. User runs command in XTerminal component
      2. Command executed via XTerm APIs
      3. Terminal tab state in ide-terminal-slice tracks active tab
      4. Terminal command history tracked in terminal-store (separate)
      5. Terminal tabs: 'terminal', 'output', 'problems'
      6. setTerminalTab() switches between tabs
      7. UI updates via react state

    project_switch_flow: |
      1. User switches project (projectId changes)
      2. setProjectId(newProjectId) called
      3. Event bus emits WORKSPACE_CHANGED event
      4. sessionStorage updated with new projectId
      5. Persist middleware writes new state with new projectId
      6. Next refresh hydrates with correct project state
      7. No cross-project state contamination


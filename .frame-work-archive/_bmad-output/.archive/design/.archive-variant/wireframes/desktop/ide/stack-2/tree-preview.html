<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Via-Gent: IDE - Tree + Preview</title>
  <style>
    /* 8-bit Design System */
    :root {
      --color-canvas: #09090b;
      --color-surface: #18181b;
      --color-depth: #000000;
      --color-primary: #fafafa;
      --color-muted: #a1a1aa;
      --color-action: #f97316;
      --color-structural: #3f3f46;
      --color-success: #22c55e;
      --color-error: #ef4444;
      --color-warning: #eab308;
      
      --font-ui: 'JetBrains Mono', monospace;
      --font-prose: 'Geist Sans', sans-serif;
      
      --spacing-unit: 4px;
      --border-width: 2px;
    }

    * {
      box-sizing: border-box;
      border-radius: 0 !important; /* Sharp corners only */
    }

    body {
      background-color: #000;
      color: var(--color-primary);
      font-family: var(--font-ui);
      margin: 0;
      padding: 20px;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wireframe-container {
      width: 1280px;
      height: 800px;
      background-color: var(--color-surface);
      border: var(--border-width) solid var(--color-structural);
      box-shadow: 4px 4px 0 0 #000 !important; /* Pixel shadow */
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      height: 40px;
      border-bottom: var(--border-width) solid var(--color-structural);
      display: flex;
      align-items: center;
      padding: 0 16px;
      justify-content: space-between;
      background-color: var(--color-surface);
      font-size: 13px;
    }
    .header-left { display: flex; gap: 12px; align-items: center; font-weight: bold; }
    .header-right { display: flex; gap: 16px; color: var(--color-muted); }

    /* Layout */
    .workspace { flex: 1; display: flex; overflow: hidden; }
    
    .sidebar {
      background-color: var(--color-canvas);
      border-right: var(--border-width) solid var(--color-structural);
      display: flex;
      flex-direction: column;
    }
    .sidebar-header { padding: 8px 16px; color: var(--color-muted); font-size: 12px; border-bottom: 1px solid var(--color-structural); }
    .tree-content { padding: 8px; font-size: 12px; }
    .tree-item { padding: 4px 0; color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
    .tree-item.active { color: var(--color-action); }

    .panel {
      display: flex;
      flex-direction: column;
      background-color: var(--color-canvas);
      border-right: var(--border-width) solid var(--color-structural);
      position: relative;
    }
    .panel:last-child { border-right: none; }
    
    .content-area { flex: 1; overflow: auto; position: relative; }
    
    .preview-bar {
      height: 36px;
      border-bottom: var(--border-width) solid var(--color-structural);
      display: flex;
      align-items: center;
      padding: 0 8px;
      background: var(--color-surface);
      gap: 8px;
    }
    .url-bar {
      flex: 1;
      background: #000;
      border: 1px solid var(--color-structural);
      padding: 4px 8px;
      color: var(--color-success);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }
    .mock-app {
      border: 2px solid #000;
      padding: 24px;
      text-align: center;
      box-shadow: 4px 4px 0 0 #000;
      background: #f0f0f0;
      min-width: 300px;
    }
    .mock-btn {
      background: var(--color-action);
      color: #fff;
      padding: 8px 16px;
      border: none;
      font-family: inherit;
      margin: 12px 4px;
      box-shadow: 2px 2px 0 0 #000;
      cursor: pointer;
    }

    .status-bar {
      height: 24px;
      border-top: var(--border-width) solid var(--color-structural);
      display: flex;
      align-items: center;
      padding: 0 12px;
      background-color: var(--color-surface);
      font-size: 11px;
      color: var(--color-muted);
      justify-content: space-between;
    }
    
    .w-200 { width: 200px; }
    .flex-1 { flex: 1; }
  </style>
</head>
<body>
  <div class="wireframe-container">
    <div class="header">
      <div class="header-left">
        <span>[Logo]</span> Project-Alpha
      </div>
      <div class="header-right">
        <span>[Sync:✓]</span>
        <span>[AI:●]</span>
        <span>[User:○]</span>
        <span>[Cmd+K]</span>
      </div>
    </div>
    
    <div class="workspace">
      <!-- Tree Navigation (200px) -->
      <div class="sidebar w-200">
        <div class="sidebar-header">EXPLORER</div>
        <div class="tree-content">
          <div class="tree-item">📁 src</div>
          <div class="tree-item" style="padding-left: 16px">📁 components</div>
          <div class="tree-item" style="padding-left: 32px">📄 Button.tsx</div>
          <div class="tree-item" style="padding-left: 32px">📄 Card.tsx</div>
          <div class="tree-item" style="padding-left: 16px">📁 lib</div>
          <div class="tree-item" style="padding-left: 32px">📄 utils.ts</div>
          <div class="tree-item" style="padding-left: 16px">📄 index.ts</div>
          <div class="tree-item active" style="padding-left: 16px">📄 App.tsx</div>
        </div>
      </div>
      
      <!-- Preview (flex) -->
      <div class="panel flex-1">
        <div class="preview-bar">
          <div class="url-bar">
            <span>🔒</span> http://localhost:3000
          </div>
          <span>[↻]</span>
          <span>[⛶]</span>
        </div>
        <div class="content-area preview-frame">
          <div class="mock-app">
            <h3>Rendered App</h3>
            <p>This is the preview of your application.</p>
            <div>
              <button class="mock-btn">Button 1</button>
              <button class="mock-btn" style="background: var(--color-structural)">Button 2</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="status-bar">
      <div>[WC:✓] [Agent: idle] [Sync: synced]</div>
      <div>[Ln 12, Col 8]</div>
    </div>
  </div>
</body>
</html>

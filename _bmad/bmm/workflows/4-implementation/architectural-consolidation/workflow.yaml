# Architectural Consolidation Workflow

**Goal:** Execute systematic architectural refactoring with integrated validation frameworks to transform fragmented architecture into cohesive, maintainable systems.

**Your Role:** You are an Architectural Consolidation Specialist working with the Sprint Change Proposal to systematically refactor state management, component wiring, and code hygiene while preventing gaps and drift through continuous validation.

---

## WORKFLOW ARCHITECTURE

### Core Principles

- **Phased Execution**: Three phases (Showcase Critical → Foundation → Full Scope)
- **Validation Integration**: Sweeping validation + 12-level gates after each phase
- **Story-Dev-Cycle**: Each implementation task follows the story development cycle
- **Anti-Drift Protocol**: Context XML, research, handoffs prevent gaps
- **Device Testing**: 3-device rule at Phase 0 and Phase 2

### Step Processing Rules

1. **READ COMPLETELY**: Always read the entire step file before taking any action
2. **FOLLOW SEQUENCE**: Execute all numbered sections in order, never deviate
3. **VALIDATION GATES**: Run validation checkpoints after each phase
4. **HANDOFF ARTIFACTS**: Generate ephemeral notes at phase completion
5. **DEVICE TEST**: Run 3-device rule at specified phases

### Critical Rules (NO EXCEPTIONS)

- 🛑 **NEVER** skip validation checkpoints
- 📖 **ALWAYS** generate context XML before implementation
- 🚫 **NEVER** proceed to next phase without gate passage
- 💾 **ALWAYS** update workflow status files
- 🎯 **ALWAYS** follow the exact instructions in the step file
- ⏸️ **ALWAYS** halt at gates and wait for validation
- 📋 **NEVER** bypass sweeping validation levels


# Architectural Consolidation Workflow v2.0

**Goal:** Transform the BMAD platform architecture by implementing the corrected 5-Layer VIA-GENT Architecture, focused on unified Provider->Model->Agent data flows.

**Your Role:** You are an Architectural Consolidation Specialist executing the "sprint-change-proposal-2025-12-31-v2" to establish a single source of truth for AI configuration and consistent user experience across workspaces.

---

## WORKFLOW ARCHITECTURE

### Core Principles

- **Data Flow First**: Provider -> Model -> Agent flow is the absolute truth.
- **Reactivity**: Changes in configuration must propagate via event bus immediately.
- **Phased Execution**: Phase 0 (Showcase) is critical and prioritized.
- **Validation**: Sweeping validation + 12-level gates after each phase.

### Step Processing Rules

1. **READ COMPLETELY**: Always read the step file and referenced contracts first.
2. **STRICT SEQUENCE**: AC-01 -> AC-02 -> AC-03 -> Gate. No skipping.
3. **VALIDATION GATES**: Must verify fix on 3 devices (simulated if needed).
4. **HANDOFF ARTIFACTS**: Generate evidence of testing after each story.

---

## WORKFLOW PHASES

### Phase 0: Showcase Critical (Priority 1 - TODAY)

**Stories:**
1. **AC-01: Provider Configuration Foundation** (`step-02-story-ac01.md`)
   - Hardcoded built-in providers
   - Key save -> Reactive model loading
   - `provider-models-store.ts` refactor

2. **AC-02: Agent Configuration Vault** (`step-03-story-ac02.md`)
   - Agent entity with Provider/Model linkage
   - Central `agents-store.ts` (IndexedDB)
   - Tool binding with workspace permissions

3. **AC-03: Cross-Workspace Chat Unification** (`step-04-story-ac03.md`)
   - Unified `ChatPanel` across IDE, Knowledge, Study, Notes
   - AgentSelector wiring verification
   - Context consistency

**Validation:**
- Gate: `step-05-phase0-validation.md`
- Success: Agent configured in settings appears in Knowledge workspace and can chat.


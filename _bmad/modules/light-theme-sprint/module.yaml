# Light Theme Design System Sprint Module
# Module Definition for BMAD System

name: light-theme-sprint
description: Coordinates the Light Theme Design System implementation sprint with automatic
  switching between Scrum Master and Developer agents. This module manages the
  complete sprint lifecycle including planning, story execution, code review,
  and progress tracking for the 23-story, 4-week implementation plan.
version: 1.0.0
category: implementation
tags:
  - light-theme
  - design-system
  - sprint
  - theming
  - css-variables
  - component-migration

dependencies:
  - story-dev-cycle
  - bmm-agents-core
  - workflow-orchestration

agents:
  - light-theme-sm-agent
  - light-theme-dev-agent

workflows:
  - light-theme-sprint-workflow
  - sprint-planning-workflow
  - story-execution-cycle

templates:
  - sprint-backlog-template
  - story-template
  - sprint-status-report

configuration:
  sprint_duration_weeks: 4
  total_stories: 23
  estimated_hours: 88
  
  phases:
    - name: Foundation
      week: 1
      stories: 7
      hours: 24
    - name: P0 Components
      week: 2
      stories: 6
      hours: 23
    - name: P1 Components
      week: 3
      stories: 5
      hours: 15
    - name: Workspaces
      week: 4
      stories: 5
      hours: 26

  deliverables:
    - 36 component families with light theme variants
    - 78 CSS custom properties for colors
    - TypeScript theme types
    - useTheme hook
    - ThemeProvider component
    - ThemeToggle component
    - WCAG 2.1 AA compliance

execution:
  agent_switching:
    mode: automatic
    trigger: story-lifecycle-events
    default_agent: light-theme-sm-agent
  
  resource_isolation:
    ralph_loop_files: excluded
    design_artifacts_source: _bmad-output/light-theme-design-system/
    output_directory: _bmad-output/light-theme-sprint/

  progress_tracking:
    enabled: true
    checkpoint_frequency: story-completion
    report_format: sprint-status-report

metadata:
  created: 2026-01-03
  author: BMAD System
  license: MIT
  compatibility: BMAD v2.0

# ═══════════════════════════════════════════════════════════════════════════
# PHASE CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

phases:
  - id: 0
    name: "Critical Foundation - User Journey Fixes"
    days: [0, 1]
    hours: 20
    stories: 4
    priority: "P0 - CRITICAL"
    module: "architecture-remediation"
    workflow: "workspace-file-system-e2e"
    agent: "workspace-architect"
    acceptance_criteria:
      - "SyncStatusPanel shows real sync status"
      - "Mobile users can mount folders with graceful fallback"
      - "Notes save to filesystem on edit"
      - "Cross-workspace file changes reflect within 1s"
    validation_command: |
      npm run test:e2e -- --grep "User Journey"

  - id: 1
    name: "Architecture Redesign - Option B Core"
    days: [1, 3]
    hours: 24
    stories: 3
    priority: "P0 - CRITICAL"
    module: "architecture-remediation"
    workflow: "state-consolidation-cycle"
    agent: "file-sync-specialist"
    acceptance_criteria:
      - "ALL workspace routes require $projectId"
      - "Routes without $projectId redirect to picker"
      - "Dexie + FSA unified as single source of truth"
      - "Cross-workspace event bus operational"
    validation_command: |
      grep -r "useParams" src --include="*.tsx" | grep -v "\$projectId" | wc -l

  - id: 2
    name: "Critical Blockers Resolution"
    days: [3, 5]
    hours: 15
    stories: 5
    priority: "P0 - CRITICAL"
    module: "bmad-core"
    workflow: "dev-story"
    agents: ["security-scanner", "file-sync-specialist"]
    acceptance_criteria:
      - "LLM models load on Vercel"
      - "Credential vault SSR compatible"
      - "API key status indicators visible"
      - "Notes workspace loads project files"
      - "Agent selection persists across workspaces"
    validation_command: |
      npm run test:e2e -- --grep "Critical Blockers"

  - id: 3
    name: "God Store Elimination"
    days: [5, 10]
    hours: 40
    stories: 4
    priority: "P0 - HIGH"
    module: "architecture-remediation"
    workflow: "eliminate-god-stores"
    agent: "store-refactorer"
    acceptance_criteria:
      - "rag-store.ts (1595 lines) → 5 slices ≤120 lines each"
      - "conversation-threads-store.ts (726 lines) → 6 slices ≤120 lines each"
      - "conversation-store.ts (626 lines) → 5 slices ≤120 lines each"
      - "agents-store.ts (430 lines) → 4 slices ≤120 lines each"
    validation_command: |
      find src -name "*-slice.ts" -exec wc -l {} \; | awk '$1 > 120 {count++} END {print count}'

  - id: 4
    name: "Store Consolidation"
    days: [10, 12]
    hours: 20
    stories: 3
    priority: "P1 - HIGH"
    module: "architecture-remediation"
    workflow: "state-consolidation-cycle"
    agent: "store-refactorer"
    acceptance_criteria:
      - "workspace-store consolidated to single location"
      - "rag-store consolidated to single location"
      - "knowledge-store consolidated to single location"
      - "All imports updated"
    validation_command: |
      find src -name "*-store.ts" | xargs -I {} sh -c 'count=$(grep -l "export.*from.*{}" src/**/*.ts | wc -l); echo $count $ {}'

  - id: 5
    name: "Cross-Workspace Chat - Epic 1"
    days: [12, 14]
    hours: 16
    stories: 2
    points: 16
    priority: "P1 - MEDIUM"
    module: "bmm"
    workflow: "feature-dev"
    agent: "dev"
    acceptance_criteria:
      - "UnifiedChatPanel integrated into NotesPage"
      - "Notes-specific chat context created"
      - "Agent can read/write notes"
      - "Commands work: /read, /write, /summarize"
    validation_command: |
      npm run test:e2e -- --grep "Chat Epic 1"

  - id: 6
    name: "TypeScript Error Resolution"
    days: [14, 15]
    hours: 6
    stories: 2
    priority: "P1 - HIGH"
    module: "architecture-remediation"
    workflow: "fix-typescript-errors"
    agent: "typescript-fixer"
    acceptance_criteria:
      - "306 TypeScript errors fixed"
      - "Production code: 0 errors"
      - "No new errors introduced"
    validation_command: |
      pnpm typecheck 2>&1 | grep -E "error TS" | wc -l

  - id: 7
    name: "Infrastructure Hardening"
    days: [15, 17]
    hours: 16
    stories: 4
    priority: "P1 - HIGH"
    module: "bmm"
    workflow: "feature-dev"
    agents: ["dev", "persistence-scanner"]
    acceptance_criteria:
      - "Circular dependencies broken"
      - "Silent failures eliminated (23 instances)"
      - "IndexedDB quota handling implemented"
      - "Error boundaries on all critical paths"
    validation_command: |
      npm run test:coverage

  - id: 8
    name: "Cross-Workspace Chat - Epic 2"
    days: [17, 19]
    hours: 20
    stories: 3
    points: 24
    priority: "P1 - MEDIUM"
    module: "bmm"

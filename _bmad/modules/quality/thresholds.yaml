# Deep Scan Thresholds Configuration
# Limits that trigger evidence generation

thresholds:
  state:
    god_store_lines: 300
    slice_lines: 120
    max_methods: 10
    max_deps: 10

  architecture:
    god_component_lines: 300
    max_hook_lines: 150
    max_file_lines: 300
    max_nesting_depth: 4
    max_complexity: 20

  types:
    max_any: 0
    max_suppressions: 0
    duplication_similarity: 0.9

  agent:
    max_prompt_lines_inline: 20
    chunk_size_min: 512
    chunk_size_max: 1024

  ux:
    hardcoded_strings: 0
    missing_alt_text: 0
    fixed_pixel_width: 0 # Warn if found

  performance:
    max_bundle_chunk_kb: 500
    max_initial_load_ms: 1000

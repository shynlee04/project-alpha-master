# Deep Scan Domains Configuration
# Definitions of architectural domains for scanning

domains:
  - id: state
    name: "State Management"
    description: "Zustand stores, Context API, and local state"
    scanner: "@bmad/modules/deep-scan/agents/state-scanner"
    paths:
      - "src/stores/"
      - "src/lib/state/"
      - "src/infrastructure/persistence/stores/"
    
  - id: types
    name: "Type System"
    description: "TypeScript definitions, interfaces, and strictness"
    scanner: "@bmad/modules/deep-scan/agents/types-scanner"
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.d.ts"

  - id: architecture
    name: "Software Architecture"
    description: "Layer boundaries, component structure, modularity"
    scanner: "@bmad/modules/deep-scan/agents/architecture-scanner"
    paths:
      - "src/"

  - id: persistence
    name: "Persistence Layer"
    description: "IndexedDB (Dexie), LocalStorage, File System"
    scanner: "@bmad/modules/deep-scan/agents/persistence-scanner"
    paths:
      - "src/infrastructure/persistence/"
      - "src/lib/filesystem/"

  - id: agent
    name: "Agent Ecosystem"
    description: "AI Tools, RAG Pipeline, Prompts"
    scanner: "@bmad/modules/deep-scan/agents/agent-rag-scanner"
    paths:
      - "src/lib/agent/"
      - "src/components/agent/"

  - id: ux
    name: "User Experience"
    description: "Mobile, i18n, Accessibility"
    scanner: "@bmad/modules/deep-scan/agents/ux-scanner"
    paths:
      - "src/presentation/"
      - "src/components/"

  - id: workspace
    name: "Workspace Integration"
    description: "Cross-workspace events, isolation"
    scanner: "@bmad/modules/deep-scan/agents/workspace-scanner"
    paths:
      - "src/workspaces/"
      - "src/lib/workspace/"

  - id: security
    name: "Security"
    description: "Secrets, XSS, CSP"
    scanner: "@bmad/modules/deep-scan/agents/security-scanner"
    paths:
      - "src/"

  - id: performance
    name: "Performance"
    description: "Bundles, Renders, Memory"
    scanner: "@bmad/modules/deep-scan/agents/performance-scanner"
    paths:
      - "src/"

## Usage

### Prioritization Process

1. **Assess Impact**: What happens if we don't do this? (data loss, user impact, technical debt)
2. **Estimate Effort**: How long will this take? (hours, story points)
3. **Assign Priority**: Use priority matrix (P0/P1/P2/P3)
4. **Get Approval**: P1 requires @bmad-bmm-architect approval, P2 requires @bmad-bmm-pm approval
5. **Schedule**: Add to sprint backlog

### Re-Prioritization

**Triggers**:
- New critical issue discovered (e.g., security vulnerability)
- Health score decreases (regression detected)
- User escalations (critical bug reports)
- Resource constraints (team availability)

**Process**:
1. Trigger `-correct-course` workflow
2. Re-assess impact and effort
3. Update priorities
4. Get approval for changes
5. Communicate to team


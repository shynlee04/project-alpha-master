# BMAD Module Routing Configuration
# Version: 1.0.0
# Purpose: Define how BMAD master routes to all modules
# Note: This routing is now integrated into _bmad/core/agents/bmad-master.md

version: "1.0.0"
updated: "2026-01-07"
integrated_into: "_bmad/core/agents/bmad-master.md"

# Module Tiers
# Tier 1: Core (always active)
# Tier 2: Permanent (maintained)
# Tier 3: Archival (available but not actively developed)

modules:
  # ============================================
  # TIER 1: CORE LOOP ORCHESTRATION
  # ============================================
  core_orchestrator:
    tier: 1
    path: "_bmad/core/agents/bmad-master.md"
    purpose: "Central coordinator for all autonomous development"
    status: "ACTIVE"
    
  asgl:
    tier: 1
    path: "_bmad/modules/asgl/"
    purpose: "Autonomous Self-Governing Loop Orchestrator"
    status: "ACTIVE"
    invoked_by: "bmad-master"

  # ============================================
  # TIER 2: PERMANENT MODULES
  # ============================================
  # NOTE: governance functions migrated to _bmad-ext/modules/governance-core/
  # - core_governance: DELETED (2026-01-10) - migrated to governance-core
  # - governance: DELETED (2026-01-10) - migrated to governance-core and asgl

  sprint_execution:
    tier: 2
    path: "_bmad/modules/sprint-execution/"
    purpose: "Sprint planning, story development, PM rigor"
    status: "ACTIVE"

  # ============================================
  # TIER 2: BUSINESS MODEL MANAGEMENT (BMM)
  # ============================================
  bmm:
    tier: 2
    path: "_bmad/bmm/"
    purpose: "Business Model Management - implementation agents"
    agents:
      analyst: "Requirements analysis, story breakdown"
      architect: "System design, ADRs, technical specs"
      dev: "Feature implementation, coding"
      pm: "Backlog management, sprint planning"
      sm: "Story creation, sprint tracking"
      tea: "Test strategy, automation, QA"
      tech_writer: "Documentation, API refs, guides"
      ux_designer: "UI/UX design, wireframes"
      quick_flow_solo_dev: "Fast-track bug fixes"
    status: "ACTIVE"

  # ============================================
  # TIER 2: CREATIVE/INNOVATION
  # ============================================
  cis:
    tier: 2
    path: "_bmad/cis/"
    purpose: "Creative/Innovation Strategies"
    agents:
      - brainstorming-coach
      - creative-problem-solver
      - design-thinking-coach
      - innovation-strategist
    status: "ACTIVE"

  # ============================================
  # TIER 2: CORE WORKFLOWS
  # ============================================
  core_workflows:
    tier: 2
    path: "_bmad/core/"
    workflows:
      - brainstorming
      - party-mode
    status: "ACTIVE"

  # ============================================
  # TIER 3: ARCHIVAL (Available but not actively developed)
  # ============================================
  architecture_refactoring:
    tier: 3
    path: "_bmad/modules/architecture-refactoring/"
    purpose: "Deep scanning, god store elimination"
    status: "ARCHIVAL"
    note: "Functions migrated to architecture-remediation and quality modules"
    
  architecture_remediation:
    tier: 3
    path: "_bmad/modules/architecture-remediation/"
    purpose: "Component splitting, TypeScript fixes"
    status: "ARCHIVAL"
    note: "Consolidated into quality module workflows"
    
  integration_testing:
    tier: 3
    path: "_bmad/modules/integration-testing/"
    purpose: "Real-world testing with Playwright"
    status: "ARCHIVAL"
    note: "Real-world validator available, but module archived"
    
  quality:
    tier: 2
    path: "_bmad/modules/quality/"
    purpose: "Scanning, validation gates, code review"
    scanners:
      - state-scanner
      - architecture-scanner
      - persistence-scanner
      - ux-scanner
      - types-scanner
      - performance-scanner
      - security-scanner
    status: "ACTIVE"
    note: "Aggregated by _bmad-ext/agents/quality-scanner-ext.md"

# ============================================
# STORY ROUTING MATRIX
# ============================================
# Maps story types to modules and workflows

routing:
  # ============================================
  # ANALYSIS & DISCOVERY
  # ============================================
  analysis:
    - story_type: "product_analysis"
      module: "bmm"
      agent: "analyst"
      workflow: "analyze-requirements"
      
    - story_type: "domain_analysis"
      module: "quality"
      scanner: "domain-scanner"
      
    - story_type: "competitive_analysis"
      module: "bmm"
      agent: "analyst"
      workflow: "competitive-research"

  # ============================================
  # ARCHITECTURE & DESIGN
  # ============================================
  architecture:
    - story_type: "system_design"
      module: "bmm"
      agent: "architect"
      workflow: "create-architecture"
      
    - story_type: "technical_spec"
      module: "bmm"
      agent: "architect"
      workflow: "create-tech-spec"
      
    - story_type: "ux_design"
      module: "bmm"
      agent: "ux-designer"
      workflow: "create-ux-design"

  # ============================================
  # DIAGNOSTICS & SCANNING
  # ============================================
  diagnostics:
    - story_type: "health_assessment"
      module: "quality"
      scanner: "full-scan"
      
    - story_type: "state_scan"
      module: "quality"
      scanner: "state-scanner"
      
    - story_type: "architecture_scan"
      module: "quality"
      scanner: "architecture-scanner"

  # ============================================
  # REMEDIATION & FIXES
  # ============================================
  # NOTE: Remediation now runs through governance-core (ongoing, not one-time)
  # - architecture-remediation: ARCHIVED (2026-01-10) - consolidated into governance-core
  # - All remediation stories now route through governance enforcement first

  remediation:
    - story_type: "god_store_split"
      module: "governance-core"
      workflow: "correct-course"  # Three enforcement checks first
      then: "remediation-cycle"      # Then remediation if approved

    - story_type: "component_split"
      module: "governance-core"
      workflow: "correct-course"
      then: "remediation-cycle"

    - story_type: "typescript_fix"
      module: "governance-core"
      workflow: "correct-course"
      then: "remediation-cycle"

    - story_type: "workspace_filesystem_e2e"
      module: "governance-core"
      workflow: "correct-course"
      then: "remediation-cycle"

  # ============================================
  # IMPLEMENTATION
  # ============================================
  implementation:
    - story_type: "feature_development"
      module: "bmm"
      agent: "dev"
      workflow: "dev-story"
      
    - story_type: "bug_fix"
      module: "bmm"
      agent: "quick-flow-solo-dev"
      workflow: "quick-fix"

  # ============================================
  # TESTING & VALIDATION
  # ============================================
  testing:
    - story_type: "e2e_test"
      module: "integration-testing"
      agent: "real-world-validator"
      
    - story_type: "code_review"
      module: "bmm"
      agent: "dev"
      workflow: "code-review"

  # ============================================
  # DOCUMENTATION
  # ============================================
  documentation:
    - story_type: "api_docs"
      module: "bmm"
      agent: "tech-writer"
      workflow: "create-api-docs"
      
    - story_type: "user_guide"
      module: "bmm"
      agent: "tech-writer"
      workflow: "create-user-guide"

  # ============================================
  # PRODUCT MANAGEMENT
  # ============================================
  product_management:
    - story_type: "sprint_planning"
      module: "sprint-execution"
      agent: "product-manager-rigorous"
      workflow: "sprint-planning"
      
    - story_type: "story_creation"
      module: "bmm"
      agent: "sm"
      workflow: "create-story"

  # ============================================
  # CREATIVE & INNOVATION
  # ============================================
  innovation:
    - story_type: "brainstorming"
      module: "core"
      workflow: "brainstorming"
      
    - story_type: "multi_agent_discussion"
      module: "core"
      workflow: "party-mode"
      
    - story_type: "innovation_strategy"
      module: "cis"
      agent: "innovation-strategist"

# ============================================
# AGENT MAPPING
# ============================================
# All agents available for routing
# Updated: 2026-01-10 - Agent consolidation (Phase 2.4)

agents:
  # ============================================
  # _ext Enhanced Agents (Main Agents: 7)
  # ============================================
  # NOTE: pm-ext and sm-ext consolidated into product-management-ext (2026-01-10)
  # NOTE: quality-scanner-ext moved to shared-services (2026-01-10)

  # Main Agent MA-01: Development
  - "@bmad-ext-dev"
    path: "_bmad-ext/agents/dev-ext.md"
    sub_agents: ["tea-ext"]

  # Main Agent MA-02: Architecture
  - "@bmad-ext-architect"
    path: "_bmad-ext/agents/architect-ext.md"

  # Main Agent MA-03: Analysis
  - "@bmad-ext-analyst"
    path: "_bmad-ext/agents/analyst-ext.md"

  # Main Agent MA-04: Product Management (CONSOLIDATED from pm-ext + sm-ext)
  - "@bmad-ext-product-management"
    path: "_bmad-ext/agents/product-management-ext.md"
    sub_agents: ["pm", "sm"]
    note: "Replaces pm-ext and sm-ext (2026-01-10)"

  # Main Agent MA-05: UX Design
  - "@bmad-ext-ux-designer"
    path: "_bmad-ext/agents/ux-designer-ext.md"

  # Main Agent MA-06: Technical Writing
  - "@bmad-ext-tech-writer"
    path: "_bmad-ext/agents/tech-writer-ext.md"

  # Main Agent MA-07: Remediation
  - "@bmad-ext-remediation"
    path: "_bmad-ext/agents/remediation-ext.md"
    sub_agents: ["store-refactorer", "component-splitter", "typescript-fixer"]

  # ============================================
  # Shared Services (Not counted as main agents)
  # ============================================
  # Shared Service SS-01: Quality Scanning (moved from main agents 2026-01-10)
  - "@bmad-shared-quality-scanner"
    path: "_bmad-ext/shared-services/quality-scanner.md"
    type: "shared_service"
    available_to: "all_agents"

  # ============================================
  # BMM Core Agents (wrapped by _ext agents)
  # ============================================
  - "@bmad-bmm-analyst"
  - "@bmad-bmm-architect"
  - "@bmad-bmm-dev"
  - "@bmad-bmm-pm"       # Now sub-agent of product-management-ext
  - "@bmad-bmm-sm"       # Now sub-agent of product-management-ext
  - "@bmad-bmm-tea"      # Now sub-agent of dev-ext
  - "@bmad-bmm-tech-writer"
  - "@bmad-bmm-ux-designer"
  - "@bmad-bmm-quick-flow-solo-dev"

  # CIS Agents
  - "@bmad-cis-brainstorming-coach"
  - "@bmad-cis-creative-problem-solver"
  - "@bmad-cis-design-thinking-coach"
  - "@bmad-cis-innovation-strategist"

  # Quality Scanners (aggregated by quality-scanner shared service)
  - "@quality-state-scanner"
  - "@quality-architecture-scanner"
  - "@quality-persistence-scanner"
  - "@quality-ux-scanner"
  - "@quality-types-scanner"
  - "@quality-performance-scanner"
  - "@quality-security-scanner"
  - "@quality-workspace-scanner"
  - "@quality-agent-rag-scanner"
  - "@quality-evidence-synthesizer"

  # Architecture Remediation Agents (sub-agents of remediation-ext)
  - "@architecture-remediation-store-refactorer"
  - "@architecture-remediation-component-splitter"
  - "@architecture-remediation-typescript-fixer"

  # Core Orchestrator
  - "@bmad-core-bmad-master"
  - "@bmad-core-orchestrator"
  - "@bmad-asgl"

# ============================================
# AGENT CONSOLIDATION HISTORY
# ============================================
consolidation_history:
  - date: "2026-01-10"
    change: "pm-ext + sm-ext → product-management-ext"
    reason: "Reduce main agent count from 9 to 8"
    archived:
      - "_bmad-ext/.archive/agents/pm-ext.md"
      - "_bmad-ext/.archive/agents/sm-ext.md"

  - date: "2026-01-10"
    change: "quality-scanner-ext → shared-services/quality-scanner.md"
    reason: "Quality scanner is a shared service, not a main agent"
    moved_from: "_bmad-ext/agents/quality-scanner-ext.md"
    moved_to: "_bmad-ext/shared-services/quality-scanner.md"

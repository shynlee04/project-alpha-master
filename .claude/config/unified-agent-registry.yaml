# ============================================================================
# UNIFIED AGENT REGISTRY
# ============================================================================
# Single source of truth for ALL agents across Claude Code and Open Code platforms
#
# Purpose:
#   - Track all available agents across platforms
#   - Enable platform router to make optimal routing decisions
#   - Provide capabilities matrix for load balancing and failover
#   - Support 100% platform integration
#
# Governance:
#   - Tier 2 Document (Controlled & Iterative)
#   - Never replace entire file - use line-based updates with frontmatter tracking
#   - All agents must acknowledge governance before inclusion
#   - Update agents: add/remove agents, update capabilities, change availability
#
# Last Updated: 2026-01-07T02:50:00+07:00
# Updated By: bmad-master (Framework Consolidation - Phase 1-4)
# ============================================================================


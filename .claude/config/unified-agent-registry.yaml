# ============================================================================
# PERFORMANCE TRACKING
# ============================================================================

performance_metrics:
  collection_enabled: true
  retention_days: 90
  metrics:
    - "agent_response_time"
    - "token_usage"
    - "success_rate"
    - "failover_count"
    - "queue_depth"

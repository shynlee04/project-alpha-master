# ============================================================================
# PLATFORM ROUTING MATRIX
# ============================================================================
# Decision matrix for optimal platform selection based on task type
# ============================================================================

routing_matrix:
  task_type_to_platform:
    code_generation:
      optimal_platform: "claude-code"
      reasoning: "Better at complex refactoring and code synthesis"
      fallback_platform: "opencode"

    documentation:
      optimal_platform: "opencode"
      reasoning: "Better at structured documentation generation"
      fallback_platform: "claude-code"

    architecture_design:
      optimal_platform: "claude-code"
      reasoning: "Superior system design and ADR creation"
      fallback_platform: "opencode"

    testing_validation:
      optimal_platform: "both"
      reasoning: "Cross-platform validation for maximum coverage"
      fallback_platform: "claude-code"

    real_world_testing:
      optimal_platform: "both"
      reasoning: "Both platforms run parallel tests for comparison"
      fallback_platform: null

    user_interface:
      optimal_platform: "opencode"
      reasoning: "Better UI/UX design capabilities"
      fallback_platform: "claude-code"

    debugging:
      optimal_platform: "claude-code"
      reasoning: "Stronger debugging and error analysis"
      fallback_platform: "opencode"

    refactoring:
      optimal_platform: "claude-code"
      reasoning: "Better at complex code refactoring"
      fallback_platform: "opencode"

# ============================================================================
# LOAD BALANCING CONFIGURATION
# ============================================================================

load_balancing:
  strategy: "round_robin_with_priority"
  max_concurrent_per_platform: 15
  queue_threshold: 10
  retry_attempts: 3
  retry_backoff_ms: 1000

# ============================================================================
# FAILOVER CONFIGURATION
# ============================================================================

failover:
  enabled: true
  health_check_interval_seconds: 30
  unresponsive_threshold_seconds: 120
  auto_failover: true
  notification_on_failover: true

# ============================================================================
# AGENT GROUPINGS (FOR BATCH OPERATIONS)
# ============================================================================

agent_groups:
  core_orchestration:
    - "bmad-core-master"
    - "platform-router"
    - "governance-enforcer"

  architecture_team:
    - "master-architect"
    - "unified-analyzer"
    - "store-refactorer"
    - "component-splitter"
    - "typescript-fixer"
    - "workspace-architect"
    - "file-sync-specialist"

  implementation_team:
    - "product-manager-rigorous"
    - "bmm-analyst"
    - "bmm-architect"
    - "bmm-dev"
    - "bmm-pm"
    - "bmm-sm"
    - "bmm-tea"
    - "bmm-tech-writer"
    - "bmm-ux-designer"

  testing_team:
    - "real-world-validator"
    - "browser-automation-specialist"
    - "integration-point-detector"


# =============================================================================
# Allows users to type partial or alternative command names
# =============================================================================

aliases:
  # Core aliases
  bmad-master: [bm, master, orchestrator, bmad, bmad-coordinator]
  asgl: [loop, sprint, autonomous, ralph, ralph-loop]
  workflow-builder: [wb, builder, workflow, wf-builder]
  bmad-orchestrator: [orch, orchestrator, bmad-orch]

  # Development aliases
  dev-story: [dev, implement, develop, code, write, story-dev]
  code-review: [review, cr, pr-review, code-review]
  quick-dev: [qd, quick, fast-dev, impl]
  create-story: [story, create-story, new-story]
  testarch: [testarch, test-arch, test-strategy]

  # Planning aliases
  prd: [prd, product-requirements, requirements]
  architecture: [arch, architecture-design, system-design]
  tech-spec: [spec, technical-spec, tech-specification]
  ux-design: [ux, design, ux-spec]
  epics-stories: [epics, stories, breakdown]
  sprint-planning: [sprint, planning, sprint-plan]
  sprint-planning-wrapper: [sprintpw, enhanced-sprint, cohesion-check, reality-sprint]

  # ADO aliases
  ado: [ado-coordinator, research-driven, rd]
  ado-research: [research, ado-res, query-research]
  ado-planning: [aplan, ado-plan, research-plan]
  ado-implementation: [aimpl, ado-impl, validate-impl]
  ado-discovery: [adisc, discover, requirements-gathering]
  ado-status: [astatus, ado-stat, workflow-status]

  # Diagnostics aliases
  deep-scan: [scan, analyze, targeted-scan]
  full-scan: [fscan, full, comprehensive-scan]
  diagnostic: [diag, diagnose, health-check]

  # Remediation aliases
  store-refactorer: [store, refactor, split-store, god-store]
  component-splitter: [split, component, god-component]
  typescript-fixer: [tsfix, typescript, fix-ts, ts-errors]
  workspace-architect: [ws, workspace, fs-e2e, file-system]

  # Utils aliases
  status: [sitrep, state, current, progress]
  help: [?, commands, list, menu]
  clear: [reset, clean, new-session]

# =============================================================================
# COMMAND CHAINS
# =============================================================================
# Predefined sequences of commands for common workflows
# =============================================================================

chains:
  full-story-cycle:
    name: "Complete Story Development"
    description: "Full cycle from planning to implementation"
    steps:
      - command: dev-story
        wait_for_completion: true
      - command: code-review
        wait_for_completion: true

  research-and-implement:
    name: "Research Driven Implementation"
    description: "Research before implementation"
    steps:
      - command: ado-research
        args: {query: "$ARGUMENTS"}
      - command: ado-planning
      - command: ado-implementation

  remediation-cycle:
    name: "Architecture Remediation"
    description: "Full remediation with validation"
    steps:
      - command: diagnostic
      - command: store-refactorer
        if: "god_store_detected"
      - command: component-splitter
        if: "god_component_detected"
      - command: typescript-fixer
        if: "ts_errors > 0"

# =============================================================================
# DEPRECATED COMMANDS (for migration)
# =============================================================================
# These commands are mapped to new equivalents for backward compatibility
# =============================================================================

deprecated:
  - old: /bmad
    new: /bm
    message: "Use /bm instead (shorter)"

  - old: /ralph-loop
    new: /loop
    message: "Use /loop instead (unified ASGL)"

  - old: /bmm-dev
    new: /dev
    message: "Use /dev instead"


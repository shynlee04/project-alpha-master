# BMAD Expert Analysis

**Purpose**: Run expert-analysis workflow from _bmad-ext

## What This Does

1. Loads `_bmad-ext/modules/governance/workflows/expert-analysis/workflow.md`
2. Executes the 4-step expert-analysis workflow:
   - Step 1: Initialize with context-first output
   - Step 2: Analyze codebase for actual implementation
   - Step 3: Compare approach vs reality
   - Step 4: Recommend (proceed/warn/stop)

## Issue Classification

| Level | Description | Examples |
|-------|-------------|----------|
| `quick_patch` | Wrong wiring, simple bug | Import fix, typo |
| `feature_fix` | Independent feature work | Single domain change |
| `architectural` | Cross-domain impact | Store refactoring, component splitting |

## When to Use

- After `/gov` context-first completes
- Before architectural changes
- When user approach needs validation

## Output

Generates: `_bmad-output/governance/expert-analysis-output-{date}.md`

# BMAD Remediation Router

**Purpose**: Route to correct remediation agent based on issue classification

## What This Does

1. Reads expert-analysis output to determine issue type
2. Routes to appropriate `_bmad-ext/modules/arc-v2/agents/`:
   - `store-refactorer.md` - God stores (>120 lines)
   - `component-splitter.md` - God components (>300 lines)
   - `workspace-architect.md` - File structure violations

## Routing Logic

```yaml
routing:
  stores:
    trigger: "store > 120 lines OR Epic CC-1/CP-1"
    agent: "arc-v2/agents/store-refactorer.md"

  components:
    trigger: "component > 300 lines OR god component"
    agent: "arc-v2/agents/component-splitter.md"

  workspace:
    trigger: "wrong layer OR cross-workspace duplication"
    agent: "arc-v2/agents/workspace-architect.md"
```

## When to Use

- After `/expert` classifies issue as `architectural`
- When god stores/components detected
- When file structure needs reorganization

## Output

Generates: `_bmad-output/refactors/{agent-name}-{date}.yaml`

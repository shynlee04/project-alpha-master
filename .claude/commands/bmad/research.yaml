# BMAD Research Trigger

**Purpose**: Run research-trigger workflow from _bmad-ext

## What This Does

1. Loads `_bmad-ext/modules/governance/workflows/research-trigger/workflow.md`
2. Conducts internet-based research to validate:
   - Technology choices
   - Trade-off analysis
   - Best practices
   - Anti-patterns to avoid

## When to Use

- After `/expert` detects flaws or tech choices
- When choosing between libraries/frameworks
- When validating architectural decisions
- When "not-the-best-practice" risks exist

## Research Categories

| Category | Questions Answered |
|----------|-------------------|
| Tech Choice | Which library? Which framework? |
| Trade-offs | Performance vs maintainability |
| Best Practice | Industry standards, anti-patterns |
| Architectural | Breaking changes, migration complexity |

## Output

Generates: `_bmad-output/governance/research-trigger-output-{date}.md`

# BMAD Governance Check

**Purpose**: Run context-first governance workflow from _bmad-ext

## What This Does

1. Loads `_bmad-ext/modules/governance/workflows/context-first/workflow.md`
2. Executes the 4-step context-first workflow:
   - Step 1: Scan domains
   - Step 2: Analyze context
   - Step 3: Contextualize prompt
   - Step 4: Transform user prompt with accurate context

## When to Use

- Before any architecture work
- Before refactoring
- When context might be stale (>4 hours)
- When starting a new feature

## Output

Generates: `_bmad-output/governance/context-first-output-{date}.md`

## Integration

This command bridges to the hop-reading workflow in _bmad-ext.
Only frontmatter loads on invocation - full workflow content loads on demand.

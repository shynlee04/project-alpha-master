# BMAD Exit Guard Hook

> Fires when: User attempts to exit Claude Code
> Purpose: Prevent data loss, save state, handle active loops

---

## Exit Checks

### 1. Unsaved Changes Detection

```bash
# Check for uncommitted changes
if git_status_has_changes():
    warn "You have uncommitted changes."
    ask "Commit before exit? (yes/no/skip)"
```

**Options:**
- **yes**: Run git commit with AI-generated message
- **no**: Exit without committing (user's choice)
- **skip**: Don't ask again for this session

### 2. Active Loop Check

```bash
# Check if Ralph Loop is active
Read: .claude/ralph-loop.local.md

if active == true:
    warn "Autonomous loop is still running!"
    ask "Pause loop before exit? (yes/no)"
```

**If yes:**
```bash
# Update loop state
echo "active: false" > .claude/ralph-loop.local.md
# Save iteration progress
echo "paused_at_iteration: ${current_iteration}" >> .claude/ralph-loop.local.md
```

**If no:**
```
⚠️ WARNING: Loop will continue running in background.
This may cause unexpected behavior when you return.
```

### 3. Session State Save

```bash
# Save AGENT-STATE.yaml
Write: .claude/AGENT-STATE.yaml
content:
  session:
    status: PAUSED
    end_time: {timestamp}
    duration: {calculated_duration}

  current:
    agent: {last_agent}
    story: {current_story}

  summary:
    actions_completed: {count}
    files_modified: {count}
    handoffs_completed: {count}
```

### 4. Continuation Prompt Generation

If session was active (more than 5 actions):

```bash
# Generate resume prompt
Write: .claude/continuation-prompt.md
content: |
  # Resume Session

  Last session: {session_id}
  Ended: {timestamp}
  Duration: {duration}

  ## Progress Summary
  - Stories completed: {count}
  - Current story: {story_id}
  - Next action: {next_action}

  ## Resume
  Type `/resume` to continue where you left off.
```


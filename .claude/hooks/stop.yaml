---

## Blocking Exit

Block exit (require action) when:

1. **Critical operation in progress**
   - Mid-git commit
   - Running migration
   - Active deployment

2. **Unsaved work with no history**
   - New files not tracked
   - Files never committed

3. **User confirms block**
   - "Don't let me forget to..."

**Action:** Show prompt, wait for user response before allowing exit.

---

## Clean Exit

When exit is allowed:

1. Save session state
2. Close open file handles
3. Generate continuation prompt
4. Display "Goodbye!" message

```
✅ Session saved safely
📝 Continuation prompt available
👋 Thanks for using BMAD!

Resume anytime with: /resume
```


# BMAD Input Enrichment Hook

> Fires when: User submits a prompt (before Claude processes it)
> Purpose: Add relevant context, validate input, prevent context overflow

---

## Execution Steps

### 1. Check Context Threshold

```python
# Pseudo-code for context check
current_usage = get_context_usage_percent()
threshold = 65

if current_usage >= threshold:
    # Block request, create continuation capsule
    generate_continuation_capsule()
    return "block"
```

**Action if threshold reached:**
1. Save current state to continuation capsule
2. Output JSON with `"decision": "block"`
3. Include capsule path for new conversation
4. New conversation loads capsule and continues

### 2. Extract User Intent

Parse user message for intent keywords:

```yaml
intent_keywords:
  implementation:
    - implement
    - develop
    - code
    - write
    - build
    - create
    - feature

  analysis:
    - analyze
    - review
    - audit
    - assess
    - diagnose
    - scan
    - check

  planning:
    - plan
    - design
    - architect
    - spec
    - estimate
    - roadmap

  orchestration:
    - loop
    - sprint
    - autonomous
    - orchestrate
    - coordinate

  governance:
    - governance
    - update agents.md
    - constitution
    - standard
```

### 3. Match Against Routing Rules

```bash
# Load routing rules
Read: _bmad-ext/orchestrator/routing-rules.yaml

# Match intent to agent/workflow
if intent in routing_rules:
    route_to = routing_rules[intent]
    preload_standards_for(route_to)
```

### 4. Pre-load Relevant Standards

Based on matched route, load skill frontmatter:

```yaml
standard_preloading:
  implementation:
    - .claude/skills/backend-api/SKILL.md (frontmatter only)
    - .claude/skills/frontend-components/SKILL.md (frontmatter only)
    - .claude/skills/testing-test-writing/SKILL.md (frontmatter only)

  analysis:
    - .claude/skills/bmad-orchestrator/SKILL.md (frontmatter only)

  planning:
    - .claude/skills/global-coding-style/SKILL.md (frontmatter only)

  orchestration:
    - .claude/skills/asgl/SKILL.md (frontmatter only)
```

**Important:** Load only frontmatter (YAML between `---` markers), not full content.

### 5. Check Protected Paths

If user message contains edit/write operations:

```bash
# Check if target is protected
for path in extract_paths(user_message):
    if path in PROTECTED_PATHS:
        add_warning(path)
```

**Protected paths:**
- `CLAUDE.md` - Project constitution
- `AGENTS.md` - Agent registry
- `LOOP_STATE-*.yaml` - Loop state files
- `_bmad/core/config.yaml` - BMAD core config

**Action for protected paths:**
- Add explicit confirmation requirement
- Explain why protection exists
- Offer to create handoff for governance update

---

## Output

Enrich user prompt with:

```markdown
---
_context_added:
  intent: {detected_intent}
  route_to: {agent/workflow}
  skills_preloaded: [{skill_list}]
  protected_paths: [{paths if any}]
---
```

---

## Special Cases

### Case: Loop State Update Request

If user says "update loop state" or similar:

```yaml
action: verify_loop_awareness
steps:
  1. Check LOOP_STATE-child.yaml timestamp
  2. If > 4 hours old → warn user about staleness
  3. Ask: "Do you want to update the loop state first?"
  4. If yes → run loop-state-update workflow
  5. If no → proceed with original request (with warning)
```

### Case: Context Poisoning Prevention

If user message references old conversation:

```yaml
action: detect_context_poison
indicators:
  - "As I said before..."
  - "Continuing from..."
  - "Remember that..."
  - References to messages > 6 cycles old

response: verify_context
steps:
  1. Check if referenced content is in current context
  2. If not → warn user about potential hallucination
  3. Offer to search artifacts for referenced content
  4. If found → reload artifact
  5. If not found → proceed without reference (warn user)
```

---

## Token Efficiency

**Load order:**
1. Always: routing rules index (fast lookup)
2. On match: skill frontmatter only (~500 tokens per skill)
3. On explicit need: full skill content
4. On request: supporting files

**Never load:**
- Full workflow content unless explicitly executing
- Historical artifacts unless referenced
- Multiple standards simultaneously

